<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Street Updates by Podor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}
</style>
</head>

<script type="application/json" id="embedded-snap">{"date":"2026-10-12","updatedAt":"2026-10-12T22:30:00Z","P":{"today":{"h":"The Barrel Re-Arms Above $106 — and the AI Complex Splits","d":"","badges":["S&P 7,807 -0.06%","Nasdaq 27,246 -0.44%","Dow +0.38%","10Y 5.24% 0bp","Brent $106.65"],"c1":"Oil re-armed and the tape split in two. With the bond market closed for Columbus Day and no data on the calendar, Monday's signals came from the barrel and the chip complex — and they pointed opposite ways. Oil opened lower as traders tested Trump's Russian-diesel deal, then reversed as the weekend's escalation landed: a Saturday Houthi strike on Riyadh's airport killed 13 and wounded more than 300, tankers were hit near Oman's Sohar and transiting Hormuz, and Ukraine accused Russia of violating the announced 'energy ceasefire.' Brent settled at $106.65 (+1.8%) after trading at its highest since Sept. 29, and WTI at $93.74 (+2.1%) — up a third straight session — and energy led all 11 sectors (+1.4%). The Dow rose 0.38%, helped by a 2.1% rise in Salesforce on a Bank of America double upgrade, but the AI complex split hard: memory names slid on China's CXMT progress (Micron -3.9%, SK Hynix -4.0%, Samsung -4.0%) and last week's optical winners unwound (Lumentum -9.8%, Ciena -10.0%, Coherent -7.9%, Corning -6.0%), leaving the Nasdaq -0.44% and the S&P 500 essentially flat (-0.06%, about 12 points below Tuesday's record close). Friday's telecom losers bounced (T-Mobile +2.2%, Verizon +2.7%, AT&T +1.4%). The dollar firmed to 102.59 (+0.4%, near an 18-month high), gold slipped 0.6% (Dec futures $4,190.3), bitcoin traded around $82.8k, and the VIX rose to 15.21 (+2.5%). Next: bank earnings Tuesday morning and CPI Wednesday.","c4":"<ul class='play'><li>Earnings' first referee: JPMorgan, Goldman Sachs, Wells Fargo and Citigroup report Tuesday morning with J&J and UnitedHealth — bank shares enter the week already in correction, so the commentary may matter more than the numbers.</li><li>Inflation week: Wednesday's CPI is expected at 3.7% y/y — the highest since May — with PPI and retail sales Thursday; a hot print re-arms the hike trade (December ~85%) and pressures the long end.</li><li>The two live fault lines: the barrel (escalation vs diesel diplomacy — $106.65 Brent remains the fastest inflation valve) and the AI complex (optics and memory unwinding while megacaps hold — dispersion inside tech is still the signature).</li></ul>","kpi":[["S&P","7,807.24","-0.06%",0],["Nasdaq","27,245.90","-0.44%",0],["10Y","5.24%","0bp",0],["WTI","$93.74","+2.1%",1]],"tbl":[["S&P","7,811.54","7,807.24","-0.06%"],["Dow","51,654.95","51,850.55","+0.38%"],["Nasdaq","27,366.17","27,245.90","-0.44%"],["10Y","5.24%","5.24%","0bp"],["WTI","$91.85","$93.74","+2.1%"],["Gold","$4,216.3","$4,190.3","-0.6%"]],"labels":["10/2","10/5","10/6","10/7","10/8","10/9","10/12"],"data":[7722.7,7774,7818.9,7801.8,7765.4,7811.5,7807.2],"chains":[{"t":"① The Barrel Re-Arms: Escalation Over Diplomacy — and the Tape Splits","main":1,"steps":["The overnight test: oil slips early as traders weigh Trump's Russia diesel deal and Sunday's announced 'energy ceasefire' against the weekend's escalation","The counter: a Saturday Houthi strike on Riyadh's airport killed 13 and wounded more than 300; a tanker was struck by a drone near Oman's Sohar and another damaged transiting Hormuz (UKMTO); Ukraine accused Russia of violating the energy ceasefire","The bid returns: Brent settles at $106.65 (+1.8%) after trading at its highest since Sept. 29; WTI at $93.74 (+2.1%), up a third straight session","The read-through: energy leads all 11 sectors (+1.4%) — the barrel is still the fastest inflation valve on the board","The tape: with the bond market closed (10Y held at 5.24%), nothing offset the crude bid — the S&P closed at 7,807.24 (-0.06%), about 12 points below Tuesday's record close; Nasdaq -0.44%; Dow +0.38%","The pressure gauge: VIX 15.21 (+2.5%); the dollar +0.4% to 102.59, near an 18-month high"],"d":"One chain explains the day's 60%: the barrel re-armed on fresh escalation, energy paid — and with no rates market open, the tape had nothing to lean against.","news":[{"time":"10/12 close","fact":"Oil prices rose Monday as investors mulled developments including word from Saudi Arabia that it had intercepted more missiles and drones launched from Iran-backed Houthi rebels in Yemen following deadly weekend attacks at the Riyadh airport, where operations remain suspended. President Donald Trump yesterday said Russia and Ukraine had agreed to an 'energy ceasefire.'","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12 close","fact":"Front Month Nymex Crude for Nov. delivery gained $1.89 per barrel, or 2.06% to $93.74 today — up for three consecutive sessions and at its highest settlement value since Thursday, Sept. 24; month-to-date it is up 3.67% and year-to-date it is up 63.25%.","src":"Dow Jones (Data Talk)","u":"https://www.morningstar.com/news/dow-jones/202610125875/front-month-nymex-crude-rose-206-to-settle-at-9374-data-talk"},{"time":"10/12","fact":"CRUDE WRAP: WTI (X6) settles USD 1.89 higher at 93.74/bbl; Brent (Z6) settles USD 1.93 higher at 106.65/bbl. Into settlement, WTI and Brent came slightly off highs, having ground higher all day amid renewed Middle East uncertainty.","src":"Newsquawk","u":"https://www.newsquawk.com/headlines/crude-wrap-wti-x6-settles-usd-189-higher-at-9374bbl"},{"time":"10/12","fact":"Oil prices were up 2% at near two-week highs as attacks on Saudi Arabia overshadowed the prospect of increased supplies. Rebounding from earlier losses, Brent crude futures were up $2.04, or 2%, to $106.76 a barrel at 11:07 a.m. EDT (intraday) — their highest since September 29; US West Texas Intermediate was at $93.69, up $1.84.","src":"Reuters","u":"https://gvwire.com/2026/10/12/oil-prices-rise-2-as-attacks-on-saudi-arabia-overshadow-trumps-diesel-deal/"}]},{"t":"② The AI Complex Splits: Optics Unwind, Memory Wounded, Megacaps Hold","steps":["The unwind: the optical/photonics group that led last week's rally gets sold — Lumentum -9.8%, Ciena -10.0%, Coherent -7.9%, Corning -6.0%, Applied Optoelectronics -8.2%","No company-specific catalyst: the selloff read as 'sell the news' around the OCP Global Summit showcase and profit-taking after a historic run — LITE entered the day up ~170% year-to-date","The memory leg: Micron -3.9%, SK Hynix -4.0%, Samsung -4.0%, Sandisk -6.0% after China's CXMT announced progress on a new memory-cell design (server product targeted by end-2026)","The ETFs: Roundhill Memory (DRAM) -4.3% and SOXX -2.6% — info tech the S&P 500's worst sector","The counterweight: megacaps held — MAGS +0.3% (Meta +3.4% on the Muse Wonder launch); Nvidia -1.3% the drag"],"d":"The day's other engine: the AI complex split three ways — optics unwound, memory sold on Chinese competition, and the megacaps held the line.","news":[{"time":"10/12 close","fact":"Shares of Ciena, Lumentum Holdings and Coherent closed down 10%, 9.8% and 7.9%, respectively, while shares of Cisco Systems, Corning and Lumen Technologies fell 2.6%, 6% and 4.3%. Marvell Technology's stock lost 3.4%. Artificial-intelligence stocks came under pressure Monday, with optical and networking stocks among the leading decliners.","src":"MarketWatch","u":"https://www.marketwatch.com/story/why-ciena-lumentum-and-other-optical-stocks-were-among-the-markets-biggest-losers-on-monday-b3e53f6a"},{"time":"10/12","fact":"The selloff hit AI optical networking names across the board, with no company-specific announcement, earnings release, or analyst action serving as the trigger for the decline. The move appears rooted in a 'sell the news' dynamic surrounding the 2026 OCP Global Summit in San Jose, where optical networking and AI-infrastructure companies showcased next-generation connectivity technologies investors had already priced into the group's elevated valuations — leaving the group exposed to profit-taking.","src":"Investing.com","u":"https://ca.investing.com/news/stock-market-news/why-is-ciena-stock-tumbling-today-93CH-4876766"},{"time":"10/12","fact":"Memory makers Micron and SK Hynix saw their stocks fall after Chinese memory maker ChangXin Memory Technologies (CXMT) announced significant progress on a new memory-cell design aimed at increasing storage density. CXMT aims to introduce a new server memory product built on the architecture by the end of 2026, company president Cao Kanyu said at an industry event in Shanghai over the weekend. Samsung Electronics tumbled 4% alongside the broader South Korean stock market.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-monday-october-12-dow-sp-500-nasdaq-080321571.html"},{"time":"10/12 close","fact":"Roundhill's Memory ETF (DRAM) and the broader iShares Semiconductor ETF (SOXX) were down 4.3% and 2.6%, respectively. The S&P 500 Information Technology Sector was the index's worst performer, with photonics and optical stocks Lumentum, Ciena, Coherent, and Corning among the biggest decliners.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12","fact":"Meta's vast investments in its Meta Superintelligence Labs continue to pay dividends, as the company unveiled its AI models, Muse Wonder and Muse Wonder Full, on Monday — designed to provide 'state-of-the-art' performance across personal and professional AI agents. Meta's shares gained more than 3% after CEO Mark Zuckerberg told the Financial Times that Muse Wonder has caught up with frontier AI labs.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-monday-october-12-dow-sp-500-nasdaq-080321571.html"},{"time":"10/12","fact":"Lumentum's order book is booked solid through early 2029, yet its stock is leading the entire AI optics sector lower — the Roundhill Photonics & Optics ETF (LYTE) was down 7%, with the damage staying inside one corner of the market (SPY essentially flat). None of the three companies issued a new press release ahead of the decline.","src":"24/7 Wall St.","u":"https://247wallst.com/investing/2026/10/12/lumentum-falls-10-as-optics-selloff-hits-hardest-where-capacity-is-sold-out-applied-optoelectronics-drops-7-coherent-slides-7/"}]},{"t":"③ The Reversal and the Wildcards: Friday's Losers Bounce, a $1B Take-Private","steps":["The bounce: Friday's SpaceX-shocked carriers retraced a step — T-Mobile +2.2%, Verizon +2.7%, AT&T +1.4%; SpaceX itself +0.5%","The towers held their re-rating: Crown Castle +1.7%, American Tower +0.2%, SBA Communications +1.0%","The wildcard: Bumble +49.6% — the WSJ reported advanced talks to go private at ~$1B (Ithaca Holdings), the day's biggest single-name move","The single-name shocks: eBay +2.2% (Morgan Stanley 'Top Pick', target to $132); Chipotle -3.8% (Starbucks: 'not buying Chipotle'); Amazon -1.1% (WSJ: in talks to buy Decart for ~$7B)","The value bid: Salesforce +2.1% on a Bank of America double upgrade led the Dow's advance"],"d":"Under the flat tape: Friday's extremes mean-reverted, and the day's biggest single-name move was a $1 billion take-private report.","news":[{"time":"10/12 close","fact":"Shares of T-Mobile US (TMUS), AT&T (T), and Verizon Communications (VZ) rose after dropping Friday on news that Elon Musk-led SpaceX (SPCX) agreed to acquire a nationwide low-band spectrum license portfolio. SpaceX, which rose more than 1% last session, advanced 0.5% further.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12","fact":"Bumble is in advanced talks to be taken private by Ithaca Holdings in a deal that values the dating app operator at roughly US$1 billion, a source familiar with the matter told Reuters on Monday. Shares of the Austin, Texas-based company, which had a market value of roughly $389 million through last close, surged around 50 per cent to $3.81 following the report.","src":"BNN Bloomberg (Reuters)","u":"https://bnnbloomberg.ca/business/company-news/2026/10/12/dating-app-bumble-in-advanced-talks-to-go-private-at-us1-billion-valuation-source-says"},{"time":"10/12","fact":"Morgan Stanley named eBay a 'Top Pick' and lifted its price target on the stock to $132 from $127 while maintaining an 'overweight' rating, saying the e-commerce company's 'GMV growth acceleration has surprised even the most bullish investors.'","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12","fact":"Chipotle Mexican Grill (CMG) shares are falling after a Starbucks spokesperson told CNBC that the coffee chain 'is not buying Chipotle.' Four days ago, Chipotle shares jumped more than 6% after the Financial Times reported Starbucks had been working with advisors to make an offer to acquire the restaurant chain.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12 close","fact":"Amazon (AMZN) shares were down 1.1% following a report in The Wall Street Journal that it is in talks to buy software firm Decart for around $7 billion.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12","fact":"The Dow edged higher as investors rotated into value stocks, while tech weakness pressured the Nasdaq and crude oil climbed to $106 per barrel amid Middle East developments.","src":"The Motley Fool","u":"https://www.fool.com/coverage/stock-market-today/2026/10/12/stock-market-midday-oct-12-dow-edges-higher-as-investors-rotate-into-value-stocks/"}]},{"t":"④ The Offsets: Diesel Diplomacy Meets Skepticism — and the Strategist Bid","steps":["The supply lever: Trump's deal — 300,000 metric tons (~2.25M barrels) of Russian diesel immediately, 500,000 tons in November, 1M after; global daily diesel consumption runs near 29M barrels (IEA)","The early response: ICE gasoil -2.3% to $1,449 a metric ton; 'The immediate impact of the deal is questionable, as Russia's refining capacity has been severely reduced' (PVM)","The friction: six bipartisan senators called on the administration to 'immediately reverse course' on the deal, citing sanctions policy; analyst Jim Ritterbusch: the coming volumes 'don't appear capable of forcing much additional downside price pressure'","The other lever: Russia's Novak said governments are in talks on supply and Russia 'may reach 3-3.5mln tons of diesel exports' by year-end","The strategist bid: Goldman Sachs raised its three-month view on global stocks to overweight from neutral — 'the recent valuation de-rating has improved asymmetry' (Mueller-Glissmann)","The restarts: Gulf of Mexico majors (Shell, Chevron, BP) began restoring output after Isaias made landfall Saturday"],"d":"The offsets to Monday's pressure: diesel diplomacy capped the early spike, the Gulf restarted, and strategists leaned into the de-rating ahead of earnings.","news":[{"time":"10/12","fact":"Trump said Russia will immediately supply more than 300,000 metric tons (2.25 million barrels) of diesel to US and global markets, with another 500,000 tons in November and a further 1 million tons 'immediately thereafter'. The daily diesel consumption globally is forecast at close to 29 million barrels, according to the International Energy Agency.","src":"Yahoo Finance (Reuters)","u":"https://finance.yahoo.com/markets/live/stock-market-today-monday-october-12-dow-sp-500-nasdaq-080321571.html"},{"time":"10/12","fact":"A bipartisan group of six senators on Sunday called on the Trump administration to 'immediately reverse course' on the deal, arguing that the move conflicts with U.S. sanctions policy toward Russia.","src":"TheStreet","u":"https://www.thestreet.com/stock-market-today/stock-market-today-oct-12-2026-dow-futures-climb-as-wall-street-gears-up-for-busy-week"},{"time":"10/12","fact":"Goldman Sachs strategists are turning positive on global stocks for the short term, citing a boost from strong earnings; they raised their three-month view on stocks to overweight from neutral. 'Earnings growth remains supportive for equities and the recent valuation de-rating has improved asymmetry into the third-quarter earnings season,' Mueller-Glissmann said. Analysts expect S&P 500 companies to post a 25% jump in third-quarter profits, according to data compiled by Bloomberg Intelligence.","src":"Yahoo Finance (Bloomberg)","u":"https://finance.yahoo.com/markets/live/stock-market-today-monday-october-12-dow-sp-500-nasdaq-080321571.html"},{"time":"10/12","fact":"ICE gasoil futures fell 2.3% to $1,449 per metric ton. 'The immediate impact of the deal is questionable, as Russia's refining capacity has been severely reduced,' PVM analyst Tamas Varga said. 'The release will be developing gradually through the rest of this year and the expected amounts during the coming month don't appear capable of forcing much additional downside price pressure,' said analyst Jim Ritterbusch. In the Gulf of Mexico, energy majors Shell, Chevron and BP were seeking to redeploy personnel and restore production after Hurricane Isaias made landfall early on Saturday.","src":"Reuters","u":"https://gvwire.com/2026/10/12/oil-prices-rise-2-as-attacks-on-saudi-arabia-overshadow-trumps-diesel-deal/"},{"time":"10/12","fact":"Russia's Novak, on the diesel supply deal with Trump, stated there are talks between the governments of Russia and US on supply and that they have the possibility to make additional supplies of diesel on global markets — and by year-end Russia may reach 3-3.5mln tons of diesel exports.","src":"Newsquawk","u":"https://www.newsquawk.com/headlines/crude-wrap-wti-x6-settles-usd-189-higher-at-9374bbl"}]},{"t":"⑤ The Gates: Earnings Week Opens — and the Bull Turns Four","steps":["Tuesday's referees: JPMorgan, Goldman Sachs, Wells Fargo and Citigroup report, with Johnson & Johnson and UnitedHealth before the bell — bank shares enter in correction (KBW index more than 14% off its August peak)","The week's data: September CPI Wednesday (expected 3.7% y/y, up from 3.4%; core 2.5%), then PPI and retail sales Thursday","The odds: ~18% for an October hike, ~85% by December (CME FedWatch)","The milestone: the bull market turned four on Monday — with strategists still expecting more room, against AI-bubble, yield and geopolitical hurdles","The stakes: earnings must validate the year's AI-and-earnings carry — starting with the banks' read on consumers and dealmaking"],"d":"The gates into a loaded week: banks first, then inflation — and a four-year-old bull that still needs earnings to keep carrying it.","news":[{"time":"10/12 close","fact":"Earnings season kicks into high gear tomorrow with several big banks — JPMorgan Chase, Goldman Sachs, Wells Fargo, and Citigroup — reporting. Johnson & Johnson and UnitedHealth Group are also slated to issue results before the bell.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12","fact":"A widely watched report on the Consumer Price Index from the Bureau of Labor Statistics on Wednesday is likely to show consumer prices rose 3.7% over 12 months through September, up from a 3.4% annual increase in August, according to a survey of economists. The 'core' index, which excludes volatile energy and food prices, is expected to have risen 2.5% annually in September, up from 2.4% in August.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12","fact":"Markets have pared bets on a Fed rate hike this month, with traders pricing in an 18% chance of an increase, while still seeing an 85% probability of a hike by December, according to CME's FedWatch tool.","src":"Kitco (Reuters)","u":"https://www.kitco.com/news/off-the-wire/2026-10-12/gold-slips-one-week-high-firm-us-dollar-weighs"},{"time":"10/12","fact":"The bull market turned four on Monday, with many strategists expecting more room for stocks to run. However, concerns over an AI bubble, elevated Treasury yields, and geopolitical uncertainty present hurdles.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-monday-october-12-dow-sp-500-nasdaq-080321571.html"},{"time":"10/12","fact":"Share prices across the entire banking sector have flat-out crashed, placing many top names in correction territory — down 10% from their highs. Over the past month, JPMorgan has shed 6%, Citigroup is down 6.5%, Wells Fargo is off 7%, Morgan Stanley is down 11%, Goldman Sachs is down 12%, and Bank of America is down 13%. Even the KBW Nasdaq Bank Index is now down more than 14% from its August peak.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-monday-october-12-dow-sp-500-nasdaq-080321571.html"}]}]},"mtd":{"h":"October, Eight Sessions In: +2.03% — Records Re-Tested, and Two Repricings","d":"S&P 7,651.5 to 7,807.24 (+2.03% MTD): eight sessions delivered two record closes, a 2002-ceiling re-tested at 24-year highs — and two single-theme shocks: wireless (SpaceX) and the AI complex.","badges":["S&P MTD +2.03%","Nasdaq +1.43%","10Y -5bp","Brent +8.8%"],"c1":"Eight sessions into October, the month has its arc: two record closes (the first above 7,800), the 2002 ceiling re-tested three times at 24-year highs, the AI revenue scare walked back within a day — and now two single-theme repricings: Friday's wireless shock and Monday's unwind in AI optics and memory. The S&P is +2.03% MTD at 7,807.24, the Nasdaq +1.43%, the Dow +1.86%. The fuel: October odds at ~18%, a live deal tape, AI compounding. The tax: a 10Y that ends the window at 5.24% (-5bp MTD) after printing fresh 24-year highs; the barrel at $106.65 Brent (+8.8% on the December basis); gold +0.1%; the dollar +1.1%. Beneath: Energy (+7.3%) and Utilities (+5.6%) lead sectors, while Tech (+0.3%) has slid to the bottom of the pack. Gates: CPI (Oct 14), the Oct 28 meeting — and earnings must validate the AI revenue math.","c4":"<ul class='play'><li>October's verdict so far: dovish odds + a live deal tape + AI compounding beat the 10Y — but only while the 10Y stays under its 24-year highs; the ceiling is tested, not removed.</li><li>The dispersion signature keeps compounding: the barrel's beneficiaries and bottlenecks get paid; wireless incumbents and (now) AI optics and memory get taxed.</li><li>Earnings season is the month's referee — the ~25% Q3 profit expectation (Bloomberg Intelligence) is what the records are priced against.</li></ul>","kpi":[["S&P MTD","+2.03%","eight sessions",1],["Nasdaq","+1.43%","records",1],["10Y MTD","-5bp","ceiling held",1],["WTI MTD","+3.7%","re-armed",1]],"tbl":[["S&P","7,651.54","7,807.24","+2.03%"],["Dow","50,906.05","51,850.55","+1.86%"],["Nasdaq","26,861.06","27,245.90","+1.43%"],["10Y","5.29%","5.24%","-5bp"],["WTI","$90.42","$93.74","+3.7%"],["VIX","16.34","15.21","-6.9%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12"],"data":[7651.5,7666.5,7722.7,7774,7818.9,7801.8,7765.4,7811.5,7807.2],"chains":[{"t":"① Eight Sessions, One Arc: the Records, the Ceiling — and Two Shocks","main":1,"steps":["The opening stretch: records — the first close above 7,800 and a Nasdaq record close — even as the 10Y pushed toward 24-year highs","Mid-window: the 2002 ceiling re-tested three times at 24-year highs — each re-test still bought at auction","Week two's scare: the AI revenue question lands (10/8) and is walked back within a session (10/9)","Then two single-theme repricings in two sessions: the wireless chain (10/9) and the AI complex (10/12)","The fuel: October odds at ~18%, a live deal tape, AI compounding; the tax: a 10Y that touched 24-year highs and ends at 5.24% (-5bp MTD)"],"d":"October so far: a record run met the 2002 ceiling, one scare walked back — then two repricings in two sessions; dispersion is still the signature.","news":[{"time":"10/12 close","fact":"Stocks surged Friday, pushing the major indexes to weekly gains, as tech shares rebounded from the previous session's sell-off. The S&P 500 logged the best result, rising 1.2%, while it was the Nasdaq's fourth consecutive weekly gain. The 10-year Treasury yield ended the week around 5.24%, two days after it briefly neared 5.37%, its highest level in more than 24 years.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"},{"time":"10/12","fact":"Markets have pared bets on a Fed rate hike this month, with traders pricing in an 18% chance of an increase, while still seeing an 85% probability of a hike by December, according to CME's FedWatch tool.","src":"Kitco (Reuters)","u":"https://www.kitco.com/news/off-the-wire/2026-10-12/gold-slips-one-week-high-firm-us-dollar-weighs"}]},{"t":"② The Month's Split: Inflation Beneficiaries Lead — and Two New Fault Lines","steps":["Sector map: Energy (+7.3%), Utilities (+5.6%) and Staples (+4.7%) lead; Tech (+0.3%) sits at the bottom of the pack","Breadth warning: Goldman Sachs flags the narrowest participation since the dotcom bubble, with the median stock nearly 20% off its highs — the split lives under the index","The AI complex wobbled twice (10/8, 10/12): the first scare was walked back within a session; Monday's unwind stuck","Rate-sensitives mixed: Health (+2.1%) and Real Estate (+2.5%) positive, while the wireless repricing left Comms (+0.4%) near flat","The signature: dispersion inside sectors, not direction at the index"],"d":"October's template: own the barrel's beneficiaries and the bottlenecks; the repricings — wireless, then AI — keep re-cutting the losers.","news":[{"time":"10/9 close","fact":"Shares of the country's largest telecommunications giants are slumping amid worries about growing competition from SpaceX.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10092026-12165767"},{"time":"10/9 close","fact":"Front Month ICE Brent Crude for Dec. delivery gained $2.47 per barrel, or 2.42% to $104.72 this week — up for two consecutive sessions.","src":"Dow Jones (Data Talk)","u":"https://www.morningstar.com/news/dow-jones/202610096010/front-month-ice-brent-crude-rose-242-this-week-to-settle-at-10472-data-talk"}]},{"t":"③ The Barrel, Week Two: Re-Armed Again Above $100","steps":["The bid stack: the heaviest tanker-attack week of the war, strike-risk headlines, Isaias shut-ins re-armed the war premium above $100","Policy answered twice: the IEA's accelerated release (~100M barrels still to come) — and the Russia diesel deal","The re-arm: Monday's escalation met the supply promises — and the barrel finished the window at its highs","The numbers: Brent from ~$98 (Dec basis) to $106.65 (+8.8% MTD); WTI +3.7% to $93.74","The band: $100-107, with spikes sold and dips bought all month"],"d":"The barrel's week two: supply shocks met policy supply — and the market bought both sides of the $100-107 band.","news":[{"time":"10/8","fact":"Approximately 62.9% of daily offshore oil production, or 1.28 million barrels per day, has been shut in as Hurricane Isaias strengthens ahead of an expected landfall — a sharp increase from Wednesday, when operators reported about 25% of Gulf oil production offline.","src":"gCaptain","u":"https://gcaptain.com/hurricane-isaias-shuts-down-nearly-two-thirds-of-gulf-oil-production"},{"time":"10/8","fact":"Last week already saw the biggest number of attacks on tankers in the Strait of Hormuz since the Iran war began — cutting the number of vessels trying to get through to the lowest in more than two months.","src":"Reuters (Al-Monitor)","u":"https://www.al-monitor.com/originals/2026/10/attack-risks-rise-tankers-iran-vows-block-more-hormuz-routes"}]}]},"qtd":{"h":"Q4's First Eight Sessions: +2.03% — Records, a Ceiling, and Two R <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
