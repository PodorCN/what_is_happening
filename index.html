<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Street Updates by Podor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}
</style>
</head>

<script type="application/json" id="embedded-snap">{"date":"2026-10-19","updatedAt":"2026-10-19T21:16:03Z","label":"2026-10-19 Monday close","P":{"today":{"h":"The AI Trade's Reprieve: a Chip Bounce Lifts the Nasdaq 1.1% — With Only Three Sectors Green","d":"","badges":["S&P 7,690 +0.41%","Nasdaq 26,431 +1.11%","Dow -0.07%","10Y 5.15% +6bp","Brent $109.55 -0.3%"],"c1":"<b>The AI trade got a reprieve.</b> The Nasdaq rose 1.11% to 26,430.89 and the S&P 500 0.41% to 7,690.73; the Dow slipped 36.38 points (0.07%) to 51,966.03. Chips snapped their longest slide since 2008 — SOXX +1.7%, SMH +1.6% — with WDC +6.1%, SNDK +5.5%, STX +3.4%, MU +3.0%, MRVL +4.1%, AMD +1.8%, INTC +2.4% and NVDA +1.4%. Amazon added 5.0% on Morgan Stanley's top-pick call; Tesla 3.8% before Wednesday's results. But breadth was thin: only three of 11 sector ETFs closed green, utilities -2.0% and real estate -1.2% as the 10Y rose 6bp to 5.15% and French protests lifted yields across Europe; the euro slipped 0.2%, the dollar rose to 102.0. Oil split by contract: Brent settled $109.55 (-0.3%) after ranging $107-$110 on Trump's Russia waiver, while WTI's expiring November contract settled $103.66 (+2.2%) and December $98.54 (-0.5%). Gold -0.5% to $4,160.7; bitcoin +0.4% to ~$81.9k; VIX -7.8% to 18.44.","c4":"<ul class='play'><li>The AI trade's tell is breadth, not the index: a 1.1% Nasdaq day with three sectors green is a repair, not a rotation — watch whether chips hold their gains past Wednesday's Meta and Tesla prints.</li><li>The rate file is the binding constraint: the 10Y at 5.15% (+6bp) charged utilities (-2.0%) and REITs (-1.2%) on a day tech rose — a clean test of which side of the book can pay for duration.</li><li>The barrel is a contract story as much as a war story: WTI's November settle at $103.66 (+2.2%) versus December's $98.54 (-0.5%) is expiry mechanics — don't read the front-month pop as a fresh escalation.</li><li>Next gates: Meta and Tesla on Wednesday, then the FOMC on Oct 27-28 — with October odds ~16%, the market's base case is a hold; December ~92% is where the risk lives.</li></ul>","kpi":[["S&P","7,690.73","+0.41%",1],["Nasdaq","26,430.89","+1.11%",1],["10Y","5.15%","+6bp",0],["Brent","$109.55","-0.3%",0]],"tbl":[["S&P","7,659.44","7,690.73","+0.41%"],["Dow","52,002.41","51,966.03","-0.07%"],["Nasdaq","26,140.03","26,430.89","+1.11%"],["10Y","5.09%","5.15%","+6bp"],["WTI","$101.41","$103.66","+2.2%"],["Gold","$4,180.9","$4,160.7","-0.5%"]],"labels":["10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19"],"data":[7773.95,7818.93,7801.77,7765.36,7811.54,7807.24,7805.45,7718.94,7744.06,7659.44,7690.73],"chains":[{"t":"① The AI Trade's Reprieve: Chips Snap the Longest Slide Since 2008","main":1,"steps":["The setup: last week the Nasdaq fell 4.5% — its worst week since June — and the S&P 2%; chipmakers logged their longest losing streak since 2008, with SOXX down 4% on Friday alone","The turn: dip buyers met the open — the VanEck Semiconductor ETF climbed nearly 3% by midday, on pace to end a nine-day losing streak (CNBC) — as investors bet the AI investment boom still supports earnings","The leadership: memory and semis led — WDC +6.1%, SNDK +5.5%, STX +3.4%, MU +3.0%, MRVL +4.1%, AMD +1.8%, INTC +2.4%, NVDA +1.4%","The fade: SOXX closed +1.7% after trading +3.7% early; SMH +1.6% after +3% midday; CoreWeave went from +7% to -0.4% — the bid thinned into the close","The scoreboard: Nasdaq +1.11% to 26,430.89, S&P +0.41% to 7,690.73, Dow -0.07% to 51,966.03, Russell 2000 +0.25% — a tech repair, not a broad rally"],"d":"The reprieve: a nine-session chip slide met dip buyers — enough to lift the Nasdaq 1.1%, not enough to broaden the tape.","news":[{"time":"10/16 (intraday)","fact":"Another burst of selling in technology shares drove the Nasdaq 100 to its worst week since the April 2025 tariff turmoil as investors questioned the outlook for the artificial-intelligence trade. Chipmakers fell for an eighth straight day, the longest slide since 2008. CoreWeave Inc., a cloud-computing services provider whose bonds recently hit levels that typically signal distress, sank 12%. The S&P 500 lost 1.1%. The chip slide reached nine sessions with Friday's close.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-stocks-post-longest-losing-streak-since-2008%3a-markets-wrap/92225060"},{"time":"10/19","fact":"The S&P 500 rose 0.4%, coming off its worst week since June, and the Nasdaq composite rallied 1.1% because it's full of technology stocks. The majority of U.S. stocks outside of AI and tech fell, though, and the Dow Jones Industrial Average swung between losses and gains before finishing with a drop of 36 points, or 0.1%.","src":"AP","u":"https://apnews.com/article/stocks-markets-oil-us-ai-494fbe4361a0360b2f6368e7a6d8f058"},{"time":"10/19","fact":"A rebound in chipmakers buoyed the stock market as dip buyers emerged on bets the artificial-intelligence investment boom will continue to support solid earnings. Following a rout in one of the most-crowded bets, a gauge of chip giants climbed 1.6%. The Nasdaq 100 added 1.2%.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/nasdaq-100-climbs-on-ai-trade-revival-after-rout%3a-markets-wrap/92235911"},{"time":"10/19","fact":"AI-tied stocks were among the biggest risers Monday. Roundhill's Memory ETF (DRAM) rebounded 4% following a nearly 6% decline Friday, with components Western Digital, Sandisk, Micron Technology and Seagate Technology advancing up to roughly 6%. The broader iShares Semiconductor ETF (SOXX) closed up almost 2% after a 4% drop to end last week, with component Intel rising 2.5% in part because of a rating upgrade from JPMorgan. Nvidia rose nearly 1.5%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10192026-12181593"},{"time":"10/19","fact":"Chip stocks rallied Monday, on pace to end a nine-day losing streak. In midday trading, the VanEck Semiconductor ETF (SMH) climbed nearly 3%, fresh off nine consecutive losing days, as traders flocked back to the tech space and took a risk-on posture. Nvidia gained about 2% and Advanced Micro Devices added 3%; Marvell also added nearly 7%.","src":"CNBC","u":"https://www.cnbc.com/2026/10/18/stock-market-today-live-updates.html"},{"time":"10/19","fact":"The S&P 500 opened at 7,702.77, traded as high as 7,731.18 and closed at 7,690.73; the Nasdaq Composite's session high was 26,613.15 against a 26,430.89 close.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/%5EGSPC/history/"}]},{"t":"② The Narrow Tape: a 5.15% 10Y, a French Shock — and Three Sectors Green","steps":["The rate leg: the 10Y rose 6bp to 5.15% and the 30Y 5bp to 5.48% — the move came even as the Nasdaq rallied","The French source: weekend protests drove European indexes more than 1% lower, lifted French yields and pushed the euro down 0.2%; the dollar rose 0.2% to 102.0","The domestic bill: utilities -2.0%, real estate -1.2%, financials -0.8% and staples -0.5% — the rate-sensitive cohorts paid for the 10Y; Ameriprise fell 4% on a BofA downgrade","The breadth: only three of 11 sector ETFs closed green — ConsDisc +1.8%, Tech +1.4%, Materials +0.1% — and the majority of stocks outside AI and tech fell (AP)","The tell: the VIX fell 7.8% to 18.44, so this was rotation, not de-risking — the fear gauge never confirmed the narrow breadth"],"d":"The split: AI paid for itself while rates taxed everything else — three sectors green, the Dow flat, and a VIX that said no one was panicking.","news":[{"time":"10/19","fact":"The 10-year Treasury yield topped 5.30% earlier this month and touched its highest level since 2002.","src":"AP","u":"https://apnews.com/article/stocks-markets-oil-us-ai-494fbe4361a0360b2f6368e7a6d8f058"},{"time":"10/19","fact":"In Europe, the losses were sharper, and indexes slid more than 1% following violent protests that could ultimately force the French government to increase its spending to ease voters' anger. That in turn could put even more pressure on bond markets, and yields cranked higher worldwide.","src":"AP","u":"https://apnews.com/article/stocks-markets-oil-us-ai-494fbe4361a0360b2f6368e7a6d8f058"},{"time":"10/19","fact":"The U.S. dollar index, which tracks the value of the greenback against a basket of foreign currencies, was up 0.2% at 102.00, aided by the dollar's 0.2% rise against the euro, which is slipping amid nationwide French protests about the cost of living.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10192026-12181593"},{"time":"10/19","fact":"Ameriprise Financial tumbled almost 4% after Bank of America slashed its rating on the stock to underperform. The iShares Mortgage Real Estate Capped ETF (REM) hit a low of $16.71, its lowest level since April 6, 2020; it was last down more than 3% on the day and has fallen more than 24% this year.","src":"CNBC","u":"https://www.cnbc.com/2026/10/18/stock-market-today-live-updates.html"},{"time":"10/19","fact":"The 10-year Treasury yield closed at 5.15%, up from 5.09% at the prior close, according to the Treasury's daily yield curve; the 30-year closed at 5.48% from 5.43%.","src":"US Treasury","u":"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv"}]},{"t":"③ The Barrel's Two Prices: a Russia Waiver, a Hormuz Threat — and an Expiry Squeeze","steps":["The waiver: Trump's Friday order paused Graham Act sanctions and tariffs on Russia for up to 60 days, tied to a diesel deal expected to move ~2.3M barrels this month and up to ~7.6M a month — Brent fell 2.1% to $107.57 early","The chokepoint: Iran said it has 'no choice' but to assert control over Hormuz — after a weekend in which two tankers were reported hit in the Persian Gulf and Houthis targeted Yanbu — Brent reversed through the session","The settles: Brent December -0.3% to $109.55 after ranging $107-$110; WTI November +2.2% to $103.66 into Tuesday's expiry; December WTI -0.5% to $98.54 — a $5.12 backwardation","The physical check: Dated Brent ~$117, down almost $16 in a week; Gulf flows ~80% of pre-conflict levels (Energy Secretary Chris Wright); Iraq exporting 3.4M bpd — supply is loosening under the headlines","The positioning cap: CTAs were at 100% maximum long in both benchmarks (Kpler) and Friday's rally left Brent overbought on the 9-day RSI — there were no fresh buyers left for the squeeze"],"d":"The barrel: a waiver pulled the bid, a chokepoint returned it, and expiry did the rest — Brent flat-ish, WTI's front month squeezed, and the physical market quietly loosening.","news":[{"time":"10/16","fact":"President Donald Trump waived key sanctions and tariffs under the Graham Act, raising expectations of additional Russian fuel exports. Trump's October 16 executive order waived specified Graham Act sanctions and tariffs, while Secretary of State Marco Rubio outlined a review lasting up to 60 days.","src":"Grafa (Reuters)","u":"https://grafa.com/en/news/united-states/oil-prices-fall-trump-russia-sanctions-waiver-october-2026"},{"time":"10/19","fact":"Brent crude futures fell $2.29, or 2.08%, to $107.57 per barrel by 0619 GMT on Monday, while US West Texas Intermediate crude futures dropped $1.95, or 1.92%, to $99.46. The planned Russian exports were expected to begin at approximately 2.3 million barrels this month before potentially increasing to around 7.6 million barrels per month, Reuters reported.","src":"Reuters (Sunday Guardian)","u":"https://sundayguardianlive.com/business/brent-crude-oil-price-today-october-19-brent-falls-below-108-wti-slips-under-100-as-trumps-russia-sanctions-waiver-eases-supply-concerns-amid-hormuz-tensions-check-latest-brent-crude-wti-oil-308522"},{"time":"10/19","fact":"Oil fluctuated near a five-month high. Prices briefly gained this session, before easing, after Iran said it has 'no choice' but to assert control over the Strait of Hormuz, while US lawmakers continue to resist President Donald Trump's diesel export deal with Russia. WTI for November delivery gained 2.2% to settle at $103.66 a barrel; November futures expire the next session. The more-active December contract was down 0.5% to settle at $98.54. Brent for December settlement fell 0.3% to settle at $109.55.","src":"Bloomberg (Rigzone)","u":"https://rigzone.com/news/wire/oil_prices_hover_near_fivemonth_high-19-oct-2026-184878-article"},{"time":"10/19","fact":"The Dated Brent benchmark, which underpins prices in Europe, traded near $117 on Monday, down almost $16 from a week prior. US Energy Secretary Chris Wright told Fox News that Persian Gulf oil flows had recovered to about 80% of their pre-conflict level, although refined-product shipments remain constrained. Iraq has exported more than 3.4 million barrels a day of crude so far this month, according to the country's oil minister.","src":"Bloomberg (Rigzone)","u":"https://rigzone.com/news/wire/oil_prices_hover_near_fivemonth_high-19-oct-2026-184878-article"},{"time":"10/19","fact":"Trend-following commodity trading advisers are sitting at 100% maximum long in both Brent and WTI, suggesting they've exhausted buying capacity for now, according to Kpler. The prior session's leg higher sent prices into overbought territory on the 9-day Relative Strength Index.","src":"Bloomberg (Rigzone)","u":"https://rigzone.com/news/wire/oil_prices_hover_near_fivemonth_high-19-oct-2026-184878-article"},{"time":"10/18","fact":"Over the weekend, a Saudi helicopter crashed near the border with Yemen and Houthi rebels targeted Yanbu, a crucial export hub, while UK maritime operations said two tankers reported being hit in the Persian Gulf.","src":"Bloomberg (Rigzone)","u":"https://rigzone.com/news/wire/oil_prices_hover_near_fivemonth_high-19-oct-2026-184878-article"}]},{"t":"④ The Cushion: Upgrades, a 29% Earnings Runway — and a Fed on Hold"," nt Seven tech giant a 'Top Pick' and lifted their price target on the stock to $350 from $335.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10192026-12181593"},{"time":"10/19","fact":"Analysts are forecasting overall growth of 29% for companies in the S&P 500 from the prior summer, according to FactSet.","src":"AP","u":"https://apnews.com/article/stocks-markets-oil-us-ai-494fbe4361a0360b2f6368e7a6d8f058"},{"time":"10/19","fact":"More than 70 S&P 500 companies are due to report this week, including Magnificent Seven members Tesla Inc. and Meta Platforms Inc.","src":"Bloomberg (Yahoo Finance)","u":"https://sg.finance.yahoo.com/news/us-stock-futures-rise-ahead-142550232.html"},{"time":"10/19","fact":"In stock markets abroad, rebounds for AI stocks helped South Korea's Kospi jump 1.8% to recover some of its 14.5% drop from last week.","src":"AP","u":"https://apnews.com/article/stocks-markets-oil-us-ai-494fbe4361a0360b2f6368e7a6d8f058"},{"time":"10/19","fact":"According to the CME's FedWatch Tool, traders are pricing in a 16 per cent chance of a rate hike this month and a 92 per cent chance of an increase in December.","src":"Reuters","u":"https://thehindubusinessline.com/markets/gold/gold-edges-higher-on-softer-oil-fed-rate-outlook-in-focus/article71602024.ece"}]}]},"mtd":{"h":"October, Thirteen Sessions In: a Record, Three Repricings — and a Round Trip","d":"S&P 7,651.5 → 7,690.73 (+0.51% MTD): one record close, a 5.36% yield spike, three repricings and a chip repair — the index is level, the leadership is not.","badges":["S&P MTD +0.51%","Nasdaq -1.60%","10Y -14bp","Brent +11.8%"],"c1":"Thirteen sessions into October and the S&P is +0.51% at 7,690.73 — still 1.6% below the 7,818.93 record set on 10/6 — while the Nasdaq is -1.60% and the Dow +2.08%. The month's arc: an S&P record close in the first week, then three repricings (wireless on 10/9, the AI complex on 10/12-13, the CPI-PPI pair on 10/14-15), and a chip-led repair that stopped the slide. The 10Y touched a 24-year high of 5.36% on 10/7 and closed at 5.15% (-14bp MTD); October hike odds went from 22% before CPI to a 37% peak and back to ~16%. Beneath the index: Energy +10.2% leads, Tech -5.0% lags — a ~15-point spread — and eight of 11 sectors are positive. Oil: WTI +14.6% (Nov), Brent +11.8% (Dec). Gates: FOMC Oct 27-28, PCE Oct 29.","c4":"<ul class='play'><li>October's shape is a round trip, not a trend: the S&P is +0.51% MTD but 1.6% below its 10/6 record — the month's gains were made in the first week and defended since.</li><li>The dispersion trade still pays: Energy +10.2% vs Tech -5.0% is a ~15-point spread — own the barrel's beneficiaries, rent the AI complex until its funding costs stop rising.</li><li>The month's last gate is the PCE print on Oct 29, two days after the Fed: October odds ~16% price a hold, so the risk is December (~92%) — watch the 10Y at 5.15% through both.</li></ul>","kpi":[["S&P MTD","+0.51%","thirteen sessions",1],["Nasdaq","-1.60%","repriced",0],["10Y MTD","-14bp","below 24-yr high",1],["WTI MTD","+14.6%","war premium",1]],"tbl":[["S&P","7,651.54","7,690.73","+0.51%"],["Dow","50,906.05","51,966.03","+2.08%"],["Nasdaq","26,861.06","26,430.89","-1.60%"],["10Y","5.29%","5.15%","-14bp"],["WTI","$90.42","$103.66","+14.6%"],["VIX","16.34","18.44","+12.9%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19"],"data":[7651.54,7666.45,7722.72,7773.95,7818.93,7801.77,7765.36,7811.54,7807.24,7805.45,7718.94,7744.06,7659.44,7690.73],"chains":[{"t":"① October's Round Trip: a Record, Three Repricings — and a Chip Repair","main":1,"steps":["The high: the S&P closed at 7,818.93 on 10/6 — its first close above 7,800 and the month's only record; the Nasdaq's own record run ended the next session","The first repricing: wireless on 10/9, when the telecom majors fell on SpaceX competition","The second: the AI complex on 10/12-13 — memory, equipment and neocloud names led the selling","The third: the CPI-PPI pair on 10/14-15 pushed October hike odds from 22% to a 37% peak before they round-tripped to ~16%","The sum: +0.51% MTD, still 1.6% under the record — a round trip, not a new leg"],"d":"October so far: one record, three repricings, one repair — the index is level, the leadership is not.","news":[{"time":"10/6 close","fact":"The S&P 500 closed above 7,800 for the first time — up 0.6% on the day — and the Nasdaq set another record close; the Dow remains just over 5% shy of its Aug. 5 record.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10062026-12160706"},{"time":"10/9","fact":"Shares of the country's largest telecommunications giants are slumping amid worries about growing competition from SpaceX.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10092026-12165767"},{"time":"10/13","fact":"Memory makers Micron and SK Hynix saw their stocks fall after Chinese memory maker ChangXin Memory Technologies announced significant progress on a new memory-cell design aimed at increasing storage density.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/14","fact":"According to CME FedWatch, traders now see a 37% likelihood the Federal Reserve will raise interest rates at its meeting in two weeks, up from 22% before the reading, and a 91% likelihood the central bank will lift rates at least a quarter-percentage point at its December meeting.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/19","fact":"Chip stocks rallied Monday, on pace to end a nine-day losing streak. The iShares Semiconductor ETF (SOXX) gained 3.7% and the VanEck Semiconductor ETF (SMH) rose 3.2%.","src":"CNBC","u":"https://www.cnbc.com/2026/10/18/stock-market-today-live-updates.html"}]},{"t":"② The Month's Split: Energy +10.2%, Tech -5.0%","steps":["Sector map: Energy +10.2%, Staples +8.2%, ConsDisc +5.2%, Utilities +4.9% — eight of 11 sectors are positive for the month","The gap: the best-to-worst spread is ~15 points — Energy +10.2% against Tech -5.0%","The index math: Dow +2.08% vs Nasdaq -1.60% — the old-economy index beat the AI-heavy one by 3.7 points","Inside tech: Tech is still -5.0% MTD — the month's damage is not repaired","The message: money rotated, it did not leave — eight sectors green, the S&P positive, the Nasdaq still down"],"d":"October's split: the barrel and the defensives got paid; the AI complex paid the rent — a rotation, not an exit.","news":[{"time":"10/16","fact":"Slightly more than half of the stocks in the S&P 500 fell, but all but seven of the 75 stocks in the index's tech sector closed lower. Among the biggest decliners were chip companies, reflecting mounting worries about how long the frenzy over the AI buildout will last.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"},{"time":"10/19","fact":"The majority of U.S. stocks outside of AI and tech fell, though, and the Dow Jones Industrial Average swung between losses and gains before finishing with a drop of 36 points, or 0.1%.","src":"AP","u":"https://apnews.com/article/stocks-markets-oil-us-ai-494fbe4361a0360b2f6368e7a6d8f058"},{"time":"10/19","fact":"An outperformance of the so-called quality factor and a decline in the equal-weighted version of the S&P 500 are set to come to an end, providing an opportune window to snap up stocks, Morgan Stanley's Michael Wilson said.","src":"Bloomberg (Yahoo Finance)","u":"https://finance.yahoo.com/markets/stocks/articles/morgan-stanley-wilson-says-ready-091148275.html"}]},{"t":"③ The Barrel, Thirteen Sessions In: $98 to $110 and Back","steps":["The path: Brent's December contract began October near $98, crossed $100 on 10/1, held a $100-107 corridor for two weeks, then touched $110 on 10/16","The drivers: Hormuz attack counts, a Russian refinery strike and the diesel deal kept re-arming the premium","The offsets: the IEA's release, a 17M-barrel SPR offer and the 10/16 Russia waiver","The scoreboard: Brent $109.55 (+11.8% MTD) near a five-month high; WTI $103.66 (+14.6%), its best since September","The shape: every dip was bought, but the highs stopped rising after 10/16 — a war premium that policy could dent, not break"],"d":"October's barrel: war kept re-arming the premium, policy kept capping it — a $100-110 month with no resolution.","news":[{"time":"10/9","fact":"Front Month ICE Brent Crude for Dec. delivery gained $2.47 per barrel, or 2.42% to $104.72 this week — up for two consecutive sessions.","src":"Dow Jones (Data Talk)","u":"https://www.morningstar.com/news/dow-jones/202610096010/front-month-ice-brent-crude-rose-242-this-week-to-settle-at-10472-data-talk"},{"time":"10/16","fact":"Brent crude futures settled $3.94, or 3.7%, higher at $109.86, the highest since May 19, while US West Texas Intermediate crude futures closed $3.44, or 3.5%, higher at $101.41, the highest since September 17.","src":"Reuters (Yahoo Finance)","u":"https://finance.yahoo.com/energy/articles/oil-edges-down-investors-weigh-010642305.html"},{"time":"10/14","fact":"'Constraints on the diesel market will extend well into next year,' the International Energy Agency warned, with gasoil supply falling short of demand in 4Q26.","src":"CNBC","u":"https://www.cnbc.com/2026/10/14/diesel-deal-oil-price-iea-report.html"},{"time":"10/16","fact":"On Friday, the U.S. offered up to 17 million barrels from the Strategic Petroleum Reserve, the Department of Energy said.","src":"Bloomberg (World Oil)","u":"https://worldoil.com/news/2026/10/16/oil-hits-110-as-houthi-strikes-russia-ukraine-attacks-lift-supply-fears/"},{"time":"10/19","fact":"Brent for December settlement fell 0.3% to settle at $109.55 a barrel. WTI for November delivery <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
