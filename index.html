<html lang="en">
<head>

<title>Bay Street Updates by Podor</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}

/* ── currencies ───────────────────────────── */
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fxt{background:var(--paper);border:1px solid var(--line);padding:12px 14px 10px;min-width:0}
.fxt .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fxt .nm{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.fxt .dl{font-family:"Playfair Display",Georgia,serif;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.fxt .dl i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}
.fxt .lv{font-size:15px;font-variant-numeric:tabular-nums;margin-top:4px}
.fxt .lv small{color:var(--faint);font-size:11.5px;margin-left:6px}
.fxt svg{display:block;width:100%;height:56px;margin:8px 0 4px;cursor:crosshair;touch-action:none}
.fxt .rg{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;min-height:1.3em}
.fx-note{font-size:12.5px;color:var(--faint);margin-top:12px;line-height:1.7}
.fx-tbl{margin-top:8px;font-size:13px}
.fx-tbl summary{cursor:pointer;color:var(--mut);letter-spacing:.06em}
.fx-tbl table{border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums;width:100%;max-width:640px}
.fx-tbl th,.fx-tbl td{border-bottom:1px solid var(--hair);padding:4px 8px;text-align:right}
.fx-tbl th:first-child,.fx-tbl td:first-child{text-align:left}
</style>
</head>

ve at 13.6%; the 2Y rose 17bp to 4.73% and the 10Y 10bp to 4.98%","A $42 billion 10Y auction cleared at a 5.020% high yield with dealers left 9.8%, and the dollar had its best day since September at DXY 102.25","Gold closed 1.82% lower at $4,039.30, while the S&P fell 0.38% to 7,520.93 and the VIX eased 2.31% to 19.46"],"d":"The inflation impulse ran through the front end first: a 0.4%/0.3% CPI, a Waller hint at 50bp and a soft 10Y auction took the 2Y up 17bp, the dollar to its best day since September and gold down 1.82% — yet the S&P lost 0.38% and the VIX fell, because the equity damage was one stock deep.","news":[{"time":"11/10","fact":"The Consumer Price Index rose 0.4% in October on a seasonally adjusted basis after 0.6% in September; the index for all items less food and energy rose 0.3%, as it did in September and August.","src":"BLS","u":"https://www.bls.gov/news.release/cpi.nr0.htm"},{"time":"11/10","fact":"BLS did not collect survey data for October 2025 because of a lapse in appropriations, so it cannot publish 12-month percent changes for October 2026 where October 2025 indexes are unavailable.","src":"BLS","u":"https://www.bls.gov/news.release/cpi.nr0.htm"},{"time":"11/10","fact":"Fed Governor Christopher Waller said in London that a hot inflation report could push him toward advocating a half-point increase in December and that such a move should be considered.","src":"CNBC","u":"https://www.cnbc.com/2026/11/10/fed-governor-waller-sees-december-hike-likely.html"},{"time":"11/10","fact":"Traders priced a rate hike at the Fed's December 8-9 meeting near certainty and put odds of a half-point hike at 13.6%, after being around zero prior to the inflation report, according to CME Group data.","src":"CNBC","u":"https://www.cnbc.com/2026/11/10/cpi-inflation-report-october-2026.html"},{"time":"11/10 close","fact":"The 2-year Treasury par yield was 4.73% on 11/10 versus 4.56% on 11/9; the 10-year 4.98% versus 4.88%; the 30-year 5.35% versus 5.26%.","src":"U.S. Treasury","u":"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve&field_tdr_date_value=2026"},{"time":"11/10","fact":"Treasury sold $42 billion of 10-year notes at a high yield of 5.020%, with 2.46 times bid-to-cover and primary dealers left with 9.8% of the competitive award.","src":"TFTC / TreasuryDirect","u":"https://www.tftc.io/treasury-auctions"},{"time":"11/10","fact":"The dollar was set for its best day since September as the CPI lifted rate-hike bets.","src":"Bloomberg","u":"https://www.bloomberg.com/news/articles/2026-11-10/dollar-set-for-best-day-since-september-as-cpi-lifts-hike-bets"},{"time":"11/10 close","fact":"Gold futures for December delivery closed at $4,039.30 an ounce, down 1.82% from Monday's $4,114.50.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/GC=F/history"},{"time":"11/10 close","fact":"The S&P 500 lost 0.38% to end at 7,520.93, the Dow declined 157.86 points, or 0.30%, to 52,231.89 and the Nasdaq Composite fell 0.74% to 25,065.87.","src":"CNBC","u":"https://www.cnbc.com/2026/11/09/stock-market-today-live-updates.html"}]},{"t":"② Nvidia's Probe Became a Lawsuit","steps":["Nvidia's board is running an independent investigation into whether CEO Jensen Huang was the target of a foreign intelligence effort through his relationship with Alice Huang, whom US agencies describe as a Chinese spy","Huang has admitted the affair and apologised to staff; Nvidia says it has no reason to believe its secrets or national security were compromised","On 11/10 shareholders sued Nvidia and Huang, alleging false and misleading statements about the relationship and about Megaspeed","NVDA fell 5.47% to $168.89, its lowest close since 3/30, and is 17.47% lower in November","The chips around it did not follow: SOX -0.36% and SOXX -0.12%, with AMD +1.30%, Broadcom +3.91% and TSMC +2.02%","Technology was still the weakest of the 11 sectors at -1.15%"],"d":"This is a single-name discount, not an industry one: Nvidia fell to a seven-month low on the probe and a fresh lawsuit while AMD, Broadcom and TSMC rose, so the cost to the index is points, not a re-rating of chips.","news":[{"time":"11/8","fact":"Nvidia's board opened an independent investigation after reports that CEO Jensen Huang had been targeted by a foreign intelligence effort.","src":"CNBC","u":"https://www.cnbc.com/2026/11/09/nvidia-jensen-huang-chinese-spy-investigation.html"},{"time":"11/9","fact":"Huang admitted to being unfaithful to his wife and apologised, while Nvidia said it had no reason to believe its secrets or national security were compromised.","src":"BBC","u":"https://www.bbc.com/news/live/cm78p221e313t"},{"time":"11/10","fact":"Nvidia and chief executive Jensen Huang were sued in the US for misleading shareholders over the Chinese spying scandal, including statements about the company's relationship with Megaspeed.","src":"The Guardian","u":"https://www.theguardian.com/technology/2026/nov/10/nvidia-jensen-huang-sued-donald-trump-fbi"},{"time":"11/10 close","fact":"Nvidia closed at $168.89, down 5.47% from Monday's $178.67 and its lowest close since March 30.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/NVDA/history"},{"time":"11/10 close","fact":"SOXX closed at $146.59, down 0.12% from Monday's $146.76.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/SOXX/history"},{"time":"11/10 close","fact":"Broadcom closed at $331.98, up 3.91% from Monday's $319.48.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/AVGO/history"},{"time":"11/10 close","fact":"AMD closed at $515.21, up 1.30% from Monday's $508.58.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/AMD/history"},{"time":"11/10 close","fact":"TSMC closed at $396.48, up 2.02% from Monday's $388.62.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/TSM/history"},{"time":"11/10 close","fact":"XLK closed at $168.91, down 1.15% from Monday's $170.88.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLK/history"}]},{"t":"③ The Barrel Fell While the Curve Rose","steps":["US officials downplayed the need for additional military action against Iran, and crude fell more than $3 a barrel in early trade before clawing back","Brent settled $1.08, or 1.17%, lower at $91.49 and WTI 81 cents, or 0.93%, lower at $86.04 — both the lowest since 8/31 for a second session","Brent briefly traded below $90 for the first time since August, touching $89.16, after Iran's security official Mohsen Rezaei said no negotiations with Washington are under way","Energy equities went the other way: XLE +0.44%, second only to financials among the 11 sectors","The barrel is the one force pushing against the CPI impulse — energy is 11.15% lower in November and still 39.14% higher for the year"],"d":"Crude and yields moved in opposite directions for opposite reasons: oil fell on de-escalation to its lowest since August while the curve sold off on inflation, so energy equities rose on a day the barrel fell 1.17%.","news":[{"time":"11/10 close","fact":"Brent futures fell $1.08, or 1.2%, to settle at $91.49 a barrel and WTI fell 81 cents, or 0.9%, to settle at $86.04; both closed at their lowest since August 31 for a second day.","src":"Reuters","u":"https://www.investing.com/news/commodities-news/oil-falls-as-trump-downplays-prospect-of-escalation-with-iran-5013892"},{"time":"11/10","fact":"Brent briefly fell below $90 a barrel for the first time since August, sliding to a session low of $89.16, as comments from US officials fuelled hopes for an end to the conflict with Iran.","src":"CNBC","u":"https://www.cnbc.com/2026/11/10/oil-prices-trump-iran.html"},{"time":"11/10","fact":"Iran's top security official Mohsen Rezaei said there are currently no negotiations taking place between Tehran and Washington.","src":"Reuters","u":"https://www.investing.com/news/commodities-news/oil-falls-as-trump-downplays-prospect-of-escalation-with-iran-5013892"},{"time":"11/10 close","fact":"XLE closed at $62.21, up 0.44% from Monday's $61.94.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLE/history"},{"time":"11/10 close","fact":"Brent's January contract closed at $91.49, down 19.34% from 10/30's $113.43, while XLE is up 39.14% for the year from 12/31/2025's $44.71.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLE/history"}]},{"t":"④ What Held: Breadth, the VIX and the IPO Pipeline","steps":["The equal-weight RSP closed -0.03% against SPY's -0.37%, so the average stock beat the index by 0.34 points","Six of 11 sectors rose, led by financials +0.52%, energy +0.44% and communications +0.37%, and the VIX fell 2.31% to 19.46 — a down day with less fear, not more","Financials rose with the level of rates rather than the slope: they were the best sector even as 2s10s flattened to 25bp","Anthropic set IPO terms at $70-78 a share — up to $64.4 billion of stock and a $1.4 trillion fully diluted valuation — with $26 billion more from cornerstones including Alphabet, Nvidia and AMD","The calendar thins: the bond market is shut for Veterans Day on 11/11, the 30Y auction is 11/12 and PPI 11/13, before the FOMC on 12/8-9"],"d":"The index fell and the market did not: the equal-weight fund was flat, six of 11 sectors rose, financials led and the VIX fell — a 29-point drop that reads as one stock plus a rate shock absorbed by breadth, not as a broad de-risking.","news":[{"time":"11/10 close","fact":"RSP closed at $220.88, down 0.03% from Monday's $220.95, while SPY closed at $749.92, down 0.37% from $752.69.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/RSP/history"},{"time":"11/10 close","fact":"XLF closed at $58.29, up 0.52% from Monday's $57.99, the best of the 11 sector ETFs.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLF/history"},{"time":"11/10 close","fact":"The VIX closed at 19.46, down from 19.92 on 11/9.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/^VIX/history"},{"t p-buying of 11/9 restored 2.35%, the best session since April 8. The month ends 0.78% below its 10/30 base and 3.81% under the 10/6 record, with technology the drag and breadth ahead — and with Brent's January contract 19.34% cheaper after the war premium drained out of it.","badges":["S&P -0.78%","Nasdaq -1.46%","Dow +0.89%","Brent -19.34%","10Y +4bp"],"kpi":[["S&P MTD","-0.78%","seven sessions",0],["Nasdaq","-1.46%","AI leg",0],["10Y MTD","+4bp","4.98%",0],["Brent MTD","-19.34%","January",0]],"tbl":[["S&P","7,580.07","7,520.93","-0.78%"],["Dow","51,770.31","52,231.89","+0.89%"],["Nasdaq","25,437.00","25,065.88","-1.46%"],["10Y","4.94%","4.98%","+4bp"],["Brent","$113.43","$91.49","-19.34%"],["Gold","$3,898.90","$4,039.30","+3.60%"]],"labels":["10/30","11/2","11/3","11/4","11/5","11/6","11/9","11/10"],"data":[7580.07,7541.4,7568.92,7688.62,7353.73,7376.86,7549.94,7520.93],"chains":[{"t":"① November Is Still a Round Trip","main":1,"steps":["From 10/30's 7,580.07 the S&P is 0.78% lower at 7,520.93, the Nasdaq -1.46% and the Dow +0.89%","The month ran +1.58% on 11/4, gave back 4.36% on 11/5 and repaired 2.35% on 11/9","The S&P is 3.81% below its 10/6 record of 7,818.93","RSP is +1.18% against SPY's -0.77%, so the average stock is 1.95 points ahead"],"d":"November is still a round trip: the 11/4 election rally and the 11/5 AI rout have been mostly repaired, and the month sits 0.78% lower with technology the drag and breadth ahead.","news":[{"time":"11/4 close","fact":"The S&P 500 rose 1.6% on 11/4 after Democrats won control of Congress in the midterm elections.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-nasdaq-11042026-12234321"},{"time":"11/5 close","fact":"The S&P 500 dropped 4.36% to 7,353.73 and the Nasdaq 5.52% to 24,315.00.","src":"CNBC","u":"https://www.cnbc.com/2026/11/04/stock-market-today-live-updates.html"},{"time":"11/10 close","fact":"The S&P 500 closed at 7,520.93 on 11/10 versus 7,580.07 on 10/30, a decline of 0.78%.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/^GSPC/history"},{"time":"11/10 close","fact":"RSP closed at $220.88, up 1.18% from 10/30's $218.31.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/RSP/history"},{"time":"11/10 close","fact":"SPY closed at $749.92, down 0.77% from 10/30's $755.72.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/SPY/history"}]},{"t":"② The War Premium Kept Draining Out of the Barrel","steps":["Brent's January contract is 19.34% lower at $91.49 from 10/30's $113.43; WTI is 17.36% lower at $86.04","Energy is -11.15% for the month, the worst of the 11 sectors, and has given back about a third of a 2026 gain that reached +56.6% on 10/30","Brent fell 16% in the week ended 11/6, its steepest weekly drop since the start of the COVID-19 pandemic","OPEC output rose in October, led by gains in Saudi Arabia, Kuwait and Iraq despite continued export constraints","JPMorgan estimated the global oil surplus at around 1.4 million barrels per day in October"],"d":"The month's biggest single move is not in equities: Brent is 19.34% cheaper, energy is the worst sector at -11.15%, and the year's leader has surrendered about a third of its 2026 gain in seven sessions.","news":[{"time":"10/30 close","fact":"January Brent settled at $113.43 on 10/30, up $2.63 that day, while the December contract expired at $117.64.","src":"Reuters","u":"https://centraloregondaily.com/news/consumer/oil-jumps-2-settles-at-6-month-highs-on-fears-of-escalation-in-iran/article_f6fc7713-9eb0-5924-8fb0-558b315a1bab.html"},{"time":"week ended 11/6","fact":"The Brent benchmark plunged by 16% last week, its steepest weekly drop since the start of the COVID-19 pandemic.","src":"Reuters","u":"https://finance.yahoo.com/news/oil-falls-open-trump-says-235002807.html"},{"time":"11/10 close","fact":"XLE closed at $62.21, down 11.15% from 10/30's $70.02.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLE/history"},{"time":"11/1 ":"https://finance.yahoo.com/quote/DX-Y.NYB/history"}]}],"c4":"<ul class='play'><li>The shape: an election rally, an AI rout and a dip-buying repair inside seven sessions — the index ends 0.78% lower but 1.95 points behind the average stock.</li><li>The barrel: Brent -19.34% is the month's dominant price, and energy the only double-digit sector loser.</li><li>The rotation: communications +7.87% and consumer discretionary +4.91% are where the AI money went, with gold +3.60% as the hedge.</li><li>The rate bill: the 10Y is 4bp higher on the month because of 11/10 alone; the front end carries the whole repricing.</li></ul>"},"qtd":{"h":"Q4's Rotation Is Still a Drawdown: S&P -1.71%, Tech -13.7%, Semis -22.7%","d":"From 9/30's 7,651.54 the S&P is 1.71% lower at 7,520.93 while the Dow is +2.60%; technology -13.71% and communications -2.89% against staples +12.94%, health +12.15% and consumer discretionary +11.22%, the 10Y 31bp lower at 4.98% and Brent -3.21% on a roll-adjusted base.","c1":"Q4 has been a rotation expressed as a drawdown. The index's AI hardware is where the selling is: technology -13.71% and semis -22.66% through SOXX, against staples, health, consumer discretionary and utilities all up double digits. The Dow is +2.60% while the S&P is -1.71%, nine of 11 sectors are still higher for the quarter, and the equal-weight fund is 7.85 points ahead of SPY. Rates helped rather than hurt — the 10Y is 31bp lower — and December is still fully priced for a hike.","badges":["S&P -1.71%","Dow +2.60%","Nasdaq -6.68%","10Y -31bp","Brent -3.21%"],"kpi":[["S&P QTD","-1.71%","29 sessions",0],["Dow","+2.60%","old economy",1],["10Y QTD","-31bp","4.98%",0],["Brent QTD","-3.21%","roll-adj.",0]],"tbl":[["S&P","7,651.54","7,520.93","-1.71%"],["Dow","50,906.05","52,231.89","+2.60%"],["Nasdaq","26,861.06","25,065.88","-6.68%"],["10Y","5.29%","4.98%","-31bp"],["Brent","$94.52","$91.49","-3.21%"],["Gold","$4,186.70","$4,039.30","-3.52%"]],"labels":["9/30","10/1","10/2","10/5","10/6"," <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

// FX：按档切片同一条日线序列。today = 最近 11 根（约两周，涨跌 = 日环比）；mtd/qtd/ytd = 基期 bar 起到当日
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
function fxWindow(p, period, bases) {
  const s = p.series;
  if (period === "today") { const w = s.slice(-11); return { w, ref: w[w.length - 2], label: "1D", refLbl: "prior close", rangeLbl: `${md(w[0][0])}–${md(w[w.length - 1][0])}` }; }
  const b = bases[period];
  let i = 0; s.forEach(([d], k) => { if (d <= b) i = k; });
  const w = s.slice(i);
  return { w, ref: w[0], label: period.toUpperCase(), refLbl: "period start", rangeLbl: `since ${md(w[0][0])}` };
}
function renderFX(period) {
  const card = document.getElementById("fxCard"), FX = SNAP.FX;
  if (!FX || !FX.pairs || !FX.pairs.length) { card.style.display = "none"; return; }
  card.style.display = "";
  const W = 200, H = 56, pad = 4, rows = [];
  document.getElementById("fx").innerHTML = FX.pairs.map((p, n) => {
    const { w, ref, label, rangeLbl } = fxWindow(p, period, FX.bases);
    const last = w[w.length - 1][1], chg = (last / ref[1] - 1) * 100;
    const vals = w.map(x => x[1]), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const X = k => pad + k * (W - 2 * pad) / Math.max(w.length - 1, 1), Y = v => H - pad - (v - lo) / span * (H - 2 * pad);
    const col = chg >= 0 ? "var(--up)" : "var(--down)", sign = chg >= 0 ? "+" : "";
    const pts = w.map((x, k) => `${X(k).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(" ");
    const f = v => v.toFixed(p.dp);
    rows.push(`<tr><td>${p.name}</td><td>${md(ref[0])} ${f(ref[1])}</td><td>${md(w[w.length - 1][0])} ${f(last)}</td><td>${sign}${chg.toFixed(2)}%</td><td>${f(lo)}</td><td>${f(hi)}</td></tr>`);
    const rangeTxt = `${rangeLbl} · range ${f(lo)}–${f(hi)}`;
    return `<div class="fxt" data-n="${n}"><div class="top"><span class="nm">${p.name}</span><span class="dl" style="color:${col}"><i>${chg >= 0 ? "▲" : "▼"}</i>${sign}${chg.toFixed(2)}%</span></div>
<div class="lv">${f(last)}${p.inv ? `<small>${p.inv} ${(1 / last).toFixed(p.dp)}</small>` : ""}<small>${label}</small></div>
<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${p.name} ${rangeLbl}: ${f(ref[1])} to ${f(last)} (${sign}${chg.toFixed(2)}%)">
<line x1="${pad}" x2="${W - pad}" y1="${Y(ref[1]).toFixed(1)}" y2="${Y(ref[1]).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<line class="xh" y1="0" y2="${H}" stroke="var(--mut)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
</svg><div class="rg" data-def="${rangeTxt}">${rangeTxt}</div></div>`;
  }).join("");
  document.getElementById("fxTbl").innerHTML = `<table><thead><tr><th>Pair</th><th>Start</th><th>End</th><th>Change</th><th>Low</th><th>High</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
  document.getElementById("fxNote").innerText = `Read as base/quote: USD/CAD +0.50% = the US dollar up 0.50% against the Canadian dollar. Line = daily closes over the window (Today tab: last ~2 weeks); dashed line = reference (Today: prior close; MTD/QTD/YTD: period start). ${FX.src}.`;
  // 悬停：十字线 + 在卡片底行显示日期与数值（不用浮层，手机上也不遮挡）
  document.querySelectorAll(".fxt").forEach(t => {
    const p = FX.pairs[+t.dataset.n], { w } = fxWindow(p, period, FX.bases), svg = t.querySelector("svg"), xh = t.querySelector(".xh"), rg = t.querySelector(".rg");
    const move = e => {
      const r = svg.getBoundingClientRect(), x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
      const k = Math.max(0, Math.min(w.length - 1, Math.round((x - pad) / (W - 2 * pad) * (w.length - 1))));
      const px = pad + k * (W - 2 * pad) / Math.max(w.length - 1, 1);
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
      rg.textContent = `${md(w[k][0])} · ${w[k][1].toFixed(p.dp)}`;
    };
    const out = () => { xh.style.display = "none"; rg.textContent = rg.dataset.def; };
    svg.addEventListener("mousemove", move); svg.addEventListener("touchmove", move, { passive: true });
    svg.addEventListener("mouseleave", out); svg.addEventListener("touchend", out);
  });
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  renderFX(period);
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
