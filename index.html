<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Street Updates by Podor</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}
</style>
</head>

lex itself.","news":[{"time":"10/15","fact":"Wall Street staged a comeback after losses driven by concerns about the sustainability of the artificial-intelligence trade. The S&P 500 halted a three-day drop as Nvidia Corp.'s chief Jensen Huang defended the financial health of AI computing supplier CoreWeave Inc., a major customer in which the company is also an investor. In a sign of rotation to other sectors, an equal-weighted version of the S&P 500 climbed 1.4%.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-selloff-spurs-flight-to-bonds-on-ai-worries%3A-markets-wrap/92218059"},{"time":"10/15","fact":"The Dow Jones Industrial Average advanced 1.1%, or 550 points, behind gains from the likes of Nike, Salesforce, and Home Depot. The benchmark S&P 500 rose 0.3%, while the tech-focused Nasdaq Composite erased steep losses to finish up 0.1%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"The S&P 500 advanced 0.3%, recovering from an early decline of approximately 0.6%. The Nasdaq Composite finished 0.1% higher after reversing an intraday loss of approximately 1.4%. The 10-year Treasury yield fell approximately 10 basis points to 5.09%.","src":"Kitco PM Report","u":"https://www.kitco.com/news/article/2026-10-15/gold-approaches-4170-silver-gains-3-bond-rally-lifts-precious-metals-kitco"},{"time":"10/15","fact":"All told, the S&P 500 rose 25.12 points to 7,744.06. The Dow Jones Industrial Average jumped 556.21 to 52,177.69, and the Nasdaq composite added 20.16 to 26,713.03. CoreWeave fell as much as 9.5% in the morning after tumbling 15.5% a day earlier; it later flipped to a gain and finished 5.9% higher. The yield on the 10-year Treasury sank to 5.09% from 5.19% late Wednesday.","src":"AP","u":"https://apnews.com/article/stock-markets-kospi-tech-shares-e889ad7dee2b7dd959f1b8bc87366914"},{"time":"10/15","fact":"The U.S. dollar index declined 0.5% to 102.04.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"Spot gold was trading near $4,168.70 an ounce, up $64.20, or 1.56%, while spot silver was trading near $57.310, up $1.800, or 3.24%.","src":"Kitco PM Report","u":"https://www.kitco.com/news/article/2026-10-15/gold-approaches-4170-silver-gains-3-bond-rally-lifts-precious-metals-kitco"}]},{"t":"② The AI File: a Record Credit Gauge, Korea's Crash — and the Bailout Question","steps":["Korea cratered: the Kospi fell 7.6% — its worst day since July, now 39% below June's record — and Japan's Nikkei lost 4.9%","The credit file: CoreWeave's credit-risk gauge hit an all-time high; its default insurance near 1,000bp implies a ~63% five-year default chance, up from ~30% a year ago, against ~$50B of debt (LSEG)","The US echo: Dell and HPE ranked among the S&P 500's worst performers for a second straight day; Seagate (-3.2%) and Western Digital (-2.1%) weighed on the Roundhill DRAM ETF (-1.5% after Wednesday's 5% slide)","TSMC's paradox: a record sixth straight quarter of profits and strong Q4 guidance — yet its US-listed shares fell as much as 5.3% before closing -1.8%","The debate: 'Is demand for AI real? Yes... but that does not mean every company building the infrastructure will generate attractive returns' (Crossbridge's Manish Singh); 'AI may be the future. Debt servicing is still the present.'","The heaviest weight: Nvidia -1.8% — the largest single drag on the S&P 500 — though it more than halved a 3.8% morning loss"],"d":"The AI file: the credit gauge at a record and Korea's crash set the morning tone — but chips stopped falling before the close.","news":[{"time":"10/15","fact":"South Korea's Kospi index — dominated by two chip companies, Samsung Electronics and SK Hynix — fell to its worst day since July. It has dropped 39% since setting a record in June. Japan's Nikkei 225 fell 4.9%.","src":"AP","u":"https://apnews.com/article/stock-markets-kospi-tech-shares-e889ad7dee2b7dd959f1b8bc87366914"},{"time":"10/15","fact":"A measure of credit risk at the data-center operator hit an all-time high, triggering fresh jitters about the AI sector. 'Two questions matter. Is demand for AI real? Yes,' said Manish Singh at Crossbridge Capital. 'The structural opportunity is real, but that does not mean every company building the infrastructure will generate attractive returns for investors... AI may be the future. Debt servicing is still the present.'","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-selloff-spurs-flight-to-bonds-on-ai-worries%3A-markets-wrap/92218059"},{"time":"10/15","fact":"CoreWeave has about $50 bln in debt, and the cost of insuring it against default has risen to around 1,000 basis points, implying a nearly 63% chance of default in five years, up from about 30% a year ago, according to LSEG data.","src":"Reuters","u":"https://srnnews.com/factbox-coreweaves-ai-contracts-and-the-lenders-financing-its-build-out"},{"time":"10/15","fact":"Dell Technologies and Hewlett Packard Enterprise ranked among the worst performers in the S&P 500 for a second straight day. Seagate Technology and Western Digital weighed on Roundhill's Memory ETF (DRAM), which was down about 1.5% following a 5% drop yesterday.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"Nvidia fell 1.8% and was the heaviest weight on the S&P 500. TSMC's stock dropped as much as 5.3% in the morning before finishing with a more modest loss of 1.8%; the bellwether for the AI industry reported a profit that topped analysts' high expectations and said it expects strong demand to continue in the final three months of 2026.","src":"AP","u":"https://apnews.com/article/stock-markets-kospi-tech-shares-e889ad7dee2b7dd959f1b8bc87366914"}]},{"t":"③ The Barrel's Two-Sided Day: Relief Talk vs a Sunk Ship — WTI +3%, Brent Flat","steps":["The morning dip: Washington floated easing sanctions on the 'shadow fleet' of tankers and the IEA agreed to accelerate releases — crude slid early before buyers returned","The escalation: a Singapore-registered container ship sank in the Strait of Hormuz after being struck by a projectile (its 21 crew evacuated safely; a second vessel was damaged) — and Iran said it is 'counting the moments' until it can strike US warships","The draw: EIA crude inventories fell 8.6 million barrels last week — versus a 288,000-barrel draw expected — and the Houthis fired on Aden's presidential palace, killing two guards","The settles: WTI +$2.88 (+3.0%) to $97.97; Brent -14 cents (-0.1%) to $105.92 — the benchmark spread narrowed to ~$8","The divergence: energy closed worst among sectors (-1.6%) even as crude settled higher — Saudi crude kept flowing through alternative routes and the release headlines weighed on the group"],"d":"The barrel's two-sided day: policy supply met war supply — WTI won on the draw, Brent sat still, and energy equities never joined the rally.","news":[{"time":"10/15","fact":"Brent crude was little changed on Thursday as investors weighed possible US steps to ease restrictions on the world's 'shadow fleet' of tankers, while conflict in the Middle East kept a geopolitical risk premium in the market. The international benchmark settled down 14 cents, or 0.13%, at $105.92 a barrel. US West Texas Intermediate crude futures settled up $2.88, or 3.03%, to $97.97 a barrel, after a large US crude stock draw helped support prices.","src":"Reuters","u":"https://lufkindailynews.com/news_reuters/business/brent-steady-as-us-weighs-easing-sanctions-on-global-shadow-fleet/article_184090cc-0917-5f7c-b4a7-3837c55ffdaf.html"},{"time":"10/15","fact":"Crude inventories fell by 8.6 million barrels to 415.6 million barrels in the week ended October 9, the EIA said, compared with analysts' expectations in a Reuters poll for a 288,000-barrel draw.","src":"Reuters","u":"https://lufkindailynews.com/news_reuters/business/brent-steady-as-us-weighs-easing-sanctions-on-global-shadow-fleet/article_184090cc-0917-5f7c-b4a7-3837c55ffdaf.html"},{"time":"10/15","fact":"The GFS Pride, registered in Singapore, sank after it was struck by an unidentified projectile and caught fire; the ship's 21 crew members were safely evacuated. A second vessel, the GFS Giselle, was also hit and sustained damage to its hull. 'Such attacks are unprovoked, unjustifiable and a breach of international law,' the Singapore maritime authority said.","src":"CNBC","u":"https://www.cnbc.com/2026/10/15/cnbc-daily-open-a-singapore-ship-goes-down-as-hormuz-risks-rise.html"},{"time":"10/15","fact":"The International Energy Agency agreed to release over 20 million barrels of diesel to the market as soon as possible and any oil remaining from a record emergency reserves release pledged in March; Spain will release 4.4 million barrels from strategic reserves in October.","src":"Reuters","u":"https://lufkindailynews.com/news_reuters/business/brent-steady-as-us-weighs-easing-sanctions-on-global-shadow-fleet/article_184090cc-0917-5f7c-b4a7-3837c55ffdaf.html"},{"time":"10/15","fact":"U.S. crude oil prices rose as traders assessed potential supply disruptions following attacks on ships passing through the Strait of Hormuz; WTI for November gained about 3%, or $2.88, to close at $97.97 per barrel, while Brent for December fell 14 cents to settle at $105.92.","src":"CNBC","u":"https://www.cnbc.com/2026/10/15/oil-prices-today-brent-wti.html"}]},{"t":"④ Hot Data, Softer Pricing: the PPI Paradox","steps":["The print: PPI +1.3% m/m and +6.3% y/y — the fastest monthly jump since March 2022 — with energy +10.8% and gasoline +20.3%; retail sales doubled estimates at +0.8%; claims 199,000","The puzzle: a second hot inflation print in two days, yet October hike odds fell to ~29% (from ~37%) and December held ~88% — the market priced a Fed that won't add to the wobble","The Fed voices: San Francisco's Mary Daly and supervision chief Michelle Bowman underscored that an immediate rate hike might not be required, tempering expectations","The read: 'Neither the CPI nor PPI show inflation moving back towards the Fed's target... the retail sales report wasn't soft enough to shift the Fed's focus away from inflation' (Fifth Third's Bill Adams)","The gates: Warsh speaks at the IMF meetings in Bangkok tonight (11:30 p.m. ET); Friday brings import/export prices and industrial production; the pre-meeting blackout starts Saturday"],"d":"The data ran hot; the pricing ran cold — the market is betting the Fed won't stack a rate shock on top of the AI wobble.","news":[{"time":"10/15","fact":"Wholesale prices rose 1.3% month-over-month and 6.3% year-over-year, up from a respective 0.4% and 5.4% in August and ahead of economists' expectations of 0.6% and 5.5%. September U.S. retail sales doubled estimates with a 0.8% rise, and weekly jobless claims came in a tick below expectations at 199,000. According to CME FedWatch, traders now see a 29% likelihood the Fed will raise interest rates at its meeting in two weeks and an 88% likelihood the central bank will lift rates at least a quarter-percentage point in December.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"San Francisco Fed President Mary Daly and Vice Chair for Supervision Michelle Bowman underscored that an immediate rate hike might not be required, tempering expectations of an October rate hike. Traders are now pricing in about a 30% chance of a rate hike later this month, according to CME's FedWatch Tool.","src":"Kitco (Reuters)","u":"https://kitco.com/news/off-the-wire/2026-10-15/gold-rebounds-weaker-dollar-yields-october-fed-hike-bets-subdued"},{"time":"10/15","fact":"'On balance, we think Warsh will talk in a way that does not suggest an October hike,' said Krishna Guha at Evercore. 'Warsh will be mindful of the global wobble in tech stocks and signs financing conditions are tightening for more exposed AI names, on top of the prior move up in longer-term yields.' The Fed chief is due to speak late Thursday New York time in Bangkok.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-selloff-spurs-flight-to-bonds-on-ai-worries%3A-markets-wrap/92218059"},{"time":"10/15","fact":"'Neither the CPI nor PPI show inflation moving back towards the Fed's target, leaving the Fed with \"more work to do,\" in Chair Warsh's words at Jackson Hole earlier this year,' said Bill Adams, Chief U.S. Economist at Fifth Third Commercial Bank. 'The retail sales report wasn't soft enough to shift the Fed's focus away from inflation.'","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"}]},{"t":"⑤ The Rotation's Receipts: Consumers Bid, Health Care Leads — and the Breadth Test","steps":["The Dow's engine: Nike +5.2% — a stock down ~45% for the year heading into the session — plus Salesforce +4.6% and Home Depot +4.3% helped power the 556-point advance","The consumer bid: Walmart +1.5% on a Deutsche Bank upgrade, Sherwin-Williams +3.8% and McDonald's +1.8% rose as investors rotated into 'more defensive consumer-centric stocks'","The health bid: health care +1.9%, the best of 11 sectors — Moderna +4.5%, Veeva +5.3%, Eli Lilly +3.5%, UnitedHealth +2.8%, Amgen +1.9%","The one-offs: International Paper +6.9% on talks to sell its EMEA packaging unit; Marsh & McLennan +4.6% on a stronger profit","The counterweights: Rocket Lab -6.6% after delaying its Neutron debut to next year; bitcoin briefly broke below $80,000 before recovering"],"d":"The rotation's receipts: the money that left chips went shopping — consumers, health care and small caps got paid, and the losers were mostly the AI complex and the delayed.","news":[{"time":"10/15","fact":"Shares of sportswear giant Nike, which were down 45% for the year heading into Thursday's session, jumped 6% Thursday afternoon to lead gains on the Dow Jones Industrial Average. Sherwin-Williams, Home Depot, Walmart, and McDonald's also climbed, helping lift the index 1%, while AI darlings Nvidia and Amazon declined.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"The S&P 500 Health Care Sector is up roughly 2.5% Thursday afternoon to help the benchmark index eke out a fractional gain, with Moderna, Veeva Systems and Eli Lilly and Co. leading the sector; UnitedHealth Group and Amgen were each up more than 3%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"Walmart shares were up 2% to around $119 in recent trading, among the biggest gainers in the Dow Jones Industrial Average, after Deutsche Bank lifted its rating to 'buy' and its target to $136 from $113.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"Shares of International Paper are soaring 7% to rank among the top S&P 500 gainers Thursday after the firm said that it is 'evaluating unsolicited inbound inquiries in relation to its EMEA Packaging Business, and is in discussion with potential bidders.'","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"Rocket Lab stock is sinking sharply after the aerospace company pushed back the launch of its Neutron rocket to next year; shares were down 11% in recent trading and are nearly 70% off their May record. Bitcoin briefly sank below the $80,000 level — the lowest since mid-September — after a pair of key inflation readings raised rate-hike expectations.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10152026-12174789"},{"time":"10/15","fact":"Marsh & McLennan helped lead the way and rallied 4.6% after the insurance and professional services firm that updated its brand name to Marsh reported a stronger profit for the summer than analysts expected.","src":"AP","u":"https://apnews.com/article/stock-markets-kospi-tech-shares-e889ad7dee2b7dd959f1b8bc87366914"}]}]},"mtd":{"h":"October, Eleven Sessions In: Three Repricings Landed — the Rotation Answered","d":"S&P 7,651.5 to 7,744.06 (+1.21% MTD): eleven sessions delivered one S&P record close (and two for the Nasdaq), a 2002-ceiling re-test — and three repricings whose latest beat met a rotation bid.","badges":["S&P MTD +1.21%","Nasdaq -0.55%","10Y -20bp","Brent +8.1%"],"c1":"Eleven sessions into October and the month's arc is complete: one S&P record close (7,818.93 on 10/6, its first above 7,800) and two Nasdaq records (10/5-6), the 2002 ceiling re-tested at 24-year highs, and three repricings — wireless (10/9), the AI complex (10/12-13), and the inflation reckoning (10/14-15) — whose latest beat met a broad rotation bid. The S&P is +1.21% MTD at 7,744.06; the Nasdaq -0.55%; the Dow +2.50%. The fuel: AI compounding and a live deal tape. The tax: hot prints (CPI 3.7% y/y, PPI 6.3% y/y) that moved October hike odds from 22% before CPI to a 37% peak, then ~29% — half-faded, not ignored; a 10Y that touched a 24-year high of 5.36% then closed 5.09% (-20bp MTD); Brent +8.1% on the December basis. Beneath: Energy (+8.2%), Staples (+7.5%) and Utilities (+5.6%) lead sectors, while Tech (-3.4%) sits at the bottom of the pack. Gate: the Oct 27-28 meeting.","c4":"<ul class='play'><li>October's verdict so far: the records came early, three repricings followed — and the third met buyers, not capitulation; the month's engine (AI, deals) keeps running while the rate axis charges rent.</li><li>The dispersion signature holds: the barrel's beneficiaries and defensives lead; the AI complex's crowded corners get taxed — most recently by CPI and PPI.</li><li>The month's referee is still the Fed: October hike odds went from 22% before CPI to a 37% peak, then ~29% — the prints were half-faded, and the Oct 27-28 meeting decides whether the repricing gets another round.</li></ul>","kpi":[["S&P MTD","+1.21%","eleven sessions",1],["Nasdaq","-0.55%","repriced",0],["10Y MTD","-20bp","off 24-yr high",1],["WTI MTD","+8.4%","fear trade",1]],"tbl":[["S&P","7,651.54","7,744.06","+1.21%"],["Dow","50,906.05","52,177.69","+2.50%"],["Nasdaq","26,861.06","26,713.03","-0.55%"],["10Y","5.29%","5.09%","-20bp"],["WTI","$90.42","$97.97","+8.4%"],["VIX","16.34","16.46","+0.7%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15"],"data":[7651.5,7666.5,7722.7,7774,7818.9,7801.8,7765.4,7811.5,7807.2,7805.4,7718.9,7744.1],"chains":[{"t":"① Eleven Sessions, One Arc: the Records, the Ceiling — and the Repricings","main":1,"steps":["The opening stretch: two Nasdaq records (10/5-6) and the S&P's only record close of the month (7,818.93 on 10/6, its first above 7,800) — even as the 10Y pushed toward 24-year highs","Mid-window: the 2002 ceiling re-tested at 24-year highs — each re-test still bought at auction","The repricings: wireless (10/9); the AI complex's global unwind (10/12-13); then the inflation reckoning (10/14-15) — hot prints that moved October hike odds from 22% before CPI to a 37% peak, then ~29%","The flows: the third repricing's worst beat met a rotation bid — bonds bid, the 10Y closing the window at 5.09% (-20bp)","The month's math: S&P +1.21%, Nasdaq -0.55%, Dow +2.50% — dispersion, not direction"],"d":"Eleven sessions in: records early, a ceiling re-tested — then three repricings, the last met by buyers. October's engine keeps running; the rate axis keeps charging rent.","news":[{"time":"10/14","fact":"According to CME FedWatch, traders now see a 37% likelihood the Federal Reserve will raise interest rates at its meeting in two weeks, up from 22% before the reading, and a 91% likelihood the central bank will lift <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
</body>
</html>
