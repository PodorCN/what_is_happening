<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line)}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line)}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:21px;margin-bottom:10px;line-height:1.35}
.t i{font-style:normal;font-size:10.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 9px;margin-right:9px;vertical-align:3px}
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:5px 12px;font-size:13.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:15px}
.cdesc{font-size:16px;color:var(--mut);line-height:1.8;font-style:italic}
.facts{margin:14px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:11px 0;font-size:16px;line-height:1.85}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:13px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}
</style>
</head>

s set: the near-term hike trade is dead (odds from ~69% a week before the month to ~23%), growth is back in charge (the Nasdaq's intraday record; Consumer Discretionary +1.1% leading), and the long end won't join the party — the 10Y sits at 5.28%, barely off the 24-year highs printed in Q3's final days. Day two added the month's first supply-side answer for fuel (G7 barrels; no US export ban) and its first earnings casualty (Nike). Net after two days: S&P +0.93%, Nasdaq +1.23%, Dow +0.53%, with WTI +0.8% and gold -0.6%. The month's next referees: the Fed minutes, CPI — and a bond market that hasn't blinked.","c4":"<ul class='play'><li>October's checklist: FOMC minutes (Wednesday), CPI (Oct 14) and the Oct 28 meeting — with the near-term hike priced out, the risk now sits in any hawkish re-repricing.</li><li>Watch the growth/defensive spread: Tech and Consumer Discretionary leading while Health Care lags is the early Q4 signature.</li><li>Diesel is the month's inflation swing factor — the G7 release cut the tail risk; the war's supply story can put it back.</li></ul>","kpi":[["S&P MTD","+0.93%","two days",1],["Nasdaq MTD","+1.23%","record",1],["10Y MTD","-1bp","stuck high",0],["WTI MTD","+0.8%","capped",0]],"tbl":[["S&P","7,651.54","7,722.72","+0.93%"],["Dow","50,906.05","51,176.96","+0.53%"],["Nasdaq","26,861.06","27,190.86","+1.23%"],["10Y","5.29%","5.28%","-1bp"],["WTI","$90.42","$91.11","+0.8%"],["VIX","16.34","15.31","-6.3%"]],"labels":["9/30","10/1","10/2"],"data":[7651.5,7666.5,7722.7],"chains":[{"t":"① Two Days In, the Odds Are the Story","main":1,"steps":["A week before the month began, October hike odds stood near 69%; by Oct 1 they had slid to ~31%","Soft PCE (9/30) and dovish Fed voices set the slide in motion — 45% before Wednesday's PCE print","The 29k payrolls finished the job: 23% by Friday's close (from 28% before the report; as low as ~15% after)","December still prices ~70%+ odds of at least one more hike — a repricing, not a pivot","Net for the month: S&P +0.93%, Nasdaq +1.23% — the odds move is October's core event"],"d":"October's headline trade isn't in the tape, it's in the odds: an October-meeting hike that was nearly 69% priced a week before the month began sits at 23% two sessions in.","news":[{"time":"10/2","fact":"October hike odds fell to 23%, down from 28% before the reading and 64% a week earlier, per CME FedWatch.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10022026-12153808"},{"time":"10/2","fact":"'Markets now assign a 15% chance of a hike in October from around 25% before the data' — the odds had already been sliding all week.","src":"Reuters","u":"https://sa.marketscreener.com/news/global-shares-gain-bonds-supported-as-oil-drops-jobs-data-misses-expectations-ce785ddad180ff27"},{"time":"10/2","fact":"Markets continued to price in more than a 70% chance of at least one further rate increase by December.","src":"BullionVault","u":"https://www.bullionvault.com/gold-news/gold-price-news/gold-rises-jobs-data-etf-demand-10022026"}]},{"t":"② The Long End's Message: Levels, Not Odds","steps":["The 10Y ends the first week at 5.28% — 1bp below where September closed it","Within ~6bp of Thursday's 24-year peak (~5.35%); the 30Y sits at 5.63%","Bonds repriced volatility, not levels: 'bonds supported as oil drops, jobs data misses expectations'","Higher-for-longer remains the street's base case (Chubb; Rosner keeps December)","The reprieve's real signature: no fresh highs — so far"],"d":"Tell relief apart from reversal: the market bought the odds repricing while the long end held every level it reached this quarter.","news":[{"time":"10/2","fact":"The 10-year yield closed at 5.281% — up on the day after an initial slide to 5.16% — with the 30-year at 5.629%; both remain near multi-decade highs.","src":"CNBC","u":"https://www.cnbc.com/2026/10/02/treasury-yields-bonds-nonfarm-payrolls.html"},{"time":"10/1","fact":"Treasuries were exiting their worst quarter since 1994, with the global bond rout having pushed US yields to multi-decade highs earlier in the week.","src":"Reuters","u":"https://www.reuters.com/business/bonds-teeter-after-us-treasuries-worst-quarter-since-1994-2026-10-01"}]},{"t":"③ October's First Two-Sided Trade: Dollars Firm, Gold Fails","steps":["DXY +0.5% MTD at 101.9 — the yield gap still bids the dollar","Gold -0.6% MTD ($4,162.5) after a +1% spike on the jobs miss washed out","September's precedent: gold -8.5% as the dollar rallied and oil spiked","The tell: zero-yield assets can't hold a dovish bid while long bonds sit at 24-year highs","Watch gold versus the 5.2% 10Y as the cleanest read on whether October's dovish turn is real"],"d":"The month's first two sessions say the dovish repricing hasn't reached the dollar or the long end — and gold, the cleanest beneficiary if it did, couldn't hold a bid.","news":[{"time":"10/2","fact":"Gold rose ~1% right after the data, then gave back much of it; the metal fell 8.5% in September as the dollar rallied and crude oil prices rose.","src":"BullionVault","u":"https://www.bullionvault.com/gold-news/gold-price-news/gold-rises-jobs-data-etf-demand-10022026"},{"time":"10/2","fact":"Fifth Third's Bill Adams: the jobs report 'wasn't weak enough to shift their focus away from inflation' — CPI and PPI, pump prices and geopolitics have more power over the next Fed decision.","src":"Kitco","u":"https://www.kitco.com/news/article/2026-10-02/gold-prices-see-sold-bid-us-economy-created-29k-jobs-september"}]}]},"qtd":{"h":"Q4 Opens +0.93% With a Jobs Save — December Is the First Gate","d":"9/30 7,651.5 to 10/2 7,722.7 (+0.93% QTD): Q4's first two sessions answered Q3's open question — the labor market can still blunt the Fed; the quarter's next test is whether earnings outrun a 5.28% long bond.","badges":["S&P QTD +0.93%","Nasdaq +1.23%","10Y -1bp","Gold -0.6%"],"c1":"Q4 is two sessions old and already has its organizing event: a 29,000 payroll print that shelved the near-term hike. The S&P sits at 7,722.72 (+0.93% QTD), about 1% from its August record; the Nasdaq (+1.23%) touched an intraday record; the Dow trails (+0.53%). The quarter's character so far is dispersion: storage cracked ~10% on Toshiba's capacity news while semis rallied (SOXX +2.2%); Nike warned while Tesla delivered; Health Care lagged a green tape. The long end Q4 inherited — a 5.28% 10Y, 1bp from Q3's close — is the long end it gets to keep. December's meeting (still ~70%+ priced for a hike), the FOMC minutes and CPI (Oct 14) are the quarter's first gates; the earnings wave is the first test.","c4":"<ul class='play'><li>Q4's opening trade: 'no October hike' is nearly free to hold — the money is now in December's repricing and in earnings proof.</li><li>Storage's Toshiba shock and Nike's slide are Q4's first guidance casualties — this market pays for proof and taxes surprises.</li><li>Duration: a 5.2%-5.35% 10Y band caps multiples while it lasts; the quarter's bull case starts with a bond market that stops making news.</li></ul>","kpi":[["S&P QTD","+0.93%","open",1],["Nasdaq","+1.23%","record",1],["10Y QTD","-1bp","the shelf",0],["WTI","+0.8%","policy cap",0]],"tbl":[["S&P","7,651.54","7,722.72","+0.93%"],["Dow","50,906.05","51,176.96","+0.53%"],["Nasdaq","26,861.06","27,190.86","+1.23%"],["10Y","5.29%","5.28%","-1bp"],["Gold","$4,186.7","$4,162.5","-0.6%"],["BTC","$83.6k","$84.5k","+1.1%"]],"labels":["9/30","10/1","10/2"],"data":[7651.5,7666.5,7722.7],"chains":[{"t":"① The Q3 Handoff, Tested on Day Two","main":1,"steps":["Q3 closed: S&P +2.03%, Nasdaq +2.47%, Dow -2.70%","Q3's spoiler: Treasuries' worst quarter since 1994 as the 10Y surged to 5.29%","Q4 days one and two: +0.93%, as the payrolls miss cut near-term hike odds to ~23%","But December (~70%+ for a hike) and the Oct 28 meeting remain live","Now earnings season carries the load (PepsiCo, Delta, Constellation first)"],"d":"Q3 ended net-positive but rate-taxed; Q4's first two days changed the odds, not the arithmetic — earnings still have to outrun the long bond.","news":[{"time":"9/30","fact":"Q3 closed with the S&P up 2.03% and the Nasdaq up 2.47% — a second straight quarterly gain — while the Dow fell 2.70%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-09302026-12148860"},{"time":"10/1","fact":"Global bonds were pushed to multi-decade highs as US Treasuries capped their worst quarter since 1994.","src":"Reuters","u":"https://www.reuters.com/business/bonds-teeter-after-us-treasuries-worst-quarter-since-1994-2026-10-01"}]},{"t":"② The Opening Split: Storage Cracks, Semis Sprint","steps":["Day one: Accenture +16% on bookings — then gave it back (-6.3% on day two)","Day two: Broadcom +3.4% ($60B Anthropic financing); SOXX +2.2%; Nvidia records","Against it: Toshiba doubling HDD capacity sent Seagate and Western Digital down ~10% each","Two-session scoreboard: Nasdaq +1.23% vs S&P +0.93% vs Dow +0.53%","Q4's dispersion trade is live: proof paid (Tesla, Broadcom), surprises taxed (Nike, storage)"],"d":"Q4's first two days delivered the quarter's template: earnings proof gets premium pricing, supply and guidance surprises get marked down — often on the same tape.","news":[{"time":"10/2","fact":"Toshiba will double HDD production capacity by fiscal 2027 (Nikkei Asia); Seagate and Western Digital each fell more than 10% and the memory ETF slipped 0.5%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10022026-12153808"},{"time":"10/2","fact":"Broadcom rose ~3.4% on the $60B Anthropic chip-financing report as the semiconductor ETF gained 2%; Nvidia hit an intraday high.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10022026-12153808"}]},{"t":"③ Fuel's First Policy Answer of Q4","steps":["Q3: WTI +30% as the war premium rebuilt","Q4 day two: the G7's 100M-barrel release (diesel first) plus no US export ban","Gasoil -5% Friday — products are the complex's stress point, not crude","Wall Street's 2026 Brent forecasts persist high (Reuters poll: $89 average)","The quarter's math: normalization is a bull input everywhere; escalation is the tail"],"d":"Oil entered Q4 the way it dominated Q3 — supply fear, products leading — and got its first coordinated policy response within two sessions.","news":[{"time":"10/1","fact":"The Trump administration told Germany and France to draw down emergency diesel inventories or face a potential US export ban.","src":"Reuters","u":"https://www.reuters.com/business/energy/us-tells-france-germany-release-diesel-stocks-or-face-us-export-ban-sources-say-2026-10-01/"},{"time":"10/2","fact":"The G7 agreed to release 100 million barrels of reserves with a diesel frontload in the first 20 days, coordinated through the IEA.","src":"CNBC","u":"https://www.cnbc.com/2026/10/02/diesel-oil-trump-europe-export-ban.html"},{"time":"9/30","fact":"Reuters' monthly poll lifted the 2026 Brent forecast to $89.05/b (from $85.08) with WTI at $83.90, as Gulf disruption drags on.","src":"Reuters","u":"https://www.reuters.com/business/energy/analysts-raise-2026-oil-forecasts-prolonged-gulf-disruption-2026-09-30/"}]}]},"ytd":{"h":"The Bull Holds Into Q4: S&P +12.81% as the 10Y's +112bp Sets the Terms","d":"S&P +12.81%, Nasdaq +16.99%, Dow +6.48% with two days of Q4 logged — AI and earnings carry; the 10Y's +112bp and an eighth month of war still tax the rest.","badges":["S&P +12.81%","Nasdaq +16.99%","Dow +6.48%","10Y 5.28%"],"c1":"Two sessions into Q4 and the year's base case is intact: the bull runs on AI capex and earnings proof, fighting the same two taxes — a 10Y up 112bp to 5.28% (still within ~6bp of its 24-year highs), and oil up ~59% as the war crossed into an eighth month. The scoreboard: S&P +12.81%, Nasdaq +16.99%, Dow +6.48%; underneath, energy (+40%) leads and consumer discretionary (-8%) lags. Friday added the year's cleanest dovish data point — a payroll print that killed the October hike trade — and the war's first supply-side answer — the G7's 100 million barrels. Q4 opened green where it could: +0.93%.","c4":"<ul class='play'><li>The year's lesson holds into Q4: buy where earnings compound (AI infrastructure), rent where rates rule (long duration, the consumer).</li><li>Rates: the 10Y's +112bp is 2026's biggest tax — a confirmed Fed pause is the largest single bullish catalyst left this year.</li><li>Wildcards into year-end: the war's fuel premium (month eight) and December's Fed — both live.</li></ul>","kpi":[["S&P YTD","+12.81%","bull",1],["Nasdaq","+16.99%","leading",1],["Dow","+6.48%","lagging",1],["10Y","+112bp","2026's tax",0]],"tbl":[["S&P","6,845.5","7,722.72","+12.81%"],["Dow","48,063","51,176.96","+6.48%"],["Nasdaq","23,242","27,190.86","+16.99%"],["10Y","4.16%","5.28%","+112bp"],["30Y","4.84%","5.63%","+79bp"],["Gold","$4,341","$4,162.5","-4.1%"]],"labels":["12/31","3/31","6/30","8/13","9/30","10/1","10/2"],"data":[6845,6528,7499,7799,7651.5,7666.5,7722.7],"chains":[{"t":"① The Bull Market Continues","main":1,"steps":["S&P +12.81% YTD; Nasdaq +16.99%; Dow +6.48%","AI capex remains the engine (Nvidia +25% YTD; Broadcom's $60B financing syndicate)","Q4 opened +0.93% — the S&P sits about 1% from its August record","Every yield shock this year has been bought — Friday's included"],"d":"The year's base case hasn't broken: earnings-proof AI compounds, dips get bought, and the S&P sits +12.81% with a quarter to go.","news":[{"time":"10/2","fact":"The S&P 500 climbed 0.7% Friday and pulled within 1% of its all-time high; for the year it is up 12.8%.","src":"AP","u":"https://krmg.com/2026/10/02/how-major-us-stock-indexes-fared-friday-10-2-2026/"},{"time":"10/2","fact":"For the year, the Nasdaq is 17% higher, while the S&P 500 and Dow are up a respective 13% and 6.5%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10022026-12153808"}]},{"t":"② The Second Inflation Wave","steps <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
