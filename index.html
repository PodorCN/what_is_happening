<head>

<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line)}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line)}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:17px}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}
</style>
</head>

<script type="application/json" id="embedded-snap">{"date":"2026-10-07","updatedAt":"2026-10-07T23:10:00Z","P":{"today":{"h":"The 2002 Ceiling Re-Tests: Long Yields Spike, Records Slip — Then the Valves Open","d":"","badges":["S&P 7,802 -0.22%","Nasdaq 27,539 -0.22%","Dow -0.66%","10Y 5.28% +1bp","Brent $100.20"],"c1":"The record run's first October loss — and almost all of it recovered by the close. Long-dated Treasury yields resumed their climb, the 10-year touching 5.365% (highest since April 2002) and the 30-year 5.732% (highest since May 2002), while Houthi attacks on Saudi targets put the war premium back on the barrel; the S&P slid as much as 0.7% and the Dow 1.2% intraday, snapping their four-day win streaks, and the Nasdaq's six-day run ended. Two valves then opened: a strong 10-year auction backed yields off the highs (the 10Y finished +1bp at 5.28%), and the IEA agreed to accelerate its emergency stock release, diesel first, turning crude lower — WTI settled lower, Brent -0.38%. The 2 pm FOMC minutes showed 'most participants' still expect another hike by year-end. The close: S&P 7,801.77 (-0.22%), Dow 51,179.87 (-0.66%), Nasdaq 27,538.69 (-0.22%). Under the hood it was worse than it looked: industrials -2.2% as Caterpillar sank 5.8% on an FTC/USDA farm-equipment inquiry; health care the lone green sector (+1.0%); gold at a two-month low; bitcoin -2.7% to $83.2k; and the dollar +0.4% to 102.29 as the euro slid toward 17-month lows.","c4":"<ul class='play'><li>The 5.25-5.35% band: every re-test of the 2002 ceiling still gets bought at the auction — but the band caps multiples; CPI (Oct 14) and the Oct 28 meeting referee next.</li><li>The split is the trade: rate-sensitive cyclicals (machinery, homebuilders, small caps) pay the toll while defensives (health care) and bottlenecks get paid — dispersion, not direction.</li><li>The barrel's $100 line: the IEA's accelerated release vs the re-arming war premium — below it the inflation trade exhales, above it re-arms.</li></ul>","kpi":[["S&P","7,801.77","-0.22%",0],["Nasdaq","27,538.69","six-day run ends",0],["10Y","5.28%","+1bp",0],["WTI","$88.28","-1.3%",0]],"tbl":[["S&P","7,818.93","7,801.77","-0.22%"],["Dow","51,521.28","51,179.87","-0.66%"],["Nasdaq","27,599.79","27,538.69","-0.22%"],["10Y","5.27%","5.28%","+1bp"],["WTI","$89.44","$88.28","-1.3%"],["Gold","$4,187.1","$4,141","-1.1%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7"],"data":[7651.5,7666.5,7722.7,7774,7818.9,7801.8],"chains":[{"t":"① Main Chain: The 2002 Ceiling Re-Tests — and the Record Run Blinks","main":1,"steps":["Overnight into the open: the long end re-tests its 2002 ceiling — the 10-year touches 5.365% (highest since April 2002), the 30-year 5.732% (highest since May 2002)","The move is pure duration: the 5Y was roughly flat — so the pressure lands as a discount-rate hit on equity valuations, not a growth scare","Records give way: the S&P slides as much as 0.7% (low 7,763), the Dow 1.2% (low 50,917); S&P and Dow snap four-day win streaks, and the Nasdaq notches its first down day in six","2 pm: the FOMC minutes land — another hike 'by year's end' remains the majority view, and the split is over the rationale (energy-shock insurance vs demand-driven inflation)","The afternoon: the long end backs off its highs, dip-buyers step in, and most of the morning's slide is recovered — a near-flat close"],"d":"One chain explains the day's 60%: the long end re-tested its 2002 ceiling, the record run gave way — and the afternoon clawed most of it back before the close.","news":[{"time":"10/7 morning","fact":"Investors were spooked by the benchmark 10-year Treasury note yield reaching its highest level since April 2002 on Wednesday. The 30-year bond yield also hit its highest level since May 2002.","src":"CNBC","u":"https://www.cnbc.com/2026/10/06/stock-market-today-live-updates.html"},{"time":"10/7 close","fact":"All three major US stock indexes closed modestly lower, off record highs, as Treasury yields climbed.","src":"Reuters (StreetInsider)","u":"https://www.streetinsider.com/Market+Check/Nasdaq%2C+S%26P+500+slip+from+record+highs+as+yields+and+oil+rebound/27157668.html"},{"time":"10/7","fact":"The September FOMC minutes revealed divisions over the rationale of the increase: some participants saw a hike as necessary to keep the impact of energy price shocks at bay, while others felt the increase was necessary to curb demand-driven inflation.","src":"Reuters (StreetInsider)","u":"https://www.streetinsider.com/Market+Check/Nasdaq%2C+S%26P+500+slip+from+record+highs+as+yields+and+oil+rebound/27157668.html"},{"time":"10/7 close","fact":"The S&P 500 fell 17.16 points, or 0.2%, to 7,801.77. The Dow Jones Industrial Average fell 341.41 points, or 0.7%, to 51,179.87. The Nasdaq composite fell 61.20 points, or 0.2%, to 27,538.69.","src":"AP (Seattle Times)","u":"https://www.seattletimes.com/business/how-major-us-stock-indexes-fared-wednesday-10-7-2026/"}]},{"t":"② The Split Tape: Credit-Sensitive Machinery Crushed, Health Care Paid","steps":["Industrials were the worst of 11 sectors (-2.2%): Caterpillar -5.8% led the Dow's drag, with Emcor -4.8%, Comfort Systems -4.2% and Allegion -4.7% alongside","Two blows for the machinery complex: the rate squeeze on credit-driven equipment demand — and a joint FTC/USDA inquiry into farm-equipment market practices (Deere -3.8%, CNH -6.1%, AGCO -6.1%)","Health care was the lone green sector (+1.0%): Moderna +4.8% and Eli Lilly +2.7% led, with Amgen, Johnson & Johnson and CVS also higher","The credit-sensitive edges: homebuilders -2.9% and housing -2.3% as the 30-year mortgage rate hit a near three-year high; the Russell 2000 -1.3% lagged again","The other tail: Skydance -6.7% — the worst performer in the S&P 500 — on its second day after the WBD merger"],"d":"The flat close hid a violent split: anything sold on credit paid the toll — machinery, homebuilders, small caps — while defensive health care was the only shelter.","news":[{"time":"10/7","fact":"The Federal Trade Commission and U.S. Department of Agriculture launched a joint public inquiry into potential anticompetitive practices in the agricultural equipment markets; shares of Caterpillar fell 5.9%, CNH Industrial 5.3%, Agco 5.7% and Deere 2.8%.","src":"Dow Jones (Morningstar)","u":"https://morningstar.com/news/dow-jones/202610076006/regulators-investigate-potential-anticompetitive-conduct-in-agricultural-equipment-markets"},{"time":"10/7 morning","fact":"Caterpillar tumbled 7% to $807 while Deere dropped 4% as two-decade-high Treasury yields hit credit-dependent equipment makers hardest.","src":"24/7 Wall St (Yahoo Finance)","u":"https://finance.yahoo.com/markets/stocks/articles/caterpillar-drops-6-industrials-sell-155722968.html"},{"time":"10/7","fact":"Moderna rose roughly 5% and Eli Lilly added nearly 3% to rank among the day's best-performing stocks in the S&P 500. Drugmakers Amgen and Johnson & Johnson also climbed, along with insurer Aetna parent CVS Health.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10072026-12162282"},{"time":"10/7","fact":"Skydance fell in its second day after the renamed company's merger with Warner Bros. Discovery closed — the worst performer in the S&P 500, and down 35% since the start of the year.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10072026-12162282"},{"time":"10/7","fact":"Following the upward march of benchmark Treasury yields, the 30-year fixed mortgage rate surged last week to a near three-year high, according to the Mortgage Bankers Association. Housing and homebuilders slipped 2.3% and 2.9%, respectively.","src":"Reuters (StreetInsider)","u":"https://www.streetinsider.com/Market+Check/Nasdaq%2C+S%26P+500+slip+from+record+highs+as+yields+and+oil+rebound/27157668.html"}]},{"t":"③ The Barrel's Round Trip: $102.59 in the Morning, Back to the $100 Line","steps":["The bid: Houthi attacks on Saudi targets put the war premium back on — Brent rallies ~2% to a session high of $102.59, WTI to ~$91","The counter: the IEA agrees to accelerate its March collective action — ~100M barrels still to come — and to prioritize diesel 'given the current tightness in diesel markets'","The reversal: both benchmarks slide to session lows at 1:47pm ET (Brent $99.62, WTI $87.96) as the supply news lands","The settle: WTI -1.3% at $88.28, Brent -0.38% at $100.20 (December basis) — the day's cleanest round trip","The read-through: stocks pared losses after crude turned lower — the barrel remains the fastest inflation valve on the board"],"d":"Oil wrote Wednesday's cleanest arc — a morning spike on war headlines, then lower all afternoon once policy answered — Brent's settle back at the $100 line.","news":[{"time":"10/7","fact":"The International Energy Agency agreed on Wednesday to accelerate the release of oil stocks and to prioritise diesel supplies under a plan launched in March. Completing previously announced releases as quickly as possible could bring around 100 million barrels to market.","src":"Reuters (Al-Monitor)","u":"https://al-monitor.com/originals/2026/10/iea-accelerate-oil-reserve-release-says-100-million-barrels-still-come"},{"time":"10/7","fact":"Oil rose Wednesday as attacks by Yemen's Iran-backed Houthis on Saudi Arabia raised concerns over crude flows from the Middle East even as supplies have been recovering.","src":"CNBC","u":"https://www.cnbc.com/2026/10/06/stock-market-today-live-updates.html"},{"time":"10/7 close","fact":"US crude prices settled down 1.3% at $88.28 per barrel on Wednesday. International Brent crude futures, meanwhile, ended at $100.20 a barrel, down 0.4%.","src":"CNBC","u":"https://www.cnbc.com/2026/10/06/stock-market-today-live-updates.html"},{"time":"10/7","fact":"'The sustained ability of the Houthis in Yemen to target oil facilities hundreds of kilometers from the border keeps the risks of a renewed large-scale crude supply disruption present and high,' said Samer Hasn, senior market analyst at XS.com.","src":"CNBC","u":"https://www.cnbc.com/2026/10/06/stock-market-today-live-updates.html"}]},{"t":"④ The Relief Ledger: A 'Strong' Auction, a Known Fed — and the Gates Ahead","steps":["The bond valve: $39 billion of 10-year notes cleared at a 5.3% auction yield — the highest since 2000 — and BMO called the sale 'strong', with non-dealer bidding above average","The Fed valve: the hawkish minutes were already in the price — October hike odds near 17% (from ~38% a week ago), December ~83%","The market's own valve: dip-buying was immediate — the morning's slide was almost fully recovered by the close","The gates: CPI (Oct 14), the Oct 28 meeting, and Q3 earnings season kicking into gear next week — UnitedHealth and Johnson & Johnson lead off","The quiet tell: the VIX closed at 15.08 — barely up — no panic bid anywhere in the cross-asset tape"],"d":"Wednesday's shock absorbers: an auction that held, a hawkish Fed already priced out of October, dip-buyers on the clock, and the gates still ahead.","news":[{"time":"10/7","fact":"The 10-year yield moved lower after the government's auction of $39 billion in 10-year notes. BMO called the bond sale 'strong' and said the bidding from non-dealers was higher than average; the auction yield was 5.3%, the highest since 2000.","src":"CNBC","u":"https://www.cnbc.com/2026/10/06/stock-market-today-live-updates.html"},{"time":"10/7","fact":"Financial markets are currently pricing in a 17.2% likelihood that the Fed will implement a second consecutive rate hike at the conclusion of its October meeting, down from 37.6% a week ago, per CME's FedWatch tool.","src":"Reuters (StreetInsider)","u":"https://www.streetinsider.com/Market+Check/Nasdaq%2C+S%26P+500+slip+from+record+highs+as+yields+and+oil+rebound/27157668.html"},{"time":"10/7","fact":"Investors will get updates on many of the biggest names in the coming weeks as the third-quarter earnings season kicks into gear, led by UnitedHealth and Johnson & Johnson, which are scheduled to report ahead of next Tuesday's opening bell.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10072026-12162282"}]},{"t":"⑤ The Dollar Squeeze: Gold's Two-Month Low, Crypto's Slide","steps":["The dollar did the talking: the index closed at 102.29 while the euro slid to $1.1198, back near Monday's lows — French OAT yields up ~12bp, their biggest jump in two weeks","The squeeze reached the metals: gold -1.1% to $4,141 (December futures) after an intraday low of $4,091.2 — lowest since Aug 3 — with silver -2.8% and gold miners -3.9%","The risk corner: bitcoin -2.7% to $83.2k from overnight highs ~$85.7k — Strategy -6.8% (the worst in the Nasdaq 100), Coinbase -3.9%","The supports underneath the dollar: hawkish minutes, elevated energy prices, and French fiscal stress — StoneX's Samarth sees OATs with 'room to sell off further' but not a panic"],"d":"The cross-asset tell: on a war-headline day the dollar squeezed everything priced in it — gold to a two-month low and crypto's corner sold — the rates-and-fiscal story outshouting the safe-haven bid.","news":[{"time":"10/7","fact":"The euro tumbled as French bonds came under renewed pressure on fiscal concerns; it slumped 0.53% to $1.1198, closing in on the 17-month lows hit on Monday, while the dollar index was last up 0.32% to 102.24.","src":"Reuters (Global Banking & Finance)","u":"https://www.globalbankingandfinance.com/dollar-holds-losses-markets-await-fed-minutes-speakers/"},{"time":"10/7","fact":"Gold hit a low of 4,091.2 on Wednesday, reaching the lowest level since Aug. 3, when it traded as low as 4,074. Gold miners were down 3.85%, on pace for their worst day since Sep. 28.","src":"CNBC","u":"https://www.cnbc.com/2026/10/06/stock-market-today-live-updates.html"},{"time":"10/7","fact":"Spot gold fell 1.3% to $4,107.88 per ounce by 11:43 a.m. EDT, touching its lowest level since August 5. Spot silver eased <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">→</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
