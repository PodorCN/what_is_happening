<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Street Updates by Podor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}
</style>
</head>

<script type="application/json" id="embedded-snap">{"date":"2026-10-14","updatedAt":"2026-10-14T22:30:00Z","P":{"today":{"h":"The CPI Reckoning: a Hot Print Re-Arms the Rate Trade — and the AI Complex Pays","d":"","badges":["S&P 7,719 -1.11%","Nasdaq 26,693 -1.88%","Dow -0.09%","10Y 5.19% -3bp","Brent $106.06"],"c1":"The CPI reckoning arrived: September inflation ran at 3.7% y/y (core 2.6%) — hotter than the 3.6% consensus — and the market repriced the Fed in real time: October hike odds jumped to ~37% from ~22%, December to ~91%. The 10Y spiked to 5.33% and the 30Y to 5.63%; the dollar hit its highest since May 2025. The pain landed where duration lives: CoreWeave -15.5% (its bonds trading at distress levels; its CEO called the market 'irrational'), Oracle -8.8%, Dell -11.3% on a Barclays downgrade, Nebius -10.1%, AMD -5.7%, Nvidia -3.2% — and the chip gauge's six-day drop reached ~12%. The Nasdaq closed -1.88% at 26,692.87 — its worst day since July 23 — and the S&P fell 1.11% to 7,718.94, its first 1% drop in more than 50 sessions; the Russell 2000 fell 1.9%, entering a correction. The split was the tell: eight of 11 sectors fell, but defensives bid — health +2.5%, staples +2.2% — leaving the Dow just -0.09%, while Apple +0.5% closed above a $5T market cap. Banks bled on earnings day two: BofA -4.8% on a $1.2B Treasury fine and a revenue miss. The bond market round-tripped — after the CPI spike, the afternoon equity slide pulled money back into Treasuries: the 10Y closed 5.19% (-3bp) and the 30Y 5.53% (-4bp). Oil gained as the Houthis hit Saudi Aramco's Dhahran headquarters and the IEA warned the diesel squeeze will last into 2027 — WTI +1.0% to $95.09 (a three-week high), Brent +0.4% to $106.06 — and the Beige Book said fuel costs are 'permeating all District reports.' Gold fell 1.6% to $4,108.60; bitcoin ~$81.7k (-1.7%). Next: PPI, retail sales and TSMC.","c4":"<ul class='play'><li>CPI passed the baton to the Fed: October (Oct 27-28) now prices ~37% and December ~91% — with PPI and retail sales Thursday and Warsh in Bangkok, the rate axis keeps trading, and the AI complex stays its highest-beta expression.</li><li>Watch the bond reversal: yields closed lower as stocks slid — if Treasuries keep absorbing equity risk the shock stays contained; if the long end re-arms above 5.3%, the AI complex gets repriced again.</li><li>Earnings remain the referee: TSMC Thursday is the next AI-demand test, and after Barclays' Dell downgrade, watch whether the enterprise-hardware selloff spreads.</li></ul>","kpi":[["S&P","7,718.94","-1.11%",0],["Nasdaq","26,692.87","-1.88%",0],["10Y","5.19%","-3bp",0],["WTI","$95.09","+1.0%",1]],"tbl":[["S&P","7,805.45","7,718.94","-1.11%"],["Dow","51,670.10","51,621.48","-0.09%"],["Nasdaq","27,204.38","26,692.87","-1.88%"],["10Y","5.22%","5.19%","-3bp"],["WTI","$94.14","$95.09","+1.0%"],["Gold","$4,177.6","$4,108.6","-1.6%"]],"labels":["10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14"],"data":[7774,7818.9,7801.8,7765.4,7811.5,7807.2,7805.4,7718.9],"chains":[{"t":"① Hot CPI, Cold Tape: the Rate Shock Lands on the AI Complex","main":1,"steps":["The print: September CPI +0.6% m/m, 3.7% y/y vs 3.6% expected — the fastest since May — with core at 2.6% (vs 2.5%); gasoline +34.2% y/y as the war's fuel shock fed through","The repricing: October hike odds jumped to ~37% from ~22% (CME), December to ~91%; traders briefly priced two hikes by end-January before those bets faded","The yield shock: the 10Y spiked to 5.33% and the 30Y to 5.63% post-print; the dollar hit its highest since May 2025 (DXY 102.56); gold slid 1.6% to $4,108.60","The AI complex takes the hit: CoreWeave -15.5% (its 2032 bond yield hit 15%), Oracle -8.8%, Dell -11.3% (Barclays downgrade), Nebius -10.1%, AMD -5.7%, Nvidia -3.2%","The chip gauge slid a sixth straight session — its longest losing streak since May 2025","The index damage: Nasdaq -1.88% (worst since July 23), S&P -1.11% (worst since July 29; a fifth loss in six sessions)"],"d":"The main chain: a hot CPI re-armed the hike trade in real time — and the rate shock landed on the market's longest-duration assets, the AI complex.","news":[{"time":"10/14","fact":"The Consumer Price Index reading indicated inflation rose 3.7% year-over-year in September, up from 3.4% in August and above the 3.6% expectation; 'core' CPI rose 2.6%, above the 2.5% consensus. Overall inflation was the highest annual rate since May, with gasoline up 34.2% over the last 12 months.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/14","fact":"According to CME FedWatch, traders now see a 37% likelihood the Federal Reserve will raise interest rates at its meeting in two weeks, up from 22% before the reading, and a 91% likelihood the central bank will lift rates at least a quarter-percentage point at its December meeting, up from 88% before the data.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/14","fact":"Gold fell over 1% on Wednesday, extending losses for a third straight session, as a stronger-than-expected inflation reading increased US Federal Reserve rate hike bets for this month. US gold futures for December delivery fell 1.6% to $4,108.60 per ounce.","src":"Kitco (Reuters)","u":"https://kitco.com/news/off-the-wire/2026-10-14/gold-drops-over-1-hot-us-inflation-data-boosts-fed-hike-bets"},{"time":"10/14","fact":"Stocks fell the most since July as a selloff in chipmakers extended a decline that was fueled by wagers the Federal Reserve will keep lifting interest rates to fight inflation. The S&P 500 snapped its longest streak without a 1% drop in over six years. The Russell 2000 entered a correction. A gauge of chip giants sank 4.3% — extending a six-day drop to about 12%; CoreWeave Inc.'s bonds hit levels that usually signal distress.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/stocks-fall-on-inflation-woes-as-chip-rout-deepens%3A-markets-wrap/92211728"},{"time":"10/14","fact":"Drops of 3.2% for Nvidia, 3.1% for Broadcom and 5.7% for Advanced Micro Devices were among the day's heaviest weights on the S&P 500. CoreWeave tumbled 15.5% for its worst day since February, GE Vernova dropped 6.2%, and Oracle sank 8.8%.","src":"AP","u":"https://apnews.com/article/stock-markets-earnings-bonds-artificial-intelligence-704d3190f0fba2908df07c85f26346ec"},{"time":"10/14","fact":"Together the declines erased some $80 billion of market value. Barclays on Wednesday downgraded Dell and two other enterprise hardware stocks, noting that Dell shares have quadrupled this year — part of an AI-fueled investor binge that has resulted in 16 stocks in the S&P 500 technology sector at least doubling this year, according to Reuters calculations. Selling has been particularly intense in CoreWeave, which has issued $22 billion of bonds and $26 billion of loans, according to LSEG data; a CoreWeave bond issued in June yielding 9.625% recently yielded 15%.","src":"Reuters","u":"https://srnnews.com/red-hot-cpi-report-fuels-ai-rout/"},{"time":"10/14","fact":"The S&P 500 declined 1.11% to end the session at 7,718.94 points, its biggest one-day drop since July 29. The Nasdaq declined 1.88% to 26,692.87 points, its biggest daily drop since July 23. The Dow Jones Industrial Average declined 0.09% to 51,621.48 points.","src":"Reuters","u":"https://www.straitstimes.com/business/companies-markets/nasdaq-ends-sharply-lower-as-hot-inflation-data-stirs-rate-hike-worries"}]},{"t":"② Earnings Day Two: the Fine, the Miss — and a Four-Month Low","steps":["BofA -4.8%: EPS 91c vs $1.09 expected (the $1.2B Treasury AML/sanctions fine cost 17c), revenue $30.0B missed as investment-banking and trading revenues fell","The fine: Treasury cited a 'failure to mitigate and report priority national security risks' — more than $5B in suspicious transactions — plus a separate $11.6M sanctions settlement","Peers: Morgan Stanley -2.7% despite a profit rise (equity traders trounced estimates; record wealth inflows); State Street -4.1% on weaker revenue","The read: the S&P 500 Banks index dipped to its lowest in over four months","The counter-bid: BlackRock +0.7% on $205B of quarterly inflows; Bending Spoons +41% as Berkshire added $330M for a 4% stake"],"d":"Earnings day two: the banks' beats didn't pay either — a $1.2B fine and a revenue miss dragged the cohort to a four-month low.","news":[{"time":"10/14","fact":"Bank of America shares finished nearly 5% lower as its results came up shy of analysts' estimates after the U.S. Treasury Department fined the firm $1.2 billion for alleged money-laundering violations. Morgan Stanley shares declined almost 3%, while BlackRock stock rose less than 1%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/14","fact":"Morgan Stanley's third-quarter profit climbed as the firm's equity traders trounced analysts' estimates and the wealth-management operation brought in a record amount of money.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/stocks-fall-on-inflation-woes-as-chip-rout-deepens%3A-markets-wrap/92211728"},{"time":"10/14","fact":"Bank of America said it earned 91 cents per share in the third quarter, below the $1.09 analysts were looking for as the fine caused a 17 cent hit to earnings. Revenue came in at $30.0 billion, up 3% year-over-year, but short of the $30.39 billion consensus. The Treasury said its investigation uncovered a 'failure to mitigate and report priority national security risks,' including more than $5 billion in suspicious transactions; Bank of America also agreed to an $11.6 million settlement over nearly 500 'apparent violations of multiple sanctions programs' including on Russia and Iran.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/14","fact":"Bank of America dropped 4.8% after reporting weaker profit and revenue for the summer than analysts expected. State Street sank 4.1% after reporting weaker revenue for the latest quarter than analysts expected, even though its profit was slightly above their forecasts.","src":"AP","u":"https://apnews.com/article/stock-markets-earnings-bonds-artificial-intelligence-704d3190f0fba2908df07c85f26346ec"},{"time":"10/14","fact":"The S&P 500 Banks index dipped to its lowest level in over four months.","src":"Reuters","u":"https://livemint.com/market/nasdaq-ends-sharply-lower-as-hot-inflation-data-stirs-rate-hike-worries-11792008137187.html"},{"time":"10/14","fact":"Bending Spoons stock is soaring more than 40% Wednesday afternoon after the Italian owner of AOL and Vimeo announced that Berkshire Hathaway had increased its stake in the company to 4%. Berkshire invested a further $330 million in Bending Spoons after previously having invested $600 million at the latter's initial public offering.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"}]},{"t":"③ The Split: Eight Red Sectors — but the Defensives Bid","steps":["Sector map: healthcare +2.5% and staples +2.2% led all 11; energy +0.6% was the only other green — eight sectors closed red","The high-multiple hit: tech -3.0% and comms -1.3% at the bottom","The index spread: Dow -0.09% vs Russell 2000 -1.9% (entering a correction, ~11% below its August peak) — composition decided who bled","The Mag7 outlier: Apple +0.5% closed above a $5T market cap; the other six fell — Meta -3.3%","The read: 'traders hide in value stocks and lower-beta sectors' (Bloomberg) — a rotation, not a run"],"d":"The split: the CPI shock hit the high-multiple end — and the rotation into defensives kept the Dow at a rounding error.","news":[{"time":"10/14","fact":"The higher-yield bogeyman has returned to haunt stocks after Wednesday morning's inflation print, prompting traders to hide in value stocks and lower-beta sectors, which are less sensitive to index gyrations. — Tatiana Darie, Macro Strategist, Markets Live","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/stocks-fall-on-inflation-woes-as-chip-rout-deepens%3A-markets-wrap/92211728"},{"time":"10/14","fact":"Apple rose about 0.5% to close with a market capitalization above $5 trillion. The other Magnificent Seven mega-cap tech stocks fell, and the Roundhill Magnificent Seven ETF (MAGS), which tracks the group, declined 2%.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/14","fact":"The Dow Jones Industrial Average fell 48 points, or 0.1%, and the Nasdaq composite slid 1.9% as stocks in the artificial-intelligence industry led the way lower.","src":"AP","u":"https://apnews.com/article/stock-markets-earnings-bonds-artificial-intelligence-704d3190f0fba2908df07c85f26346ec"}]},{"t":"④ The Barrel's Fear Trade: Aramco Hit, Diesel Warning","steps":["The escalation: Houthi attacks struck Saudi Aramco's Dhahran headquarters building (a limited fire, per the energy ministry); a container ship sank south of Hormuz after hitting a naval mine; Iran is deploying 'new tactics' against tankers","The warning: the IEA said the diesel squeeze will extend well into next year — gasoil supply falls short of demand in Q4, with inventories unlikely to refill before H2 2027","The settles: WTI +1.0% to $95.09 (a three-week high); Brent +0.4% to $106.06 — the 'fear trade' back on","The CPI tie-in: gasoline +34.2% y/y fed the print; the Beige Book says 'higher oil prices permeated all District reports,' with fuel surcharges passing through supply chains","The counter-current: expectations of more Russian diesel cap the upside; Gulf flows ex-Iran were above 81% of pre-war levels in September"],"d":"The barrel: escalation and the diesel warning vs the Russian-diesel offset — the fear trade bid, the band held.","news":[{"time":"10/14","fact":"Oil prices rose on Wednesday after the Houthis attacked Saudi Aramco's headquarters and Iran said it was deploying new tactics to target ships and keep oil prices high. Brent crude futures settled up 37 cents, or 0.35%, at $106.06 a barrel. US West Texas Intermediate crude gained 95 cents, or 1.01%, to $95.09, a three-week high.","src":"Reuters","u":"https://www.globalbankingandfinance.com/oil-prices-climb-traders-weigh-saudi-supply-risk-russian/"},{"time":"10/14","fact":"'Constraints on the diesel market will extend well into next year,' the International Energy Agency warned on Wednesday. 'However, even with a rapid recovery expected in refinery throughputs into year-end, gasoil supply falls short of meeting demand in 4Q26, suggesting that the replenishment of lost inventories, outside of typical seasonal fluctuations, is unlikely before [the second half of 2027].'","src":"CNBC","u":"https://www.cnbc.com/2026/10/14/diesel-deal-oil-price-iea-report.html"},{"time":"10/14","fact":"The Saudi Ministry of Energy said Wednesday that an administrative building belonging to oil giant Saudi Aramco had been attacked overnight; no injuries were reported at the site in Dhahran, a city on Saudi Arabia's eastern coast.","src":"CNBC","u":"https://www.cnbc.com/2026/10/14/oil-rises-amid-growing-tensions-between-saudis-and-iran-backed-houthis.html"},{"time":"10/14","fact":"A report Wednesday afternoon from the Federal Reserve added anecdotal evidence to the morning's data: 'Higher oil prices permeated all District reports,' the authors of the Beige Book said. 'Firms reported elevated diesel prices and noted that fuel surcharges were passing on increased costs throughout the supply chain.'","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"}]},{"t":"⑤ The Offsets: Bonds Absorbed It — and October Isn't a Done Deal","steps":["The reversal: the morning spike gave way to a midday bond bid as equities slid — the 10Y closed 5.19% and the 30Y 5.53%, both lower on the day, while the 2Y held at 4.808% (+1bp)","The read: 'some investors rotate back into the relative safety of the bond market' (CNBC) — yields near multi-year highs found buyers","The October question: TD Securities and Principal both see a hold — 'not strong enough to revive the case for an October hike'","The demand signal: ASML posted record Q3 sales and raised its full-year outlook amid strong AI demand — yet its shares fell 3.9%, sold with the complex","The gates: PPI (+0.6% m/m expected) and retail sales Thursday; TSMC earnings; Warsh in Bangkok; the Oct 27-28 meeting"],"d":"The offsets: bonds absorbed the equity shock, the front end held — and the market still treats an October hike as a coin-flip, not a base case.","news":[{"time":"10/14","fact":"The midday reversal came as equities sold off, with the S&P 500 dropping more than 1%, leading some investors to rotate back into the relative safety of the bond market. The 2-year Treasury yield gained more than 1 basis point to 4.808%.","src":"CNBC","u":"https://www.cnbc.com/2026/10/14/us-treasury-yields-cpi-inflation-report.html"},{"time":"10/14","fact":"'Today's report makes the chance of an October hike higher, but we still believe the Fed will hold and opt for December as the market is already doing some of the work for them,' TD Securities strategists said. Seema Shah at Principal Asset Management said markets are clearly unsettled, but the latest report is not strong enough to revive the case for an October hike.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/stocks-fall-on-inflation-woes-as-chip-rout-deepens%3A-markets-wrap/92211728"},{"time":"10/14","fact":"Chip equipment maker ASML on Wednesday posted record third quarter sales and raised its full-year outlook amid strong AI demand. Investors await Taiwan Semiconductor earnings on Thursday for further confirmation of the AI boom.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-hot-inflation-report-drops-tech-drives-sp-500-nasdaq-down-152206632.html"},{"time":"10/14","fact":"On Thursday, investors will get the September reading for the producer price index, September retail sales data and weekly initial jobless claims figures. For PPI, economists polled by Dow Jones are expecting a 0.6% rise on the month and a 5.5% gain on the year.","src":"CNBC","u":"https://www.cnbc.com/2026/10/14/us-treasury-yields-cpi-inflation-report.html"},{"time":"10/14","fact":"The print does not make an October hike the base case, but it reinforces the December-hike channel that was already heavily priced after Fed minutes showed most officials still expected another increase by year-end.","src":"Kitco (Reuters)","u":"https://kitco.com/news/article/2026-10-14/gold-silver-drop-hotter-cpi-revives-fed-rate-pressure-kitco-am-report"}]}]},"mtd":{"h":"October, Ten Sessions In: Records, a Ceiling — and the CPI Reckoning","d":"S&P 7,651.5 to 7,718.94 (+0.88% MTD): ten sessions delivered two record closes, a 2002-ceiling re-tested at 24-year highs — and a third repricing, with a hot CPI as the referee.","badges":["S&P MTD +0.88%","Nasdaq -0.63%","10Y -10bp","Brent +8.2%"],"c1":"Ten sessions into October and the month has its full arc: two record closes (the first above 7,800), the 2002 ceiling re-tested at 24-year highs, and three repricings — wireless (10/9), the AI complex (10/12-13), and Wednesday's CPI shock. The S&P is +0.88% MTD at 7,718.94; the Nasdaq -0.63%; the Dow +1.41%. The fuel: AI compounding and a live deal tape. The tax: a hot September CPI (3.7% y/y) that lifted October hike odds to ~37% and December to ~91%; a 10Y that touched 5.33% then closed 5.19% (-10bp MTD); Brent +8.2% on the December basis. Beneath: Energy (+10.0%), Staples (+6.8%) and Utilities (+5.8%) lead sectors, while Tech (-2.7%) has slid to the bottom of the pack. Gates: PPI and retail sales (10/15), TSMC — and the Oct 27-28 meeting.","c4":"<ul class='play'><li>October's verdict so far: the records came early, then three repricings — the month's engine (AI, deals) keeps running while the rate axis keeps charging rent.</li><li>The dispersion signature holds: the barrel's beneficiaries and defensives lead; the AI complex's crowded corners get taxed — now by CPI too.</li><li>The month's referee is data: PPI and retail sales Thursday, TSMC, then the Oct 27-28 meeting with October odds at ~37%.</li></ul>","kpi":[["S&P MTD","+0.88%","ten sessions",1],["Nasdaq","-0.63%","repriced",0],["10Y MTD","-10bp","ceiling held",1],["WTI MTD","+5.2%","fear trade",1]],"tbl":[["S&P","7,651.54","7,718.94","+0.88%"],["Dow","50,906.05","51,621.48","+1.41%"],["Nasdaq","26,861.06","26,692.87","-0.63%"],["10Y","5.29%","5.19%","-10bp"],["WTI","$90.42","$95.09","+5.2%"],["VIX","16.34","16.87","+3.2%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14"],"data":[7651.5,7666.5,7722.7,7774,7818.9,7801.8,7765.4,7811.5,7807.2,7805.4,7718.9],"chains":[{"t":"① Ten Sessions, One Arc: the Records, the Ceiling — and Three Repricings","main":1,"steps":["The opening stretch: records — the first close above 7,800 and a Nasdaq record — even as the 10Y pushed toward 24-year highs","Mid-window: the 2002 ceiling re-tested at 24-year highs — each re-test still bought at auction","The repricings: wireless (10/9); the AI complex's global unwind (10/12-13); then the CPI shock (10/14) that put October hike odds at ~37%","The fuel that keeps running: AI compounding and a live deal tape; the tax that keeps charging: a 10Y that touched 24-year highs and ends the window at 5.19% (-10bp)","The month's math: S&P +0.88%, Nasdaq -0.63%, Dow +1.41% — dispersion, not direction"],"d":"Ten sessions in: records early, a ceiling re-tested — then three repricings, the latest a hot CPI. October's engine keeps running; the rate axis keeps charging rent.","news":[{"time":"10/14","fact":"According to CME FedWatch, traders now see a 37% likelihood the Federal Reserve will raise interest rates at its meeting in two weeks, up from 22% before the reading, and a 91% likelihood the central bank will lift rates at least a quarter-percentage point at its December meeting, up from 88% before the data.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/12 close","fact":"Stocks surged Friday, pushing the major indexes to weekly gains, as tech shares rebounded from the previous session's sell-off. The 10-year Treasury yield ended the week around 5.24%, two days after it briefly neared 5.37%, its highest level in more than 24 years.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"}]},{"t":"② The Month's Split: Inflation Beneficiaries Lead — and the AI Complex's Count","steps":["Sector map: Energy (+10.0%), Staples (+6.8%) and Utilities (+5.8%) lead; Tech (-2.7%) sits at the bottom of the pack","Breadth warning: Goldman Sachs flags the narrowest participation since the dotcom bubble, with the median stock nearly 20% off its highs","Loser map: memory, equipment and neocloud names led every down-leg this month","Rate-sensitives mixed: Real Estate (+1.4%) and Health (+3.3%) positive, while the wireless repricing left Comms (-0.1%) flat","The signature: dispersion, not direction — a ~13-point spread between the month's best and worst sectors"],"d":"October's template: own the barrel's beneficiaries and the defensives; the repricings keep re-cutting the AI complex's crowded corners — and now CPI joins the list.","news":[{"time":"10/9 close","fact":"Shares of the country's largest telecommunications giants are slumping amid worries about growing competition from SpaceX.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10092026-12165767"},{"time":"10/13","fact":"Memory makers Micron and SK Hynix saw their stocks fall after Chinese memory maker ChangXin Memory Technologies (CXMT) announced significant progress on a new memory-cell design aimed at increasing storage density; CXMT aims to introduce a new server memory product built on the architecture by the end of 2026.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/14","fact":"The Philadelphia SE Semiconductor Index dropped 4.3%, down for a sixth straight session, its longest losing streak since May 2025.","src":"Reuters","u":"https://www.theglobeandmail.com/investing/markets/inside-the-market/market-news/article-premarket-stocks-steady-as-chipmakers-recover-ahead-of-us-inflation/"}]},{"t":"③ The Barrel, Week Two: Re-Armed Above $100 — Then the Diesel Warning","steps":["The bid stack: the heaviest tanker-attack week of the war, strike-risk headlines and Isaias shut-ins re-armed the war premium above $100","Policy answered twice: the IEA's accelerated release — and the Russia diesel deal (now downplayed by its author)","Week two's new layer: the Houthis hit Aramco's Dhahran headquarters; the IEA warns the diesel squeeze runs into 2027","The numbers: Brent from ~$98 (Dec basis) to $106.06 (+8.2% MTD); WTI +5.2% to $95.09","The band: $100-107, with spikes sold and dips bought all month"],"d":"The barrel's second week: supply shocks met policy supply — and the market bought both sides of the $100-107 band while diesel stayed the tell.","news":[{"time":"10/8","fact":"Approximately 62.9% of daily offshore oil production, or 1.28 million barrels per day, has been shut in as Hurricane Isaias strengthens ahead of an expected landfall.","src":"gCaptain","u":"https://gcaptain.com/hurricane-isaias-shuts-down-nearly-two-thirds-of-gulf-oil-production"},{"time":"10/8","fact":"Last week already saw the biggest number of attacks on tankers in the Strait of Hormuz since the Iran war began — cutting the number of vessels trying to get through to the lowest in more than two months.","src":"Reuters (Al-Monitor)","u":"https://www.al-monitor.com/originals/2026/10/attack-risks-rise-tankers-iran-vows-block-more-hormuz-routes"},{"time":"10/14","fact":"Oil prices rose on Wednesday after the Houthis attacked Saudi Aramco's headquarters and Iran said it was deploying new tactics to target ships and keep oil prices high. Brent crude futures settled up 37 cents, or 0.35%, at $106.06 a barrel. US West Texas Intermediate crude gained 95 cents, or 1.01%, to $95.09, a three-week high.","src":"Reuters","u":"https://www.globalbankingandfinance.com/oil-prices-climb-traders-weigh-saudi-supply-risk-russian/"},{"time":"10/14","fact":"'Constraints on the diesel market will extend well into next year,' the International Energy Agency warned on Wednesday. 'Even with a rapid recovery expected in refinery throughputs into year-end, gasoil supply falls short of meeting demand in 4Q26.'","src":"CNBC","u":"https://www.cnbc.com/2026/10/14/diesel-deal-oil-price-iea-report.html"}]}]},"qtd":{"h":"Q4's First Ten Sessions: +0.88% — Records, a Ceiling, and the CPI Reckoning","d":"9/30 7,651.5 to 10/14 7,718.94 (+0.88% QTD): the quarter's opening stretch delivered two record closes, a 10Y round trip from 5.29% to 24-year highs and back, and the AI complex's repricing — now refereed by CPI.","badges":["S&P QTD +0.88%","Nasdaq -0.63%","10Y -10bp","Brent +8.2%"],"c1":"Q4 is ten sessions old and the template is set — with a new referee: the S&P +0.88% QTD at 7,718.94 (its first close above 7,800 came in week one), the Nasdaq -0.63%, the Dow +1.41%. The quarter's themes: a live deal tape, AI compounding — one revenue scare, answered — a long end that did both (fresh 24-year highs, then a pullback), and now a hot September CPI that lifted October hike odds to ~37% and December to ~91%. Dispersion is the character: Energy (+10.0%), Staples (+6.8%) and Utilities (+5.8%) lead while Tech (-2.7%) has slid to the bottom; Brent +8.2% (December basis); gold -1.9%; the dollar +1.1%. Gates ahead: PPI and retail sales (10/15), the Oct 27-28 meeting, earnings season.","c4":"<ul class='play'><li>Q4's opening trade: 'no October hike' is no longer nearly free to hold — December (~91%) and earnings proof are where the money is.</li><li>The dispersion signature: the barrel's beneficiaries and defensives get paid; the AI complex's crowded corners get taxed.</li><li>Duration: the 10Y still caps multiples — and Wednesday showed the CPI channel back on; a quiet bond market remains the bull case's first draft.</li></ul>","kpi":[["S&P QTD","+0.88%","ten sessions",1],["Nasdaq","-0.63%","repriced",0],["10Y QTD","-10bp","ceiling held",1],["WTI","+5.2%","fear trade",1]],"tbl":[["S&P","7,651.54","7,718.94","+0.88%"],["Dow","50,906.05","51,621.48","+1.41%"],["Nasdaq","26,861.06","26,692.87","-0.63%"],["10Y","5.29%","5.19%","-10bp"],["Gold","$4,186.7","$4,108.6","-1.9%"],["BTC","$83.6k","$81.7k","-2.2%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14"],"data":[7651.5,7666.5,7722.7,7774,7818.9,7801.8,7765.4,7811.5,7807.2,7805.4,7718.9],"chains":[{"t":"① The Q4 Handoff, Ten Sessions In","main":1,"steps":["The window: 9/30's 7,651.5 to 7,718.94 — two record closes inside, the first above 7,800","The ceiling: re-tests at 24-year highs, each one bought at auction — 5.2-5.35% is the band","The anchor: a live deal tape and AI compounding; one revenue scare, answered within a session","Week two's wrinkles: the repricings — wireless, the AI complex (10/12-13), and the CPI shock (10/14)","The taxes held: the 10Y ends the window at 5.19% (-10bp) after touching 5.33%"],"d":"Q4's first ten sessions: records, a ceiling re-tested, one answered scare — then three repricings, the last one CPI.","news":[{"time":"10/12 close","fact":"Stocks surged Friday, pushing the major indexes to weekly gains, as tech shares rebounded from the previous session's sell-off. The 10-year Treasury yield ended the w <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
