<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}

/* ── currencies ───────────────────────────── */
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fxt{background:var(--paper);border:1px solid var(--line);padding:12px 14px 10px;min-width:0}
.fxt .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fxt .nm{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.fxt .dl{font-family:"Playfair Display",Georgia,serif;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.fxt .dl i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}
.fxt .lv{font-size:15px;font-variant-numeric:tabular-nums;margin-top:4px}
.fxt .lv small{color:var(--faint);font-size:11.5px;margin-left:6px}
.fxt svg{display:block;width:100%;height:56px;margin:8px 0 4px;cursor:crosshair;touch-action:none}
.fxt .rg{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;min-height:1.3em}
.fx-note{font-size:12.5px;color:var(--faint);margin-top:12px;line-height:1.7}
.fx-tbl{margin-top:8px;font-size:13px}
.fx-tbl summary{cursor:pointer;color:var(--mut);letter-spacing:.06em}
.fx-tbl table{border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums;width:100%;max-width:640px}
.fx-tbl th,.fx-tbl td{border-bottom:1px solid var(--hair);padding:4px 8px;text-align:right}
.fx-tbl th:first-child,.fx-tbl td:first-child{text-align:left}
</style>
</head>

 and the long end still rallied. The average stock is 4.9 points ahead of the index (RSP +5.78% against SPY +0.88%), and the VIX is 5.26% higher at 17.20. One session remains: 10/30 brings the BOJ decision and results from Exxon, Chevron and AbbVie, with the 11/3 midterms the next macro gate.","c4":"<ul class='play'><li>October round-tripped and then some: a record on 10/6, a 2.5% drawdown to 10/23 and a repair to +0.90% — with the average stock 4.9 points ahead of the index (RSP +5.78% vs SPY +0.88%).</li><li>The leadership is a rotation, not a de-risking: Energy +11.72% against Comms -8.80% is a 20.52-point spread, and the Dow is 5.3 points ahead of the Nasdaq.</li><li>The rate gave the month back even with Brent up: 10Y -31bp and 30Y -32bp — October bought duration while Brent rose 17.19%.</li><li>What decides the last session: 10/30's BOJ and Big Oil earnings, then the 11/3 midterms, with the index 1.26% below its high and 0.90% of cushion.</li></ul>","kpi":[["S&P MTD","+0.90%","twenty-one sessions",0],["Nasdaq","-2.52%","repriced",0],["10Y MTD","-31bp","4.98%",1],["Brent MTD","+17.19%","war premium",1]],"tbl":[["S&P","7,651.54","7,720.39","+0.90%"],["Dow","50,906.05","52,342.56","+2.82%"],["Nasdaq","26,861.06","26,184.72","-2.52%"],["10Y","5.29%","4.98%","-31bp"],["WTI","$88.42","$102.00","+15.36%"],["VIX","16.34","17.20","+5.26%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19","10/20","10/21","10/22","10/23","10/26","10/27","10/28","10/29"],"data":[7651.54,7666.45,7722.72,7773.95,7818.93,7801.77,7765.36,7811.54,7807.24,7805.45,7718.94,7744.06,7659.44,7690.73,7712.57,7757.17,7663.43,7623.68,7676.77,7722.6,7743.98,7720.39013671875],"chains":[{"t":"① October's Round Trip: a Record, a 2.5% Drawdown and a 0.90% Month","main":1,"steps":["Peak on 10/6 at 7,818.93: October's only record close, and its first close above 7,800","Then 10/23: 7,623.68, the month's low close, 2.50% under that peak","The re nd the telecoms","The spread widened to 20.52 points from 18.4 a session ago, as Energy gained and Comms lost","The AI de-rating is still the month's biggest single move: SOXX -9.63% MTD while software (IGV) is +1.40% — the damage is in the hardware, not in the applications","The defensives held: Utilities +9.38% and Staples +9.40% are more than eight points ahead of the index","The volatility tell: the VIX sits 5.26% higher at 17.20 with one session left, its bid intact even after the repair"],"d":"October redistributed rather than de-risked: Energy +11.72% against Comms -8.80% is a 20.52-point spread, and the Dow's +2.82% beat the Nasdaq's -2.52% by 5.3 points.","news":[{"time":"10/16","fact":"Slightly more than half of the stocks in the S&P 500 fell, but all but seven of the 75 stocks in the index's tech sector closed lower.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"},{"time":"10/20","fact":"The S&P 500 value index rose 0.9% compared with a 0.2% drop in its growth counterpart, and the small-cap Russell 2000 finished up 1.7%.","src":"Reuters","u":"https://freemalaysiatoday.com/category/business/2026/10/21/dow-outperforms-as-wall-street-rises-as-healthcare-stocks-lead-gains"},{"time":"10/29 close","fact":"The energy sector ETF closed 11.72% higher from 9/30 to 10/29, at $68.71 from $61.50.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLE/history"},{"time":"10/29 close","fact":"The staples sector ETF closed 9.40% higher from 9/30 to 10/29.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLP/history"},{"time":"10/29 close","fact":"The utilities sector ETF closed 9.38% higher from 9/30 to 10/29.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLU/history"},{"time":"10/29 close","fact":"The technology sector ETF closed 3.58% lower from 9/30 to 10/29.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLK/history"},{"time":"10/29 close","fact":"The communication services sector ETF closed 8.80% lower from 9/30 to 10/29.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLC/history"}]},{"t":"③ The Barrel's October: $98.03 to $114.88, a 17.19% Month on the December Contract","steps":["The path: Brent's December contract started at $98.03, crossed $100 on 10/1, held a $100-107 corridor to 10/15, closed $109.86 on 10/16, $116.72 on 10/23 and $114.88 at the last close","The premium: Houthi strikes on Saudi airports and Aramco sites, then reports that the US could strike Iran after the 11/3 midterms, carried the contract to a $117.45 session high on 10/23 — the highest in nearly six months and $2.57 above the latest settle","The physical data: EIA crude stocks fell 3.06 million barrels in the week to 10/16 and 1.9 million in the week to 10/23, and Hormuz flows averaged 11.7 million barrels a day in October","The scoreboard: Brent +17.19% and WTI +15.36% for the month, both on the December contract, with WTI's gain measured from the $88.42 settlement on 9/30","The rate offset: the 10Y is 31bp lower at 4.98% with Brent up 17.19% — the month treated oil as a growth tax, not an inflation spiral"],"d":"October's barrel: a $98 start, a $117.45 high and a 17.19% month that the bond market treated as a growth tax, not as an inflation spiral.","news":[{"time":"10/21","fact":"US crude stocks fell by 3.06 million barrels to 412.5 million barrels in the week ended 10/16, compared with analysts' expectations for an 820,000-barrel draw.","src":"Reuters","u":"https://au.investing.com/news/commodities-news/oil-rises-on-middle-east-supply-worries-4702921"},{"time":"10/23","fact":"Brent's session high of $117.45 was the highest in nearly six months, and the December contract settled at $116.72.","src":"Reuters (Nikkei Asia)","u":"https://asia.nikkei.com/business/markets/commodities/brent-crude-jumps-to-highest-since-april-on-houthi-attacks-uae-oil-spill"},{"time":"10/23 settle","fact":"Brent crude futures settled at $116.72 a barrel, up 3.14%, their highest since April 29; WTI closed at $103.27, up 3.8%.","src":"Reuters","u":"https://www.globalbankingandfinance.com/oil-little-changed-supply-concern-lingers-amid-houthi/"},{"time":"10/28","fact":"The EIA said energy firms pulled 1.9 million barrels of crude from storage in the week ended October 23, versus a 15,000-barrel build expected in a Reuters poll.","src":"Reuters","u":"https://live.euronext.com/en/financial-news/oil-prices-rise-about-2-yemen-fighting-stokes-supply-fears"},{"time":"10/27","fact":"Oil flows through the Strait of Hormuz averaged 11.7 million barrels a day in October, up from 9.75 million in September but still about 18% below pre-war levels, according to Kpler data.","src":"Benzinga","u":"https://www.benzinga.com/markets/equities/26/10/62634697/refiner-stocks-valero-marathon-worst-day-since-april-2025-iran-russian-diesel"},{"time":"10/29 settle","fact":"Brent's December contract settled at $114.88, leaving it up 17.19% for October from $98.03, with WTI at $102.00 after a 0.76% session decline.","src":"Reuters","u":"https://live.euronext.com/en/financial-news/oil-prices-settles-lower-diplomacy-hopes-offset-some-mideast-supply-concerns"}]}]},"qtd":{"h":"Q4's First Twenty-One Sessions: +0.90%, Three Prints Banked, Two Verdicts Owed","d":"From 9/30's 7,651.54 to 7,720.39 (+0.90%): a record close, a 5.36% yield print and a hawkish hold are banked; the midterms and December are not.","badges":["S&P QTD +0.90%","Dow +2.82%","Nasdaq -2.52%","10Y -31bp","Brent +17.19%"],"c1":"Q4 is twenty-one sessions old and 68.85 points higher: the S&P sits at 7,720.39, +0.90% on the quarter against +2.0% in Q3, with the Dow +2.82% and the Nasdaq -2.52%. Three things are now banked: the quarter's only record close at 7,818.93 on 10/6, an intraday 5.36% on the 10Y on 10/7 — the highest since 2002 — and the Fed's 10-2 hold on 10/28, which left the target range at 3.75%-4.00%. The composition is a rotation, not a rally: Energy +11.72% against Tech -3.58% and Comms -8.80%. The 10Y is 31bp lower and the 30Y 32bp lower; Brent is +17.19% and WTI +15.36% on the December contract. Still owed: the 11/3 midterms and a December FOMC where a 25bp hike is about 80% priced — two verdicts, neither banked, which is why the quarter's entire gain is smaller than one bad session in the AI complex.","c4":"<ul class='play'><li>The quarter has banked three prints, not a direction: +0.90% QTD with the index 1.26% below its 10/6 high and two gates still unplayed.</li><li>The Fed is now a December story: a 10-2 hold with 80% odds of a hike means the quarter's risk sits in the December statement, not in October's.</li><li>The rate cushion is the swing: a 4.98% 10Y is 38bp below the 10/7 intraday peak, and one 6-7bp back-up is enough to take it out of the utilities and the REITs.</li><li>The oil bill is already in the government data: PCE at 3.6% with Brent at $114.88 is the combination that keeps the long end from rallying for the right reason.</li></ul>","kpi":[["S&P QTD","+0.90%","twenty-one sessions",0],["Dow","+2.82%","old economy",1],["10Y QTD","-31bp","4.98%",1],["Brent QTD","+17.19%","war premium",1]],"tbl":[["S&P","7,651.54","7,720.39","+0.90%"],["Dow","50,906.05","52,342.56","+2.82%"],["Nasdaq","26,861.06","26,184.72","-2.52%"],["10Y","5.29%","4.98%","-31bp"],["Brent","$98.03","$114.88","+17.19%"],["30Y","5.64%","5.32%","-32bp"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19","10/20","10/21","10/22","10/23","10/26","10/27","10/28","10/29"],"data":[7651.54,7666.45,7722.72,7773.95,7818.93,7801.77,7765.36,7811.54,7807.24,7805.45,7718.94,7744.06,7659.44,7690.73,7712.57,7757.17,7663.43,7623.68,7676.77,7722.6,7743.98,7720.39013671875],"chains":[{"t":"① The Quarter's Ledger: a Flat Index, Three Banked Prints, Two Open Verdicts","main":1,"steps":["The standing: 7,651.54 on 9/30 to 7,720.39 — +68.85 points, or 0.90%, against a +2.0% third quarter","Banked: the quarter's only record close, 7,818.93 on 10/6 — the index sits 1.26% below it after twenty-one sessions","Banked: an intraday 5.36% on the 10Y on 10/7, a 24-year high, with the highest close 5.31% on 10/5","Banked: the Fed's 10-2 hold at a 3.75%-4.00% target range on 10/28","Owed: two verdicts — a political one and a policy one — neither banked before year-end"],"d":"Q4's first twenty-one sessions produced a flat index and three pieces of history; the verdicts that matter are still ahead.","news":[{"time":"10/6 close","fact":"The S&P 500 and Nasdaq Composite set new intraday and closing records, with the S&P finishing 0.6% higher.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10062026-12160706"},{"time":"10/7","fact":"The 10-year Treasury yield closed at 5.28% on 10/7 — the year's highest close was 5.31% on 10/5 — and the 30-year at 5.67%, its highest close of 2026, per the Treasury's daily yield curve.","src":"US Treasury","u":"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv"},{"time":"10/28","fact":"The Federal Reserve left its key policy rate unchanged on Wednesday, leaving investors betting on a rate hike at its next meeting in December.","src":"Reuters","u":"https://financialnewsletter.com/wall-street-ends-higher-73/"},{"time":"10/29 close","fact":"The S&P 500 is 68.85 points above its 9/30 base of 7,651.54, a gain of 0.90% for the quarter, on the closing series used here.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/%5EGSPC/history"}]},{"t":"② The Quarter's Rate Bill: Duration Bought With the Barrel Up 17%","steps":["The retreat ran across the curve: the 2Y fell 27bp to 4.61% and the 30Y 32bp to 5.32% — the long end gave back more than the front","The cost: more than $5 billion of US and European debt sales were postponed in October — the year's biggest spate","The global mirror: France's 10Y pushed above 5% in October for the first time since 2002, with the OAT-Bund spread near a 15-year high of 160bp","Duration and the barrel moved together all quarter: the 10Y ended 31bp lower even as Brent rose 17.19%, which reads as relief priced as a growth tax rather than as disinflation","The composition of the 31bp: the 10Y fell 33bp from 9/30 to 10/22, then gave 2bp back over the last five closes"],"d":"The quarter's rate bill: relief across the curve while the barrel rose — priced as a growth tax rather than disinflation, with 2bp of the 33bp decline already handed back since 10/22, leaving 31bp.","news":[{"time":"10/29 close","fact":"Against the 9/30 curve, the 10-year Treasury yield closed at 4.98% from 5.29%, the 2-year at 4.61% from 4.88% and the 30-year at 5.32% from 5.64%, per the Treasury's daily yield curve.","src":"US Treasury","u":"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv"},{"time":"10/21","fact":"Companies have postponed more than $5 billion in US and European debt sales this month across at least seven companies, the biggest spate of postponements this year.","src":"Bloomberg","u":"https://www.bloomberg.com/news/articles/2026-10-21/surging-yields-bring-biggest-spate-of-debt-sale-delays-this-year"},{"time":"10/21","fact":"France's 10-year bond yield hit a new 24-year high above 5%, and the premium on French yields over German Bunds edged back toward a 15-year high of nearly 160 bps.","src":"Reuters","u":"https://live.euronext.com/en/financial-news/stocks-rise-upbeat-earnings-frances-10-year-bond-yield-hits-5-mark"}]},{"t":"③ The Quarter's Calendar: Two Verdicts Before Year-End","steps":["10/30: the BOJ decision and results from Exxon, Chevron and AbbVie close out the month's calendar","11/3: the midterms, the quarter's last scheduled political risk","December: the FOMC where a quarter-point hike is about 80% priced","The earnings ledger behind the quarter: about 40% of the S&P 500 has reported, with 83.5% beating and blended growth at 31.8% (LSEG)"],"d":"Q4's verdicts now run in a line: the midterms, then December, decide whether the quarter's +0.90% is a base or a peak.","news":[{"time":"10/29","fact":"The Bank of Japan decides policy on 10/30, with results also due from ExxonMobil, AbbVie, Chevron, BP, Sanofi and General Dynamics.","src":"Charles Schwab","u":"https://www.schwab.com/learn/story/stock-market-update-open"},{"time":"10/28","fact":"With about 40% of S&P 500 companies having reported third-quarter earnings, the aggregate growth rate is 31.8% and 83.5% of companies have beaten expectations, according to LSEG data.","src":"MarketWatch","u":"https://www.marketwatch.com/livecoverage/stock-market-today-s-p-500-nasdaq-fed-decision-interest-rates-big-tech-alphabet-microsoft/card/earnings-have-been-beating-high-expectations-even-before-deluge-of-big-tech-reports-9nH5rDYMAOTsF8OkfvAS"}]}]},"ytd":{"h":"The Bull at +12.78%: AI Capex Carries, an 80bp Rate Bill, a 67.7-Point Sector Spread","d":"S&P +12.78%, Nasdaq +12.66%, Dow +8.90% — AI capex and 31.8% earnings growth carry; a 10Y up 80bp, a $114.88 barrel and a 7.1% gold drawdown tax the rest.","badges":["S&P +12.78%","Nasdaq +12.66%","Dow +8.90%","10Y 4.98%"],"c1":"The year's base case still holds: AI capex and earnings carry the S&P to +12.78% (7,720.39) and the Nasdaq to +12.66%, with the Dow +8.90%; the bull turned four on 10/12. Against it: a 10Y at 4.98% (+80bp YTD), Brent +88.79% and WTI +77.64% since 12/31 as the war grinds into a ninth month, and September PCE at 3.6% with core at 3.1%. Beneath the index: Energy +53.68% leads the year, Tech +31.10%, Health +18.89% and Materials +15.83%; Comms -14.02% and ConsDisc -2.69% lag, while Utilities are +1.05%. Gold -7.1%, bitcoin -8.2%, the dollar +3.65%. The S&P is 1.26% below its record; the Nasdaq is 5.13% below its 10/6 record close. The earnings base is still widening — 83.5% of companies reported have beaten, with Q3 growth tracking 31.8% — which is why an 80bp rate bill has not broken the multiple.","c4":"<ul class='play'><li>The year's engine is intact: AI capex and 31.8% earnings growth have carried the S&P +12.78% through an 80bp rise in the 10Y — earnings are doing the work rates used to do.</li><li>The dispersion is the year's signature: Energy +53.68% against Comms -14.02% is a 67.7-point spread — the index's +12.78% is an average of two very different markets.</li><li>The year's last macro gate is December: a hold on 10/28 is banked and a quarter-point hike is about 80% priced — that is where the bull's 2027 setup gets set.</li><li>The barrel is the year's biggest swing factor: Brent +88.79% has put a 3.6% PCE print into the autumn, which is why 4.98% on the 10Y looks more like a resting point than a peak.</li></ul>","kpi":[["S&P YTD","+12.78%","bull",1],["Nasdaq","+12.66%","leading",1],["Dow","+8.90%","lagging",1],["10Y","+80bp","2026's tax",0]],"tbl":[["S&P","6,845.5","7,720.39","+12.78%"],["Dow","48,063","52,342.56","+8.90%"],["Nasdaq","23,242","26,184.72","+12.66%"],["10Y","4.18%","4.98%","+80bp"],["30Y","4.84%","5.32%","+48bp"],["Gold","$4,341","$4,031.40","-7.1%"]],"labels":["12/31","3/31","6/30","8/13","9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19","10/20","10/21","10/22","10/23","10/26","10/27","10/28","10/29"],"data":[6845.5,6528,7499,7799,7651.54,7666.45,7722.72,7773.95,7818.93,7801.77,7765.36,7811.54,7807.24,7805.45,7718.94,7744.06,7659.44,7690.73,7712.57,7757.17,7663.43,7623.68,7676.77,7722.6,7743.98,7720.39013671875],"chains":[{"t":"① Two Engines, One Referee","main":1,"steps":["The engines: AI capex across the hyperscalers and earnings, with Q3 growth now tracking 31.8% year on year","The scoreboard: S&P +12.78%, Nasdaq +12.66%, Dow +8.90% — the AI-heavy index leads the blue chips by 3.8 points","The referee: the 1 <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

// FX：按档切片同一条日线序列。today = 最近 11 根（约两周，涨跌 = 日环比）；mtd/qtd/ytd = 基期 bar 起到当日
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
function fxWindow(p, period, bases) {
  const s = p.series;
  if (period === "today") { const w = s.slice(-11); return { w, ref: w[w.length - 2], label: "1D", refLbl: "prior close", rangeLbl: `${md(w[0][0])}–${md(w[w.length - 1][0])}` }; }
  const b = bases[period];
  let i = 0; s.forEach(([d], k) => { if (d <= b) i = k; });
  const w = s.slice(i);
  return { w, ref: w[0], label: period.toUpperCase(), refLbl: "period start", rangeLbl: `since ${md(w[0][0])}` };
}
function renderFX(period) {
  const card = document.getElementById("fxCard"), FX = SNAP.FX;
  if (!FX || !FX.pairs || !FX.pairs.length) { card.style.display = "none"; return; }
  card.style.display = "";
  const W = 200, H = 56, pad = 4, rows = [];
  document.getElementById("fx").innerHTML = FX.pairs.map((p, n) => {
    const { w, ref, label, rangeLbl } = fxWindow(p, period, FX.bases);
    const last = w[w.length - 1][1], chg = (last / ref[1] - 1) * 100;
    const vals = w.map(x => x[1]), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const X = k => pad + k * (W - 2 * pad) / Math.max(w.length - 1, 1), Y = v => H - pad - (v - lo) / span * (H - 2 * pad);
    const col = chg >= 0 ? "var(--up)" : "var(--down)", sign = chg >= 0 ? "+" : "";
    const pts = w.map((x, k) => `${X(k).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(" ");
    const f = v => v.toFixed(p.dp);
    rows.push(`<tr><td>${p.name}</td><td>${md(ref[0])} ${f(ref[1])}</td><td>${md(w[w.length - 1][0])} ${f(last)}</td><td>${sign}${chg.toFixed(2)}%</td><td>${f(lo)}</td><td>${f(hi)}</td></tr>`);
    const rangeTxt = `${rangeLbl} · range ${f(lo)}–${f(hi)}`;
    return `<div class="fxt" data-n="${n}"><div class="top"><span class="nm">${p.name}</span><span class="dl" style="color:${col}"><i>${chg >= 0 ? "▲" : "▼"}</i>${sign}${chg.toFixed(2)}%</span></div>
<div class="lv">${f(last)}${p.inv ? `<small>${p.inv} ${(1 / last).toFixed(p.dp)}</small>` : ""}<small>${label}</small></div>
<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${p.name} ${rangeLbl}: ${f(ref[1])} to ${f(last)} (${sign}${chg.toFixed(2)}%)">
<line x1="${pad}" x2="${W - pad}" y1="${Y(ref[1]).toFixed(1)}" y2="${Y(ref[1]).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<line class="xh" y1="0" y2="${H}" stroke="var(--mut)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
</svg><div class="rg" data-def="${rangeTxt}">${rangeTxt}</div></div>`;
  }).join("");
  document.getElementById("fxTbl").innerHTML = `<table><thead><tr><th>Pair</th><th>Start</th><th>End</th><th>Change</th><th>Low</th><th>High</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
  document.getElementById("fxNote").innerText = `Read as base/quote: USD/CAD +0.50% = the US dollar up 0.50% against the Canadian dollar. Line = daily closes over the window (Today tab: last ~2 weeks); dashed line = reference (Today: prior close; MTD/QTD/YTD: period start). ${FX.src}.`;
  // 悬停：十字线 + 在卡片底行显示日期与数值（不用浮层，手机上也不遮挡）
  document.querySelectorAll(".fxt").forEach(t => {
    const p = FX.pairs[+t.dataset.n], { w } = fxWindow(p, period, FX.bases), svg = t.querySelector("svg"), xh = t.querySelector(".xh"), rg = t.querySelector(".rg");
    const move = e => {
      const r = svg.getBoundingClientRect(), x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
      const k = Math.max(0, Math.min(w.length - 1, Math.round((x - pad) / (W - 2 * pad) * (w.length - 1))));
      const px = pad + k * (W - 2 * pad) / Math.max(w.length - 1, 1);
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
      rg.textContent = `${md(w[k][0])} · ${w[k][1].toFixed(p.dp)}`;
    };
    const out = () => { xh.style.display = "none"; rg.textContent = rg.dataset.def; };
    svg.addEventListener("mousemove", move); svg.addEventListener("touchmove", move, { passive: true });
    svg.addEventListener("mouseleave", out); svg.addEventListener("touchend", out);
  });
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  renderFX(period);
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
</body>
</html>
