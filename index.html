<html lang="en">
<head>

<title>Bay Street Updates by Podor</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}
</style>
</head>

<script type="application/json" id="embedded-snap">{"date":"2026-10-16","updatedAt":"2026-10-16T22:30:00Z","P":{"today":{"h":"The AI Funding Bill: an Eighth Straight Chip Slide, a $110 Barrel — and Six Sectors Held Green","d":"","badges":["S&P 7,659 -1.09%","Nasdaq 26,140 -2.14%","Dow -0.34%","10Y 5.10% +1bp","Brent $109.86"],"c1":"The funding question: chips fell for an eighth straight session — the longest slide since 2008 — and the Nasdaq tumbled 2.14% to 26,140.03, its first weekly loss in five weeks and its worst week since June (-4.5%). The S&P 500 fell 1.09% to 7,659.44; the Dow only 0.34% to 52,002.41. The trigger: CoreWeave sank 12% (its bond yields above 15%, levels that typically signal distress) and Reuters reported some Anthropic IPO investors weighing a lower valuation. The split: six of 11 sectors closed green — energy +2.5% best, utilities +1.3%, staples +1.1% — as Brent settled $109.86 (+3.7%, its first $110 touch since May) and WTI $101.41 (+3.5%, highest since Sept 17); the VIX jumped 21% to 19.99. The cushion: Warsh offered no signal at the IMF in Bangkok — October hike odds fell to ~17% (from 28%) — the dollar slipped 0.2%, and Europe closed higher (Stoxx 600 +0.72%, its strongest week since late June). The anomalies: Tesla -2.1% as its Roadster pop faded; Apple +0.5%, the only Magnificent Seven name green; Strategy -10% after MSCI moved to exclude digital-asset treasuries. Next: earnings season, and the Fed's Oct 27-28 meeting.","c4":"<ul class='play'><li>The financing file is the swing factor: CoreWeave's bond yields above 15% and Anthropic's IPO repricing are the market's newest price signals — watch them before the tape.</li><li>The rotation is the cushion: six sectors green, the Dow down only 0.34%, energy leading on the barrel — if breadth keeps absorbing the AI complex's cuts, the scare stays contained.</li><li>Next week's gates: earnings season, housing and claims data, then the Fed's Oct 27-28 meeting — October odds at ~17% say no shock is expected; December (~89%) is where the risk sits.</li></ul>","kpi":[["S&P","7,659.44","-1.09%",0],["Nasdaq","26,140.03","-2.14%",0],["10Y","5.10%","+1bp",1],["Brent","$109.86","+3.7%",1]],"tbl":[["S&P","7,744.06","7,659.44","-1.09%"],["Dow","52,177.69","52,002.41","-0.34%"],["Nasdaq","26,713.03","26,140.03","-2.14%"],["10Y","5.09%","5.10%","+1bp"],["WTI","$97.97","$101.41","+3.5%"],["Gold","$4,169.7","$4,180.9","+0.3%"]],"labels":["10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16"],"data":[7774,7818.9,7801.8,7765.4,7811.5,7807.2,7805.4,7718.9,7744.1,7659.4],"chains":[{"t":"① The AI Complex's Third Leg: an Eighth Straight Chip Slide","main":1,"steps":["The rollover: after Wednesday's CPI shock and Thursday's bounce, the AI complex sold off again — CoreWeave -12%, its bonds above 15% (distress territory), and chipmakers fell for an eighth straight session, the longest slide since 2008","The bill: the damage was financing-shaped — hyperscalers veering toward $1 trillion of annual capex, much of it debt-funded (Bloomberg Intelligence); some Anthropic IPO investors weighing a lower valuation after a financial disclosure (Reuters)","The mechanics: semis led — SOXX -4% (8% this week through Thursday), the memory ETF DRAM -5.5%; Micron -5.6%, AMD -6%, Broadcom -4.5%, Intel -5.8%; neocloud peers Nebius and IREN slid over 3% early","The scoreboard: Nasdaq -2.14% to 26,140.03 — its worst week since June; S&P -1.09% to 7,659.44; VIX +21% to 19.99 — and all but seven of the tech sector's 75 stocks closed lower","The counter-voices: Cathie Wood's ARK added CoreWeave and Cerebras into the decline ('investing in the AI computing supplier will pay off'); the debate is now about financing, not demand"],"d":"The main chain: this week's AI-complex selling was financing-shaped — distress-level bond yields, a trillion-dollar capex bill and an IPO repricing — and it capped the Nasdaq's worst week since June while the rest of the market held.","news":[{"time":"10/16","fact":"Another burst of selling in technology shares drove the Nasdaq 100 to its worst week since the April 2025 tariff turmoil as investors questioned the outlook for the artificial-intelligence trade. Chipmakers fell for an eighth straight day, the longest slide since 2008. CoreWeave Inc., a cloud-computing services provider whose bonds recently hit levels that typically signal distress, sank 12%. The S&P 500 lost 1.1%.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-stocks-post-longest-losing-streak-since-2008%3a-markets-wrap/92225060"},{"time":"10/16","fact":"The biggest tech companies, known as hyperscalers, are veering toward $1 trillion of annual capital spending, according to Bloomberg Intelligence. Much of that is debt funded. While tech giants mostly have high-grade credit ratings, fund managers are asking more questions about junk-rated borrowers like CoreWeave.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-stocks-post-longest-losing-streak-since-2008%3a-markets-wrap/92225060"},{"time":"10/16","fact":"CoreWeave shares finished down 12%, a second big drop in three days. They had fallen more than 15% earlier in the week on concerns about the Nvidia-backed firm's debt before rising 6% yesterday. The Roundhill Magnificent Seven ETF (MAGS) declined 2%, with Meta Platforms down nearly 4%. Nvidia, the world's most valuable public company, was 1.5% lower. Apple, which finished up about 0.5%, was the only member of the septet in the green.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10162026-12176848"},{"time":"10/16","fact":"CoreWeave's bonds sold off sharply this week, pushing yields to above 15%. Reuters reported, citing people familiar with the matter, that some current Anthropic investors and prospective investors in its upcoming IPO are weighing a lower valuation, amid broader concerns over ballooning AI financing costs.","src":"Reuters","u":"https://www.forth.news/articles/Cg5y8SQJUHpyeC1foC2mW"},{"time":"10/16","fact":"Micron Technology fell 5.6%, Advanced Micro Devices dropped 6%, Broadcom lost 4.5% and Intel gave up 5.8%. Investors are now worried that the companies, which have relied on debt markets to finance an investment spree into their technology, may not be able to keep borrowing and spending as heavily with yields in bond markets worldwide recently climbing to their highest levels in years.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"},{"time":"10/16","fact":"Other stocks connected to the AI trade fell after pulling back yesterday. Roundhill's Memory ETF (DRAM), which had already logged a double-digit retreat over the week's first four sessions, sank 5.5% further, pulled lower by components Western Digital, Sandisk, Micron Technology and Seagate Technology. The broader iShares Semiconductor ETF (SOXX) was 4% lower after having fallen 8% this week through Thursday.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10162026-12176848"},{"time":"10/16","fact":"Concerns over CoreWeave's high borrowing costs are common for young companies raising money when rates are elevated, but investing in the AI computing supplier will pay off, noted Cathie Wood of ARK Investment Management LLC. She compared CoreWeave to Coinbase. ARK Investment added both CoreWeave and Cerebras Systems Inc. during this week's declines, Wood said.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-stocks-post-longest-losing-streak-since-2008%3a-markets-wrap/92225060"}]},{"t":"② The Barrel: Brent's First $110 Since May — the Diesel Deal Meets a War Weekend","steps":["The morning fade: crude slid early as traders weighed how much diesel Russia can actually deliver — then reversed hard as 'escalation fears resurfaced amid rumours of attacks on Saudi energy infrastructure' (Energy Aspects)","The war leg: a ballistic missile toward Yanbu was intercepted; Houthi strikes on Saudi Arabia continued; Ukraine hit Russia's Ryazan refinery after Zelenskiy dropped the energy-site ceasefire; Eurasia Group raised escalation odds to 65% from 35%","The settles: Brent +3.7% to $109.86 — a first $110 touch since May, highest since May 19; WTI +3.5% to $101.41, highest since Sept 17; the week: Brent +4.9%, WTI +10.4%","The squeeze: diesel settled $4.90 a gallon in New York — highest-ever seasonally, with European diesel futures up more than twofold this year; the US offered up to 17 million barrels from the SPR; the IEA agreed to release more than 20 million barrels of fuel","The counter-move: House lawmakers introduced the Prohibit Corrupt Russia Oil Deals Act to block the diesel deal; the equity echo — energy +2.5%, best sector, Exxon +2.5%, Chevron +2.6%"],"d":"The barrel: a deal meant to flood the market with Russian diesel met a war that keeps taking supply off it — Brent's first $110 since May, the week's best sector, and a product squeeze at record seasonal prices.","news":[{"time":"10/16","fact":"Brent touched $110 a barrel for the first time since May on worries that escalating tensions in the Middle East could further tighten supplies, while investors assessed how much diesel Russia could supply to the global market. Brent crude futures settled $3.94, or 3.7%, higher at $109.86, the highest since May 19, while US West Texas Intermediate crude futures closed $3.44, or 3.5%, higher at $101.41, the highest since September 17. So far this week, Brent has risen 4.9% and WTI 10.4%.","src":"Reuters (Yahoo Finance)","u":"https://finance.yahoo.com/energy/articles/oil-edges-down-investors-weigh-010642305.html"},{"time":"10/16","fact":"'WTI and Brent reversed earlier losses as escalation fears resurfaced amid rumours of attacks on Saudi energy infrastructure,' research and consultancy Energy Aspects said in a note. A Saudi-led coalition said it intercepted and destroyed a ballistic missile launched towards the Red Sea city of Yanbu. Ukraine struck a Russian oil refinery after President Volodymyr Zelenskiy declared that Kyiv was abandoning a ceasefire covering energy sites; Russia's Ryazan oil refinery has suspended operations at a primary crude distillation unit following a drone attack.","src":"Reuters (Yahoo Finance)","u":"https://finance.yahoo.com/energy/articles/oil-edges-down-investors-weigh-010642305.html"},{"time":"10/16","fact":"Brent oil hit $110/bbl for the first time since May as prospects for imminent supply relief dwindle, prompting traders to ramp up bets on higher prices ahead of the weekend. Diesel settled at $4.90 a gallon in New York. Contracts for both commodities are trading at the highest-ever levels seasonally. U.S. lawmakers introduced a bill Friday to block Trump's deal with Moscow to release several hundred million barrels of diesel.","src":"Bloomberg (World Oil)","u":"https://worldoil.com/news/2026/10/16/oil-hits-110-as-houthi-strikes-russia-ukraine-attacks-lift-supply-fears/"},{"time":"10/16","fact":"'The conflict is likely to escalate,' Eurasia Group analysts wrote in a note, raising their odds of intensification to 65% from 35%. On Friday, the U.S. offered up to 17 million barrels from the Strategic Petroleum Reserve, the Department of Energy said.","src":"Bloomberg (World Oil)","u":"https://worldoil.com/news/2026/10/16/oil-hits-110-as-houthi-strikes-russia-ukraine-attacks-lift-supply-fears/"},{"time":"10/16","fact":"A group of House Democrats and one Republican representative introduced a bill to block President Trump's deal to purchase and import Russian diesel, according to a statement from Rep. Gregory Meeks' office. The bill would prohibit the US International Development Finance Corporation from investing in Russian energy, nullify licenses issued by the Office of Foreign Assets Control and ban future licenses, and mandate sanctions on Russian energy.","src":"Bloomberg Government","u":"https://news.bgov.com/environment-and-energy/lawmakers-introduce-bipartisan-bill-to-block-russia-diesel-deal"},{"time":"10/16","fact":"Brent crude futures settled at $109.86 a barrel, while front-month WTI climbed above $100 for the first time since September. Crude oil prices surged Friday as attacks on commercial vessels around the strait intensified and traders assessed the possibility of further military escalation between Washington and Tehran.","src":"Kitco PM Report","u":"https://www.kitco.com/news/article/2026-10-16/gold-silver-diverge-fed-pause-expectations-collide-rising-crude-prices"},{"time":"10/16","fact":"'After a brief reprieve, the oil market is having to price risk back in, particularly heading into the weekend,' said Rebecca Babin, senior energy trader at CIBC Private Wealth Group. 'Conflict in the Middle East still keeps coming back and I think it's questionable how much diesel fuel Russia can actually deliver to the markets,' said Dennis Kissler of BOK Financial.","src":"Bloomberg (World Oil) / Reuters","u":"https://worldoil.com/news/2026/10/16/oil-hits-110-as-houthi-strikes-russia-ukraine-attacks-lift-supply-fears/"},{"time":"10/16","fact":"Forecasters at Goldman Sachs expect oil prices to fall gradually in 2027 but stay above their February 2026 levels, according to a research note released Friday. High prices for crude oil and, in turn, the gasoline and diesel it's turned into have chewed through household budgets.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10162026-12176848"}]},{"t":"③ The Cushion: Warsh Stood Down, the Dollar Slipped — and Six Sectors Held Green","steps":["The Fed stood down: Warsh offered no fresh signals at the IMF meetings in Bangkok ('It's a new chapter at the Fed, and we're not in that business anymore') — October hike odds fell to ~17% from 28%; December held ~89%","The dollar kept sliding: DXY -0.2% to ~101.8 — euro +0.2% to $1.1239; pound +0.4% to $1.3329; the yen little changed at 157.99","The breadth: six of 11 sectors closed green — energy, utilities, staples, materials, financials, real estate; only slightly more than half of S&P 500 stocks fell; the Dow -0.34% vs the Nasdaq -2.14%","The winners: Alcoa +2.5% and Travelers +1.5% on beats; the market absorbed hot import prices (+1.1% m/m, +8.1% y/y — the largest annual rise since July 2022) and solid industrial production (+0.7%) without re-arming the rate trade","The global close: Europe finished higher — Stoxx 600 +0.72%, its strongest week since late June; DAX +0.95%, CAC +0.28%, FTSE +0.38% — as stronger earnings offset tech-valuation worries"],"d":"The cushion: the Fed's silence, a softer dollar and a broad defensive bid absorbed the tech damage — six sectors held green and the Dow barely moved.","news":[{"time":"10/16","fact":"The Fed is under pressure to rein in inflation following hotter-than-anticipated CPI and PPI readings this week. Chair Kevin Warsh, speaking at an International Monetary Fund meeting in Bangkok, did not signal how the central bank might act on interest rates at its policy meetings later this month or in early December. 'It's a new chapter at the Fed, and we're not in that business anymore,' Warsh said. Traders now see a 17% likelihood the Fed will raise rates at its late-October meeting, down from 28% yesterday, according to CME FedWatch. They see an 89% likelihood of a rate hike at its December meeting, unchanged from yesterday.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10162026-12176848"},{"time":"10/16","fact":"Fed Chair Kevin Warsh said the US economy remained resilient and was benefiting from an AI-driven investment boom. He, however, noted the spending surge was boosting inflation. Markets increasingly expect the Federal Reserve to keep interest rates unchanged this month.","src":"Reuters (Investing.com)","u":"https://www.investing.com/news/economy-news/wall-st-futures-mixed-as-tech-wobbles-again-tesla-gains-4953758"},{"time":"10/16","fact":"The Bloomberg Dollar Spot Index fell 0.2%. The euro rose 0.2% to $1.1239. The British pound rose 0.4% to $1.3329. The Japanese yen was little changed at 157.99 per dollar.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-stocks-post-longest-losing-streak-since-2008%3a-markets-wrap/92225060"},{"time":"10/16","fact":"Slightly more than half of the stocks in the S&P 500 fell, but all but seven of the 75 stocks in the index's tech sector closed lower. Among the biggest decliners were chip companies, reflecting mounting worries about how long the frenzy over the AI buildout will last.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"},{"time":"10/16","fact":"Alcoa rose 2.5% and The Travelers Cos. gained 1.5% after the companies reported quarterly results that topped Wall Street forecasts.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"},{"time":"10/16","fact":"U.S. import prices rose 1.1% in September and 8.1% from a year earlier, the largest annual increase since July 2022. Export prices rose 2.2% on the month. September industrial production increased 0.7%, above expectations, while manufacturing output gained 0.3%.","src":"Kitco PM Report","u":"https://www.kitco.com/news/article/2026-10-16/gold-silver-diverge-fed-pause-expectations-collide-rising-crude-prices"},{"time":"10/16","fact":"European equities closed higher, outperforming Wall Street as stronger corporate earnings helped offset concerns about technology valuations and rising financing costs. The Stoxx Europe 600 gained 0.72% to 644.74, completing its strongest weekly advance since late June. Germany's DAX climbed 0.95% to 25,622.61, France's CAC 40 advanced 0.28% to 7,956.70 and the U.K. FTSE 100 rose 0.38% to 10,881.90.","src":"Kitco PM Report","u":"https://www.kitco.com/news/article/2026-10-16/gold-silver-diverge-fed-pause-expectations-collide-rising-crude-prices"}]},{"t":"④ The Cross-Currents: Tesla's Roadster Pop Fades, Apple Holds — and Crypto's Index Problem","steps":["The Roadster day: Tesla unveiled the SpaceX-thruster Roadster (0-60 in under a second; production 2028) — the stock jumped 4.4% premarket, then faded to -2.1% as the tape rolled over","The merger chatter: Barclays said an all-stock SpaceX-Tesla deal is 'widely viewed as more likely' after the event; SpaceX (SPCX) shares rose 2.1% early","Apple's green print: +0.5% — the only Magnificent Seven name higher — as folding-phone preorders slipped into January within minutes of opening ($1,999; Oct 23 release)","Crypto's index problem: Strategy sank ~10% after MSCI adopted rules to exclude digital-asset treasuries at its November review ('billions of dollars in stock sales' at risk); bitcoin -0.5% to ~$81.6k; ether -1.6%","The rest: Netflix -2.9% as Peter Rice replaced its chief content officer, days after the company said it would cut about 6% of staff (nearly 1,000 roles)"],"d":"The day's cross-currents: a headline pop that faded, the one mega-cap that held, and an index rule that bit the crypto trade — none of it changed the AI verdict.","news":[{"time":"10/16","fact":"Shares in Tesla fell 2.1% after the electric vehicle company unveiled a new model of its Roadster sports car that can thrust itself up in the air.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"},{"time":"10/15","fact":"Tesla unveiled a redesigned Roadster on Thursday evening which used SpaceX rocket technology to jump off a ramp and perform a controlled landing. CEO Elon Musk said production of the long-awaited vehicle was set to begin in 2028. The vehicle was able to jump a ramp at a full inversion before using its air thrusters to correct its orientation and land on all four wheels.","src":"Investing.com","u":"https://www.investing.com/news/economy-news/warsh-avoids-rate-guidance-teslas-roadster-turns-in-air--whats-moving-markets-4953305"},{"time":"10/16","fact":"The possibility of a merger between Tesla and SpaceX has been raised before — by investors, Street analysts, and even Musk himself — but the arrival of the Roadster prototype has revived the conversation. Barclays flagged overlapping products such as Tesla's Optimus robots and robotaxis using SpaceX's AI, plus the Roadster; SpaceX would benefit from Tesla's free cash flow.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10162026-12176848"},{"time":"10/16","fact":"Shipping estimates for Apple Inc.'s first folding phone slipped into January within minutes of the company taking preorders on Friday, suggesting that strong demand and short supply will make the $1,999 device challenging to purchase on its Oct. 23 release date or in the near future.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-stocks-post-longest-losing-streak-since-2008%3a-markets-wrap/92225060"},{"time":"10/16","fact":"Shares of Strategy slipped nearly 10% on Friday, in part because bitcoin prices were down, but also because index provider MSCI announced that it would start implementing a prior proposal to make non-operating companies 'ineligible for inclusion' — publicly traded digital asset treasuries listed on its indexes would be shown the door at its November index review.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10162026-12176848"},{"time":"10/16","fact":"MSCI Inc. adopted new rules that could ultimately push Strategy Inc. out of its global equity benchmarks, potentially triggering billions of dollars in stock sales and adding fresh pressure to the financing model behind Michael Saylor's vast Bitcoin holdings. Bitcoin fell 0.5% to $81,562.09. Ether fell 1.6% to $2,411.54.","src":"Bloomberg (SWI swissinfo)","u":"https://www.swissinfo.ch/eng/chip-stocks-post-longest-losing-streak-since-2008%3a-markets-wrap/92225060"},{"time":"10/16","fact":"Netflix's stock fell 2.9% a day after the company announced that Chief Content Officer Bela Bajaria will be replaced by Peter Rice. The news comes just days after Netflix said that it plans to lay off about 6% of its workforce, amounting to nearly 1,000 positions.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"}]}]},"mtd":{"h":"October, Twelve Sessions In: a Record, Three Repricings — and the Gains Handed Back","d":"S&P 7,651.5 to 7,659.44 (+0.10% MTD): twelve sessions delivered one S&P record close, a 24-year ceiling re-tested — and three repricings (wireless 10/9; the AI complex 10/12-13 and again into month-end; the inflation prints 10/14-15). Six sectors still hold gains; the month nets to a round trip.","badges":["S&P MTD +0.10%","Nasdaq -2.68%","10Y -19bp","Brent +12.1%"],"c1":"Twelve sessions into October and the month nets to a round trip: the S&P is +0.10% MTD at 7,659.44 — its lone record close (7,818.93 on 10/6, its first above 7,800) all but handed back — the Nasdaq -2.68%, the Dow +2.15%. The arc: a 10Y that touched a 24-year high of 5.36% on 10/7 and closed the window at 5.10% (-19bp); three repricings — wireless (10/9), the AI complex (10/12-13, and again into month-end), the inflation prints (10/14-15) — whose October odds round-tripped from 22% before CPI to a 37% peak and back to ~17%; and a barrel that broke out: Brent +12.1% on the December basis, past the $100-107 stretch of the first two weeks. Beneath: Energy (+11.0%), Staples (+8.7%) and Utilities (+7.0%) lead sectors while Tech (-6.3%) sits at the bottom. Gate: the Oct 27-28 meeting.","c4":"<ul class='play'><li>October's verdict so far: the records came early, three repricings followed — and the AI complex keeps paying the month's rent; the month's engine (AI, deals) still runs while the rate axis charges it.</li><li>The dispersion signature holds: the barrel's beneficiaries and defensives lead; the AI complex's crowded corners get taxed — the spread between the month's best and worst sectors is ~17 points.</li><li>The month's referee is still the Fed: October hike odds round-tripped from 22% before CPI to a 37% peak and back to ~17% — the prints fully faded; the Oct 27-28 meeting decides whether the repricing gets another round.</li></ul>","kpi":[["S&P MTD","+0.10%","twelve sessions",1],["Nasdaq","-2.68%","repriced",0],["10Y MTD","-19bp","off 24-yr high",1],["WTI MTD","+12.2%","fear trade",1]],"tbl":[["S&P","7,651.54","7,659.44","+0.10%"],["Dow","50,906.05","52,002.41","+2.15%"],["Nasdaq","26,861.06","26,140.03","-2.68%"],["10Y","5.29%","5.10%","-19bp"],["WTI","$90.42","$101.41","+12.2%"],["VIX","16.34","19.99","+22.3%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16"],"data":[7651.5,7666.5,7722.7,7774,7818.9,7801.8,7765.4,7811.5,7807.2,7805.4,7718.9,7744.1,7659.4],"chains":[{"t":"① Twelve Sessions, One Arc: the Record, the Ceiling — and the Repricings","main":1,"steps":["Where the month opened: two Nasdaq records (10/5-6) and one for the S&P (7,818.93 on 10/6, its first above 7,800) — against a 10Y pushing toward 24-year highs","Mid-month: the ceiling re-tested — a 24-year high of 5.36% printed on 10/7 — and auction buyers met each re-test","The repricings: wireless (10/9); the AI complex (10/12-13); the inflation prints (10/14-15) — hot data that moved October hike odds from 22% before CPI to a 37% peak, then fully back to ~17%","The flows: the third repricing's worst beat met rotation money — bonds bid; the 10Y exits the window at 5.10% (-19bp)","The month's math: S&P +0.10%, Nasdaq -2.68%, Dow +2.15% — dispersion over direction"],"d":"Twelve sessions in: the records came early, the ceiling got re-tested, and three repricings followed — the latest met by buyers in part. October's engine runs on; the rate axis charges the rent.","news":[{"time":"10/16","fact":"Traders now see a 17% likelihood the Fed will raise rates at its late-October meeting, down from 28% yesterday, according to CME FedWatch. They see an 89% likelihood of a rate hike at its December meeting, unchanged from yesterday.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10162026-12176848"},{"time":"10/14","fact":"According to CME FedWatch, traders now see a 37% likelihood the Federal Reserve will raise interest rates at its meeting in two weeks, up from 22% before the reading, and a 91% likelihood the central bank will lift rates at least a quarter-percentage point at its December meeting, up from 88% before the data.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10142026-12173010"},{"time":"10/9 close","fact":"Stocks surged Friday, pushing the major indexes to weekly gains, as tech shares rebounded from the previous session's sell-off. The 10-year Treasury yield ended the week around 5.24%, two days after it briefly neared 5.37%, its highest level in more than 24 years.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10122026-12170121"}]},{"t":"② The Month's Split: the Barrel's Beneficiaries Lead — the AI Complex Pays","steps":["Sector map: Energy (+11.0%), Staples (+8.7%) and Utilities (+7.0%) lead; Tech (-6.3%) sits last","Breadth check: Goldman's dotcom-era warning (10/9) still reads stale — the Dow +2.15% vs the Nasdaq -2.68% MTD, defensives and energy leading","Where the damage landed: memory, equipment and neocloud names led nearly every down-leg of the month","The rotation: ConsDisc +3.3%, Staples +8.7% MTD vs Tech -6.3% — flows left the AI complex without leaving equities","The spread between the month's best and worst sectors: ~17 points — dispersion, not direction"],"d":"October's pattern: the barrel's beneficiaries and defensives collect; each repricing re-cuts the AI complex's crowded corners.","news":[{"time":"10/9 close","fact":"Shares of the country's largest telecommunications giants are slumping amid worries about growing competition from SpaceX.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10092026-12165767"},{"time":"10/13","fact":"Memory makers Micron and SK Hynix saw their stocks fall after Chinese memory maker ChangXin Memory Technologies (CXMT) announced significant progress on a new memory-cell design aimed at increasing storage density; CXMT aims to introduce a new server memory product built on the architecture by the end of 2026.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/14","fact":"The Philadelphia SE Semiconductor Index dropped 4.3%, down for a sixth straight session, its longest losing streak since May 2025.","src":"Reuters","u":"https://www.theglobeandmail.com/investing/markets/inside-the-market/market-news/article-premarket-stocks-steady-as-chipmakers-recover-ahead-of-us-inflation/"}]},{"t":"③ The Barrel, Three Weeks In: $100 Held — Then $110","steps":["The bid stack: attack counts, strike-risk headlines and shut-ins kept re-arming the war premium — crude held above $100 into the month's final stretch","Policy answered twice: the IEA's accelerated release — and the Russia diesel deal, which now faces legislation to block it","FT's count: 24 ships hit in the two weeks to 10/11 — the war's heaviest stretch of attacks","The scoreboard: Brent $109.86 (+12.1% MTD, Dec basis); WTI $101.41 (+12.2%)","The band broke: October settles ran $100.20-$106.65 through mid-month — then the month's escalation carried the premium past $109"],"d":"October's barrel: supply shocks met policy supply — a $100-107 band, bought on both sides, until it broke upward.","news":[{"time":"10/8","fact":"Approximately 62.9% of daily offshore oil production, or 1.28 million barrels per day, has been shut in as Hurricane Isaias strengthens ahead of an expected landfall.","src":"gCaptain","u":"https://gcaptain.com/hurricane-isaias-shuts-down-nearly-two-thirds-of-gulf-oil-production"},{"time":"10/8","fact":"Last week already saw the biggest number of attacks on tankers in the Strait of Hormuz since the Iran war began — cutting the number of vessels trying to get through to the lowest in more than two months.","src":"Reuters (Al-Monitor)","u":"https://www.al-monitor.com/originals/2026/10/attack-risks-rise-tankers-iran-vows-block-more-hormuz-routes"},{"time":"10/14","fact":"Analysis by the Financial Times said 24 ships were hit in the two weeks to 11 October; of the vessels hit, three were refined energy product tankers and two others were crude oil tankers.","src":"The Guardian (FT analysis)","u":"https://theguardian.com/world/2026/oct/14/container-ship-sinks-strait-of-hormuz-surge-iranian-attacks-iran-us-midterm-elections"},{"time":"10/14","fact":"'Constraints on the diesel market will extend well into next year,' the International Energy Agency warned, with gasoil supply falling short of demand in 4Q26.","src":"CNBC","u":"https://www.cnbc.com/2026/10/14/diesel-deal-oil-price-iea-report.html"},{"time":"10/15","fact":"Brent crude settled down 14 cents, or 0.13%, at $105.92 a barrel; US West Texas Intermediate crude futures settled up $2.88, or 3.03%, to $97.97, after a large US crude stock draw helped support prices.","src":"Reuters","u":"https://lufkindailynews.com/news_reuters/business/brent-steady-as-us-weighs-easing-sanctions-on-global-shadow-fleet/article_184090cc-0917-5f7c-b4a7-3837c55ffdaf.html"}]}]},"qtd":{"h":"Q4, Twelve Sessions In: +0.10% — a Record, a Ceiling, and the Reckonings","d":"From 9/30's 7,651.5 to 7,659.44 (+0.10% QTD): the opening ledger — one all-time mark, a 24-year top, three repricings, one breakout; the gates still ahead.","badges":["S&P QTD +0.10%","Nasdaq -2.68%","10Y -19bp","Brent +12.1%"],"c1":"Q4's ledger: +0.10% (7,659.44) for the S&P, -2.6 <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
</body>
</html>
