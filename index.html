<head>

<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}

/* ── currencies ───────────────────────────── */
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fxt{background:var(--paper);border:1px solid var(--line);padding:12px 14px 10px;min-width:0}
.fxt .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fxt .nm{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.fxt .dl{font-family:"Playfair Display",Georgia,serif;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.fxt .dl i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}
.fxt .lv{font-size:15px;font-variant-numeric:tabular-nums;margin-top:4px}
.fxt .lv small{color:var(--faint);font-size:11.5px;margin-left:6px}
.fxt svg{display:block;width:100%;height:56px;margin:8px 0 4px;cursor:crosshair;touch-action:none}
.fxt .rg{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;min-height:1.3em}
.fx-note{font-size:12.5px;color:var(--faint);margin-top:12px;line-height:1.7}
.fx-tbl{margin-top:8px;font-size:13px}
.fx-tbl summary{cursor:pointer;color:var(--mut);letter-spacing:.06em}
.fx-tbl table{border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums;width:100%;max-width:640px}
.fx-tbl th,.fx-tbl td{border-bottom:1px solid var(--hair);padding:4px 8px;text-align:right}
.fx-tbl th:first-child,.fx-tbl td:first-child{text-align:left}
</style>
</head>

ing-will-start-paying-for-itself-201056802.html"},{"time":"10/28","fact":"SK hynix said quarterly revenue passed 100 trillion won for the first time, with operating profit equal to 80% of revenue, and expects demand for memory to outrun supply through 2030.","src":"StockTitan","u":"https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026"},{"time":"10/28 close","fact":"Micron jumped 5.9% after SK Hynix reported a more than sevenfold jump in quarterly profit, and the Philadelphia semiconductor index gained 1.8% for a fourth consecutive advance.","src":"Reuters","u":"https://financialnewsletter.com/wall-street-ends-higher-73/"},{"time":"10/28","fact":"Vertiv's third-quarter sales rose 61%, orders excluding acquisitions more than doubled, and it raised its full-year sales forecast by $650 million; the shares closed 16.6% higher.","src":"StockTitan","u":"https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026"},{"time":"10/28","fact":"GE Vernova said third-quarter orders reached $29.3 billion and it agreed to acquire grid-equipment maker Trench Group for $9.0 billion; its shares closed 1.9% lower.","src":"StockTitan","u":"https://www.stocktitan.net/articles/stock-market-today-live-october-28-2026"},{"time":"10/28","fact":"Micron is about 19% below its record close of $1,213 in June and is still up about 240% this year after a fourth straight session of gains.","src":"CNBC","u":"https://www.cnbc.com/investingclub/2026/10/28/fed-chairman-talks-tough-on-inflation-plus-whats-behind-microns-big-rally.html"}]},{"t":"③ The Barrel Priced the Campaign, Not the Peace: Brent $115.32, WTI $102.78","steps":["Brent's December contract settled $1.44 higher at $115.32 (+1.3%) and WTI $2.88 higher at $102.78 (+2.9%), after Brent had traded at $115.69 at 10:42 a.m. ET","The trigger was a WSJ report that the US told several Gulf Arab countries to be ready for a short, intense military campaign against Iran after the 11/3 midterms","The physical layer: Houthis said they hit Saudi Arabia's 550,000-barrel-a-day Ras Tanura refinery with a ballistic missile, and Fars reported satellite imagery of damage to the main refining unit; Riyadh has not confirmed the strike","US inventories went the wrong way for bears: crude stocks fell 1.9 million barrels against a 15,000-barrel build expected, while production jumped 723,000 barrels a day to 13.99 million","The equity expression was muted: energy closed only +0.35%, with Exxon +1.17%, Chevron +0.43% and Oxy +0.21% — the refiners that fell 7-9% on 10/27 barely bounced","Brent is +17.6% in October from $98.03, and the premium is still a strike option rather than a supply loss: Hormuz flows averaged 11.7 million barrels a day in October, about 18% below pre-war levels"],"d":"Oil did the inflation work for the long end: a report that Gulf allies were told to prepare for strikes after the midterms, plus a missile claim on Ras Tanura, took Brent back over $115 without any confirmed loss of supply.","news":[{"time":"10/28 settle","fact":"Brent crude futures rose 1.3% to close at $115.32 a barrel, while US West Texas Intermediate crude gained 2.9% to settle at $102.78 per barrel.","src":"CNBC","u":"https://www.cnbc.com/2026/10/28/oil-price-today-wti-brent-hormuz.html"},{"time":"10/28","fact":"The US has told several Gulf Arab countries to be ready for a short but intense military campaign after the midterms, people briefed on the conversations told The Wall Street Journal.","src":"CNBC","u":"https://www.cnbc.com/2026/10/28/oil-price-today-wti-brent-hormuz.html"},{"time":"10/28","fact":"Iran-allied Houthi militants said Tuesday they had attacked Saudi Arabia's Ras Tanura refinery with a ballistic missile, raising worries about further disruptions to oil supplies.","src":"CNBC","u":"https://www.cnbc.com/2026/10/28/oil-price-today-wti-brent-hormuz.html"},{"time":"10/28","fact":"The EIA said energy firms pulled 1.9 million barrels of crude from storage in the week ended October 23, versus a 15,000-barrel build expected in a Reuters poll, and crude production jumped 723,000 barrels a day to 13.992 million.","src":"Reuters","u":"https://live.euronext.com/en/financial-news/oil-prices-rise-about-2-yemen-fighting-stokes-supply-fears"},{"time":"10/28","fact":"Brent futures rose $1.81, or 1.6%, to $115.69 a barrel at 10:42 a.m. EDT, a gain that pushed the benchmark back into overbought territory for the fourth time in five days.","src":"Reuters","u":"https://live.euronext.com/en/financial-news/oil-prices-rise-about-2-yemen-fighting-stokes-supply-fears"},{"time":"10/28 close","fact":"The energy sector ETF closed 0.35% higher, with Exxon up 1.17%, Chevron 0.43% and Occidental 0.21%.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLE/history"},{"time":"10/27","fact":"Oil flows through the Strait of Hormuz averaged 11.7 million barrels a day in October, up from 9.75 million in September but still about 18% below pre-war levels, according to Kpler data.","src":"Benzinga","u":"https://www.benzinga.com/markets/equities/26/10/62634697/refiner-stocks-valero-marathon-worst-day-since-april-2025-iran-russian-diesel"}]},{"t":"④ What Held: a Qatari Draft, a Seven-Day Plan and a Press Conference Without a Curveball","steps":["Iran's foreign minister said Tehran is still giving diplomacy a chance and remains in close contact with intermediaries to review ideas that could implement its seven-day plan in less than a week, and Brent came off its intraday high after the remark","Qatar presented a new draft deal to Tehran on Sunday and a response is expected by the end of the week, though a senior Iranian official said Doha had only put forward unacceptable ideas","The press conference threw no curveball: Warsh said the Fed will still hold eight meetings in 2027, one of them without a policy decision, and the main indexes turned positive across the board as he spoke","OPEC+ is expected to keep its December output targets steady at Sunday's meeting, with most of the seven core members already producing below quota — no new barrels are priced","The tape hedged itself: the VIX fell 3.5% to 16.91, back below its 10/23 close of 19.45, and the S&P finished 0.96% below its record with six of 11 sectors higher"],"d":"Three things kept the day from being worse: Tehran's diplomacy line capped the barrel, Warsh's press conference threw no curveball on rates, and OPEC+ is not adding supply — so the VIX fell even with a hawkish hold.","news":[{"time":"10/28","fact":"Iran's foreign minister said Iran continues to give diplomacy a chance to succeed and remains in close, ongoing contact with intermediaries to review ideas that can ensure implementation of its 7-day plan in even less than a week.","src":"Newsquawk","u":"https://www.newsquawk.com/headlines/us-crude-wrap-wti-z6-settles-usd-288-higher-at-usd-10278bbl"},{"time":"10/28","fact":"Qatari mediators presented Iran with a new draft deal on Sunday, with a response expected by the end of the week, while a senior Iranian official said Doha had only put forward unacceptable ideas that did not amount to an offer.","src":"Reuters","u":"https://live.euronext.com/en/financial-news/oil-prices-rise-about-2-yemen-fighting-stokes-supply-fears"},{"time":"10/28","fact":"The main indexes turned positive across the board after Warsh said the Fed will still have eight meetings in 2027, one of which will not include a policy decision or statement.","src":"Kiplinger","u":"https://www.kiplinger.com/investing/stocks/stocks-rise-despite-inflation-and-war-talk-stock-market-today"},{"time":"10/28","fact":"OPEC+ oil producers are expected to keep their December oil output targets steady at an industry meeting on Sunday, according to people with knowledge of the matter, with production in most of the seven core members below target.","src":"Reuters","u":"https://live.euronext.com/en/financial-news/oil-prices-rise-about-2-yemen-fighting-stokes-supply-fears"},{"time":"10/28 close","fact":"The VIX closed at 16.91, down 3.5% from 17.52, while the S&P 500 finished at 7,743.98, 0.96% below its 10/6 record close of 7,818.93.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/%5EVIX/history"},{"time":"10/28","fact":"The Fed didn't throw any curveballs, said Ryan Detrick, chief market strategist at Carson Group, adding that a hold was widely expected.","src":"Reuters","u":"https://financialnewsletter.com/wall-street-ends-higher-73/"}]}]},"mtd":{"h":"Twenty Sessions In: +1.21%, an Energy Month With an 18.4-Point Spread","d":"S&P 7,651.54 to 7,743.98 (+1.21%), 0.96% below the 10/6 record: Energy +11.3% leads and Comms -7.1% lags — an 18.4-point spread — while the Nasdaq is -1.16%.","badges":["S&P MTD +1.21%","Nasdaq -1.16%","Dow +3.08%","10Y -24bp","Brent +17.6%"],"c1":"October is twenty sessions old and +1.21%: the S&P sits at 7,743.98, 92.44 points above the 9/30 base and 0.96% below the month's only record close, 7,818.93 on 10/6. The shape is unchanged — one record, three repricings (wireless on 10/9, the AI complex on 10/12-13, the CPI-PPI pair on 10/14-15), a low close of 7,623.68 on 10/23 and a three-session repair — but the composition is not: Energy +11.3%, Staples +7.7%, Utilities +7.7%, Health +6.7%, Materials +6.5% and ConsDisc +6.0% lead, while Tech -2.4% and Comms -7.1% are the only sectors down, so nine of 11 are positive. The Dow is +3.08% and the Nasdaq -1.16%. The 10Y is 24bp lower at 5.05% and the 30Y 27bp lower at 5.37%, a month in which the barrel rose 13.7% and the long end still rallied. The average stock is 3.3 points ahead of the index (RSP +4.52% against SPY +1.27%), and the VIX is 3.5% higher at 16.91. The month's last gate is 10/29's PCE.","c4":"<ul class='play'><li>October round-tripped and then some: a record on 10/6, a 2.5% drawdown to 10/23 and a three-session repair to +1.21% — with the average stock 3.3 points ahead of the index (RSP +4.52% vs SPY +1.27%).</li><li>The leadership is a rotation, not a de-risking: Energy +11.3% against Comms -7.1% is an 18.4-point spread, and the Dow is 4.2 points ahead of the Nasdaq.</li><li>The rate gave the month back even with the barrel up: 10Y -24bp and 30Y -27bp — October bought duration while the barrel rose 17.6%.</li><li>What decides it: PCE and advance Q3 GDP on 10/29, with the index 0.96% below its high and 1.21% of cushion.</li></ul>","kpi":[["S&P MTD","+1.21%","twenty sessions",0],["Nasdaq","-1.16%","repriced",0],["10Y MTD","-24bp","5.05%",1],["Brent MTD","+17.6%","war premium",1]],"tbl":[["S&P","7,651.54","7,743.98","+1.21%"],["Dow","50,906.05","52,475.10","+3.08%"],["Nasdaq","26,861.06","26,549.85","-1.16%"],["10Y","5.29%","5.05%","-24bp"],["WTI","$90.42","$102.78","+13.7%"],["VIX","16.34","16.91","+3.5%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19","10/20","10/21","10/22","10/23","10/26","10/27","10/28"],"data":[7651.54,7666.45,7722.72,7773.95,7818.93,7801.77,7765.36,7811.54,7807.24,7805.45,7718.94,7744.06,7659.44,7690.73,7712.57,7757.17,7663.43,7623.68,7676.77,7722.6,7743.98],"chains":[{"t":"① October's Round Trip: a Record, a 2.5% Drawdown and a 1.21% Close","main":1,"steps":["Peak on 10/6 at 7,818.93: October's only record close, and its first close above 7,800","Then 10/23: 7,623.68, the month's low close, 2.50% under that peak","The repair came in three closes — 10/26, 10/27 and 10/28 added +0.70%, +0.60% and +0.28% — taking October to +1.21%, 92.44 points above the 9/30 base","The three repricings that shaped the month: wireless on 10/9, the AI complex on 10/12-13 and the CPI-PPI pair on 10/14-15, when the index lost 1.11% in a single close-to-close move","The breadth tell: RSP +4.52% MTD against SPY +1.27% — the average stock is 3.3 points ahead of the index"],"d":"October went from a record to a 2.5% drawdown and back above its base: +1.21% on the index, and 3.3 points more for the average stock.","news":[{"time":"10/6 close","fact":"The S&P 500 closed above 7,800 for the first time, up 0.6% on the day, and the Nasdaq set another record close.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10062026-12160706"},{"time":"10/9","fact":"Shares of the country's largest telecommunications giants are slumping amid worries about growing competition from SpaceX.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10092026-12165767"},{"time":"10/23 close","fact":"The Dow, S&P 500 and Nasdaq finished 1.2%, 0.5% and 0.2% lower on Friday, with the S&P closing at 7,623.68.","src":"Investopedia","u":"https://www.investopedia.com/stock-market-today-dow-jones-s-and-p-500-10232026-12189475"},{"time":"10/28 close","fact":"The S&P 500 closed at 7,743.98 on 10/28, leaving October at +1.21% from 7,651.54 and the index 0.96% below its 10/6 record of 7,818.93.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/%5EGSPC/history"}]},{"t":"② The Month's Split: Energy +11.3%, Comms -7.1%, an 18.4-Point Spread","steps":["Sector map: Energy +11.3%, Staples +7.7%, Utilities +7.7%, Health +6.7%, Materials +6.5% and ConsDisc +6.0% lead the month","Only two sectors are lower, Tech -2.4% and Comms -7.1%, so nine of 11 are positive — the damage is concentrated in the AI complex and the telecoms","The spread: Energy's +11.3% against Comms' -7.1% is 18.4 points, from 17.6 points a session ago as both ends moved","The AI de-rating is still the month's biggest single move: SOXX -8.2% MTD against the S&P's +1.21%, though its last four closes have all been higher","The defensives held: Utilities +7.7% and Staples +7.7% are more than six points ahead of the index","The volatility tell: the VIX is 3.5% higher at 16.91 against a +1.21% index — more swings for a tape that has gone nowhere"],"d":"October redistributed rather than de-risked: the barrel, the pantry and the power bill were funded by the AI complex's de-rating, and the Dow beat the Nasdaq by 4.2 points.","news":[{"time":"10/16","fact":"Slightly more than half of the stocks in the S&P 500 fell, but all but seven of the 75 stocks in the index's tech sector closed lower.","src":"AP","u":"https://apnews.com/article/stocks-markets-us-ai-oil-tech-warsh-d2655f64db7ec8ae450525d58f97b628"},{"time":"10/20","fact":"The S&P 500 value index rose 0.9% compared with a 0.2% drop in its growth counterpart, and the small-cap Russell 2000 finished up 1.7%.","src":"Reuters","u":"https://freemalaysiatoday.com/category/business/2026/10/21/dow-outperforms-as-wall-street-rises-as-healthcare-stocks-lead-gains"},{"time":"10/28 close","fact":"Sector ETF closes from 9/30 to 10/28: Energy +11.3%, Staples +7.7%, Utilities +7.7%, Health +6.7% against Tech -2.4% and Comms -7.1%, with nine of 11 positive and a best-to-worst spread of 18.4 points.","src":"Yahoo Finance","u":"https://finance.yahoo.com/quote/XLE/history"}]},{"t":"③ The Barrel's October: $98.03 to $115.32 on the December Contract","steps":["The path: Brent's December contract started at $98.03, crossed $100 on 10/1, held a $100-107 corridor to 10/15, closed $109.86 on 10/16, $116.72 on 10/23 and $115.32 at the last close","The premium: Houthi strikes on Saudi airports and Aramco sites, then reports that the US could strike Iran after the 11/3 midterms, carried the contract to a $117.44 high on 10/26","The physical data: EIA crude stocks fell 3.06 million barrels in the week to 10/16 and 1.9 million in the week to 10/23, and Hormuz flows averaged 11.7 million barrels a day in October","The scoreboard: Brent +17.6% and WTI +13.7% for the month, both on the December contract, with WTI's gain measured from the $90.42 settlement on 9/30","The rate offset: the 10Y is 24bp lower at 5.05% with Brent up 17.6% — the month treated oil as a growth tax, not an inflation spiral"],"d":"October's barrel: a $98 start, a $117.44 high and a 17.6% month that the bond market treated as a growth tax, not as an inflation spiral.","news":[{"time":"10/21","fact":"US crude stocks fell by 3.06 million barrels to 412.5 million barrels in the week ended 10/16, compared with analysts' expectations for an 820,000-barrel draw.","src":"Reuters","u":"https://au.investing.com/news/commodities-news/oil-rises-on-middle-east-supply-worries-4702921"},{"time":"10/23 settle","fact":"Brent crude futures settled at $116.72 a barrel, up 3.14%, their highest since April 29; WTI closed at $103.27, up 3.8%.","src":"Reuters","u":"https://www.globalbankingandfinance.com/oil-little-changed-supply-concern-lingers-amid-houthi/"},{"time":"10/28 settle","fact":"Brent's December contract settled at $115.32, leaving it up 17.6% for October from $98.03, with WTI at $102.78 for a 2.9% session gain.","src":"CNBC","u":"https://www.cnbc.com/2026/10/28/oil-price-today-wti-brent-hormuz.html"}]}]},"qtd":{"h":"Q4's First Twenty Sessions: +1.21%, Three Prints Banked, Three Verdicts Owed","d":"From 9/30's 7,651.54 to 7,743.98 (+1.21%): a record close, a 5.36% yield print and a hawkish hold are banked; the inflation print, the megacap earnings block and the midterms are not.","badges":["S&P QTD +1.21%","Dow +3.08%","Nasdaq -1.16%","10Y -24bp","Brent +17.6%"],"c1":"Q4 is twenty sessions old and 92.44 points higher: the S&P sits at 7,743.98, +1.21% on the quarter against +2.0% in Q3, with the Dow +3.08% and the Nasdaq -1.16%. Three things are now banked: the quarter's only record close at 7,818.93 on 10/6, an intraday 5.36% on the 10Y on 10/7 — the highest since 2002 — and the Fed's 10-2 hold, which left the target range at 3.75%-4.00%. The composition is a rotation, not a rally: Energy +11.3%, Staples +7.7% and Utilities +7.7% against Tech -2.4% and Comms -7.1%. The 10Y is 24bp lower at 5.05% and the 30Y 27bp lower at 5.37%; Brent is +17.6% and WTI +13.7% on the December contract. Still owed: the inflation print, the megacap earnings block and the midterms — three verdicts, none of them banked, which is why the quarter's entire gain is smaller than one bad session in the AI complex.","c4":"<ul class='play'><li>The quarter has banked three prints, not a direction: +1.21% QTD with the index 0.96% below its 10/6 high and three gates still unplayed.</li><li>The Fed is now a 2026 story, not a Q4 one: a 10-2 hold with 85% December odds means the quarter's risk has moved from the decision to the statement and the long end.</li><li>The rate cushion is the swing: a 5.05% 10Y is 31bp below the 10/7 intraday peak, and one session of 6-7bp back-up is enough to take it out of the utilities and the REITs.</li><li>The oil bill is already in the survey data: a flash selling-price gauge at 59.8 with Brent at $115.32 is the combination that keeps the long end from rallying for the right reason.</li></ul>","kpi":[["S&P QTD","+1.21%","twenty sessions",0],["Dow","+3.08%","old economy",1],["10Y QTD","-24bp","5.05%",1],["Brent QTD","+17.6%","war premium",1]],"tbl":[["S&P","7,651.54","7,743.98","+1.21%"],["Dow","50,906.05","52,475.10","+3.08%"],["Nasdaq","26,861.06","26,549.85","-1.16%"],["10Y","5.29%","5.05%","-24bp"],["Brent","$98.03","$115.32","+17.6%"],["30Y","5.64%","5.37%","-27bp"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19","10/20","10/21","10/22","10/23","10/26","10/27","10/28"],"data":[7651.54,7666.45,7722.72,7773.95,7818.93,7801.77,7765.36,7811.54,7807.24,7805.45,7718.94,7744.06,7659.44,7690.73,7712.57,7757.17,7663.43,7623.68,7676.77,7722.6,7743.98],"chains":[{"t":"① The Quarter's Ledger: a Flat Index, Three Banked Prints, Three Open Verdicts","main":1,"steps":["The standing: 7,651.54 on 9/30 to 7,743.98 — +92.44 points, or 1.21%, against a +2.0% third quarter","Banked: the quarter's only record close, 7,818.93 on 10/6","Banked: an intraday 5.36% on the 10Y on 10/7, a 24-year high, with the highest close 5.31% on 10/5","Banked: the Fed's 10-2 hold at a 3.75%-4.00% target range","Owed: three verdicts — the inflation print, the megacap earnings block and the midterms — none of them ws":[{"time":"10/21","fact":"Personal Income and Outlays for September, which carries the PCE price index, and the advance estimate of third-quarter GDP are both scheduled for October 29 at 8:30 a.m.","src":"BEA","u":"https://www.bea.gov/news/schedule"},{"time":"10/28","fact":"Alphabet will hold its quarterly conference call to discuss third quarter 2026 financial results on Wednesday, October 28, at 1:30 p.m. Pacific (4:30 p.m. Eastern).","src":"Alphabet IR","u":"https://abc.xyz/investor/news/news-details/2026/Alphabet-Announces-Date-of-Third-Quarter-2026-Financial-Results-Conference-Call-2026-8tpGZsLS6v/default.aspx"},{"time":"10/29","fact":"Amazon will hold a conference call to discuss its third quarter 2026 financial results on Thursday, October 29, 2026, at 2:00 p.m. PT / 5:00 p.m. ET.","src":"Amazon IR","u":"https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-to-Webcast-Third-Quarter-2026-Financial-Results-Conference-Call/default.aspx"},{"time":"10/28","fact":"Microsoft will publish fiscal year 2027 first-quarter financial results after the market close on Wednesday, October 28, 2026, with a webcast at 2:30 p.m. Pacific.","src":"Microsoft IR","u":"https://microsoft.com/en-us/investor/events/fy-2027/earnings-fy-2027-q1"},{"time":"10/28","fact":"Third-quarter GDP is expected to show 3.2% growth, and September's PCE report could test bets on the pace of tightening.","src":"Reuters","u":"https://www.kitco.com/news/off-the-wire/2026-10-28/wall-st-treads-water-chips-rise-megacaps-fall-ahead-fed-big-tech"}]}]},"ytd":{"h":"The Bull at +13.13%: AI Capex Carries, an 87bp Rate Bill, a 65.5-Point Sector Spread","d":"S&P +13.13%, Nasdaq +14.23%, Dow +9.18% — AI capex and 31.8% earnings growth carry; a 10Y up 87bp, a $115.32 barrel and a 6.7% gold drawdown tax the rest.","badges":["S&P +13.13%","Nasdaq +14.23%","Dow +9.18%","10Y 5.05%"],"c1":"The year's base case still holds: AI capex and earnings carry the S&P to +13.13% (7,743.98) and the Nasdaq to +14.23%, with the Dow +9.18%; the bull turned four on 10/12. Against it: a 10Y at 5.05% (+87bp YTD), Brent +89.5% and WTI +79.0% since 12/31 as the war grinds into a ninth month, and a hot September CPI (3.7%) and PPI (6.3%). Beneath the index: Energy +53.1% leads the year, Tech +32.7%, Health +16.1% and Materials +14.4%; Comms -12.4% and ConsDisc -3.4% lag, while Utilities are -0.5%. Gold -6.7%, bitcoin -6.8%, the dollar +3.9%. The S&P is 0.96% below its record; the Nasdaq is 3.80% below its 10/6 record close. The earnings base is still widening — 84% of the 200 S&P companies reported have beaten, with Q3 growth tracking 31.8% — which is why an 87bp rate bill has not broken the multiple.","c4":"<ul class='play'><li>The year's engine is intact: AI capex and 31.8% earnings growth have carried the S&P +13.13% through an 87bp rise in the 10Y — earnings are doing the work rates used to do.</li><li>The dispersion is the year's signature: Energy +53.1% against Comms -12.4% is a 65.5-point spread — the index's +13.13% is an average of two very different markets.</li><li>The year's last macro gate is December: a hold on 10/28 is banked and a December hike is 85% priced — that is where the bull's 2027 setup gets set.</li><li>The barrel is the year's biggest swing factor: Brent +89.5% has put a four-year-high selling-price gauge into the October survey, which is why 5.05% on the 10Y looks more like a resting point than a peak.</li></ul>","kpi":[["S&P YTD","+13.13%","bull",1],["Nasdaq","+14.23%","leading",1],["Dow","+9.18%","lagging",1],["10Y","+87bp","2026's tax",0]],"tbl":[["S&P","6,845.5","7,743.98","+13.13%"],["Dow","48,063","52,475.10","+9.18%"],["Nasdaq","23,242","26,549.85","+14.23%"],["10Y","4.18%","5.05%","+87bp"],["30Y","4.84%","5.37%","+53bp"],["Gold","$4,341","$4,051.60","-6.7%"]],"labels":["12/31","3/31","6/30","8/13","9/30","10/1","10/2","10/5","10/6","10/7","10/8","10/9","10/12","10/13","10/14","10/15","10/16","10/19","10/20","10/21","10/22","10/23","10/26","1 st","The Fed: a September hike, the first since 2023, a 10-2 hold on 10/28, and 85% odds of a December increase","The prints: September CPI 3.7% y/y and PPI 6.3% y/y, and a flash selling-price gauge at 59.8 on 10/23, the sharpest since August 2022","The cross-asset echo: the dollar +3.9% and gold -6.7% — real rates, not war, set the tone for both"],"d":"The year's bill: 87bp on the 10Y and 120bp on the 2Y, with inflation re-accelerating into the autumn — September reset the regime, and December is where it gets tested.","news":[{"time":"10/28 close","fact":"From 4.18% at the end of 2025, the 10-year Treasury yield closed at 5.05%, with the 30-year at 5.37% from 4.84% and the 2-year at 4.67% from 3.47%, per the Treasury's daily yield curve.","src":"US Treasury","u":"https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv"},{"time":"10/23","fact":"Selling prices rose at the sharpest rate since August 2022, a pace that S&P Global said indicates consumer price inflation is likely to rise further above the Fed's target in the coming months.","src":"S&P Global","u":"https://www.pmi.spglobal.com/Public/Home/PressRelease/07d16568e63346999890940d47639cd9"}]},{"t":"③ The Year's Two Markets: Energy +53.1%, Comms -12.4% — a 65.5-Point Spread","steps":["The dispersion: Energy +53.1%, Tech +32.7%, Health +16.1% and Materials +14.4% lead; Comms -12.4% and ConsDisc -3.4% are the only sectors down, with Utilities -0.5%","The spread: 65.5 points between the best and worst sector","The index's +13.13% is an average of two markets: the average S&P stock (RSP +13.50%) just edged the cap-weighted SPY (+13.26%)","The October rotation widened the biggest gap: Energy's lead over Tech went from 1.6 points at the 9/30 close to 20.4 points"],"d":"The year's signature is dispersion: a 65.5-point sector spread inside a +13.13% index, with Energy's lead over Tech widenin <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

// FX：按档切片同一条日线序列。today = 最近 11 根（约两周，涨跌 = 日环比）；mtd/qtd/ytd = 基期 bar 起到当日
const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
function fxWindow(p, period, bases) {
  const s = p.series;
  if (period === "today") { const w = s.slice(-11); return { w, ref: w[w.length - 2], label: "1D", refLbl: "prior close", rangeLbl: `${md(w[0][0])}–${md(w[w.length - 1][0])}` }; }
  const b = bases[period];
  let i = 0; s.forEach(([d], k) => { if (d <= b) i = k; });
  const w = s.slice(i);
  return { w, ref: w[0], label: period.toUpperCase(), refLbl: "period start", rangeLbl: `since ${md(w[0][0])}` };
}
function renderFX(period) {
  const card = document.getElementById("fxCard"), FX = SNAP.FX;
  if (!FX || !FX.pairs || !FX.pairs.length) { card.style.display = "none"; return; }
  card.style.display = "";
  const W = 200, H = 56, pad = 4, rows = [];
  document.getElementById("fx").innerHTML = FX.pairs.map((p, n) => {
    const { w, ref, label, rangeLbl } = fxWindow(p, period, FX.bases);
    const last = w[w.length - 1][1], chg = (last / ref[1] - 1) * 100;
    const vals = w.map(x => x[1]), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const X = k => pad + k * (W - 2 * pad) / Math.max(w.length - 1, 1), Y = v => H - pad - (v - lo) / span * (H - 2 * pad);
    const col = chg >= 0 ? "var(--up)" : "var(--down)", sign = chg >= 0 ? "+" : "";
    const pts = w.map((x, k) => `${X(k).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(" ");
    const f = v => v.toFixed(p.dp);
    rows.push(`<tr><td>${p.name}</td><td>${md(ref[0])} ${f(ref[1])}</td><td>${md(w[w.length - 1][0])} ${f(last)}</td><td>${sign}${chg.toFixed(2)}%</td><td>${f(lo)}</td><td>${f(hi)}</td></tr>`);
    const rangeTxt = `${rangeLbl} · range ${f(lo)}–${f(hi)}`;
    return `<div class="fxt" data-n="${n}"><div class="top"><span class="nm">${p.name}</span><span class="dl" style="color:${col}"><i>${chg >= 0 ? "▲" : "▼"}</i>${sign}${chg.toFixed(2)}%</span></div>
<div class="lv">${f(last)}${p.inv ? `<small>${p.inv} ${(1 / last).toFixed(p.dp)}</small>` : ""}<small>${label}</small></div>
<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${p.name} ${rangeLbl}: ${f(ref[1])} to ${f(last)} (${sign}${chg.toFixed(2)}%)">
<line x1="${pad}" x2="${W - pad}" y1="${Y(ref[1]).toFixed(1)}" y2="${Y(ref[1]).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
<line class="xh" y1="0" y2="${H}" stroke="var(--mut)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
</svg><div class="rg" data-def="${rangeTxt}">${rangeTxt}</div></div>`;
  }).join("");
  document.getElementById("fxTbl").innerHTML = `<table><thead><tr><th>Pair</th><th>Start</th><th>End</th><th>Change</th><th>Low</th><th>High</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
  document.getElementById("fxNote").innerText = `Read as base/quote: USD/CAD +0.50% = the US dollar up 0.50% against the Canadian dollar. Line = daily closes over the window (Today tab: last ~2 weeks); dashed line = reference (Today: prior close; MTD/QTD/YTD: period start). ${FX.src}.`;
  // 悬停：十字线 + 在卡片底行显示日期与数值（不用浮层，手机上也不遮挡）
  document.querySelectorAll(".fxt").forEach(t => {
    const p = FX.pairs[+t.dataset.n], { w } = fxWindow(p, period, FX.bases), svg = t.querySelector("svg"), xh = t.querySelector(".xh"), rg = t.querySelector(".rg");
    const move = e => {
      const r = svg.getBoundingClientRect(), x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
      const k = Math.max(0, Math.min(w.length - 1, Math.round((x - pad) / (W - 2 * pad) * (w.length - 1))));
      const px = pad + k * (W - 2 * pad) / Math.max(w.length - 1, 1);
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
      rg.textContent = `${md(w[k][0])} · ${w[k][1].toFixed(p.dp)}`;
    };
    const out = () => { xh.style.display = "none"; rg.textContent = rg.dataset.def; };
    svg.addEventListener("mousemove", move); svg.addEventListener("touchmove", move, { passive: true });
    svg.addEventListener("mouseleave", out); svg.addEventListener("touchend", out);
  });
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  renderFX(period);
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
</body>
</html>
