<style>
:root{
  --paper:#f6efe0;--paper2:#fdf9ee;--ink:#191612;--mut:#6f6552;--faint:#9a8f7a;
  --line:#d9cfb8;--hair:#e6ddc8;--claret:#990f3d;--up:#1f6b45;--down:#990f3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Noto Serif SC",Georgia,"Songti SC","SimSun",serif;
  font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 30% 10%,rgba(255,252,240,.7),transparent 60%),
             radial-gradient(ellipse at 80% 90%,rgba(120,100,60,.08),transparent 55%)}

/* ── masthead ─────────────────────────────── */
.mast{padding:0 40px}
.nameplate{text-align:center;margin:30px 0 2px;font-family:"Playfair Display","Noto Serif SC",serif;
  font-weight:900;font-size:clamp(38px,6vw,72px);letter-spacing:.01em;line-height:1.05}
.nameplate small{display:block;font-family:"Source Serif 4","Noto Serif SC",serif;font-style:italic;
  font-weight:400;font-size:clamp(14px,1.6vw,19px);letter-spacing:.28em;margin-top:8px;color:var(--mut)}
.dateline{text-align:center;font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(22px,3vw,34px);letter-spacing:.04em;margin:18px 0 4px;padding:10px 0;
  border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
.dateline span{color:var(--mut);font-family:"Source Serif 4",serif;font-weight:400;font-style:italic;
  font-size:.55em;letter-spacing:.14em;margin-left:14px;text-transform:uppercase;vertical-align:.18em}

/* ── layout: full width ───────────────────── */
.wrap{padding:30px 40px 48px}
h1{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;
  font-size:clamp(32px,4.4vw,56px);line-height:1.12;margin:6px 0 12px;letter-spacing:-.01em}
.sub{font-size:clamp(17px,1.7vw,21px);color:var(--mut);line-height:1.8;max-width:72ch;
  font-style:italic;margin-bottom:16px}
.daynav{display:inline-flex;align-items:stretch;margin:14px 0 2px;border:1px solid var(--ink);background:var(--paper2)}
.daynav button{background:transparent;border:none;padding:9px 18px;font-size:17px;line-height:1;cursor:pointer;
  font-family:inherit;color:var(--ink)}
.daynav button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.daynav button:disabled{opacity:.25;cursor:default}
.daynav .cur{display:flex;align-items:center;padding:9px 20px;border-left:1px solid var(--ink);border-right:1px solid var(--ink);
  font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.05em;white-space:nowrap}
.err{background:#f6e3e3;border:1px solid var(--claret);padding:10px 14px;font-size:13px;display:none;margin:12px 0}

/* ── section nav (tabs) ───────────────────── */
.tabs{display:flex;gap:0;margin:18px 0 6px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tab{border:none;border-right:1px solid var(--line);background:transparent;color:var(--mut);
  padding:13px 26px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;
  letter-spacing:.2em;text-transform:uppercase}
.tab:first-child{border-left:1px solid var(--line)}
.tab:hover{color:var(--ink);background:var(--paper2)}
.tab.active{background:var(--ink);color:var(--paper)}

/* ── KPI strip ────────────────────────────── */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;
  border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.k{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.k:last-child{border-right:none}
.k .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.k .v{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.k .c{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,2.2vw,30px);font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.k .c i{font-style:normal;font-size:.6em;vertical-align:.22em;margin-right:3px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}.k:nth-child(2n){border-right:none}.k{border-bottom:1px solid var(--line);padding:12px;gap:8px}.k .c{font-size:20px}
.mast{padding:0 18px}.wrap{padding:22px 18px 40px}.card{padding:22px 20px}.chain-card{padding:18px 20px}.tab{padding:12px 18px}}

/* ── cards → newspaper columns ────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper2);border:1px solid var(--ink);border-radius:0;padding:28px 32px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.14)}
.card h2{margin:0 0 18px;padding-bottom:11px;font-family:"Source Serif 4","Noto Serif SC",serif;
  font-size:15px;font-weight:700;color:var(--claret);letter-spacing:.3em;text-transform:uppercase;
  border-bottom:3px solid var(--ink)}
.big{font-size:18.5px;line-height:1.9}
.big::first-letter{font-family:"Playfair Display",serif;font-size:3.4em;font-weight:900;
  float:left;line-height:.82;padding:6px 10px 0 0;color:var(--claret)}

/* ── chains ───────────────────────────────── */
.chains{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.chains{grid-template-columns:1fr}}
.chain-card{background:var(--paper2);border:1px solid var(--ink);border-left:6px solid var(--ink);padding:22px 26px;min-width:0;
  box-shadow:4px 4px 0 rgba(25,22,18,.10)}
.chain-card.main{border-left-color:var(--claret);box-shadow:4px 4px 0 rgba(153,15,61,.18)}
.t{font-family:"Playfair Display","Noto Serif SC",serif;font-weight:900;font-size:23px;margin-bottom:12px;line-height:1.35}
.t i{font-style:normal;font-size:11.5px;letter-spacing:.2em;background:var(--claret);color:#fff;
  padding:3px 10px;margin-right:9px;vertical-align:3px}
.steps{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin:14px 0}
.node{background:var(--paper);border:1px solid var(--ink);padding:6px 14px;font-size:15.5px;font-weight:700}
.arrow{color:var(--claret);font-weight:900;font-size:14px;text-align:center;line-height:1}
.cdesc{font-size:17.5px;color:#4f4636;line-height:1.85;font-style:italic}
.facts{margin:16px 0 0;padding:0;list-style:none}
.fact{border-top:1px solid var(--line);padding:12px 0;font-size:17.5px;line-height:1.9}
.fact b.time{color:var(--claret);margin-right:10px;white-space:nowrap;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase}
.fact a{color:var(--claret);text-decoration:none;font-size:14.5px;border-bottom:1px solid rgba(153,15,61,.35)}
.fact a:hover{background:var(--claret);color:#fff}

.neg{color:var(--down);font-weight:700}.pos{color:var(--up);font-weight:700}

/* ── playbook / footer ────────────────────── */
ul.play{margin:8px 0;padding-left:22px;line-height:1.9;font-size:17.5px}
ul.play li{margin-bottom:6px}
ul.play li::marker{color:var(--claret);font-weight:900}
.foot{color:var(--faint);font-size:13px;line-height:1.85;margin:34px 0 0;padding-top:16px;overflow-wrap:break-word;
  border-top:3px double var(--ink)}

/* ── heat table ───────────────────────────── */
.heat-sec{margin-bottom:16px}
.heat-sec h3{font-size:11.5px;color:var(--mut);margin:14px 0 8px;letter-spacing:.22em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hcell{height:104px;padding:12px 14px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden}
.hcell .hn{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.hcell .hn .hl{display:block;font-weight:400;opacity:.7;font-size:11px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.hcell .hc{font-size:clamp(26px,2.6vw,34px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.015em}
.hcell .hc i{font-style:normal;font-size:.55em;vertical-align:.28em;margin-right:3px}

/* ── narrow phones: tabs in one row, heat list vertical ── */
@media(max-width:560px){
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:11px 4px;font-size:12px;letter-spacing:.12em;text-align:center}
}
@media(max-width:480px){.heat-grid{grid-template-columns:1fr}}
</style>
</head>

a hot core re-arms the long end and pressures the AI complex further.</li><li>The AI fault line to watch: the complex has now repriced two sessions running — watch whether Korea's memory complex stabilizes and whether the equipment names get their guidance back after AMAT's withheld WFE forecast.</li><li>Earnings season's first verdict: beats alone don't pay anymore — watch the rest of the bank cohort and mega-cap tech for the same 'sell the news' treatment.</li></ul>","kpi":[["S&P","7,805.45","-0.02%",0],["Nasdaq","27,204.38","-0.15%",0],["10Y","5.22%","-2bp",0],["WTI","$94.14","+0.4%",1]],"tbl":[["S&P","7,807.24","7,805.45","-0.02%"],["Dow","51,850.55","51,670.10","-0.35%"],["Nasdaq","27,245.90","27,204.38","-0.15%"],["10Y","5.24%","5.22%","-2bp"],["WTI","$93.74","$94.14","+0.4%"],["Gold","$4,190.3","$4,177.6","-0.3%"]],"labels":["10/5","10/6","10/7","10/8","10/9","10/12","10/13"],"data":[7774,7818.9,7801.8,7765.4,7811.5,7807.2,7805.4],"chains":[{"t":"① The AI Complex Cracks Go Global — and the Tape Absorbs It","main":1,"steps":["The trigger stack: China's CXMT detailed a denser memory-cell design (server product targeted by end-2026) and Broadcom CEO Hock Tan warned that AI investors are 'in a casino' — comments that ran all day","The global repricing: South Korea's KOSPI sank more than 5% (Samsung and SK Hynix roughly -8% each, a fifth straight down session); a selloff that started in Seoul hit memory names worldwide","The US read-through: Micron -3.6% and Applied Materials -6.7% (its investor day withheld a wafer-fab-equipment spending forecast) led the declines; Lam Research -2.7% and KLA -3.2% fell with it","The de-rating spread beyond chips: Caterpillar -3.3% as the premium paid for its data-center power business unwound (Deere +2% the tell), with about $600M of Q3 tariff costs adding pressure","The counter-bid: the rout waned into the close — the SOX trimmed its drop to -0.2%; Nvidia +1.0%, AMD +1.9%, Broadcom +0.7%, Intel +1.4%, and megacaps held","The tape: the S&P 500 closed 2 points from Monday's close at 7,805.45 (-0.02%) and the Nasdaq -0.15% — the cracks stayed inside the complex"],"d":"The day's main chain: the AI complex's cracks went global overnight — and the index-level tape still absorbed them, closing flat.","news":[{"time":"10/13","fact":"Chip stocks continued to face pressure after South Korea's KOSPI index fell more than 5%, weighed down by declines in memory stocks Samsung and SK Hynix, deepening a broader sell-off in the chip sector. The pullback came after Chinese memory maker CXMT announced progress on a more efficient design.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"Broadcom CEO Hock Tan likened investors speculating on AI to 'a casino' on Monday. 'A lot of investors have no clue what they are investing in,' the chipmaker's CEO said.","src":"Yahoo Finance (Bloomberg)","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"In South Korea, SK Hynix and Samsung Electronics each fell roughly 8%, extending their losing streaks to five sessions. The two chipmakers account for more than half of the South Korean stock market's total capitalization. CXMT aims to introduce a new server memory product built on its new cell architecture by the end of 2026.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"Shares of Applied Materials fell after the semiconductor equipment maker's Investor Day at SEMICON West disappointed investors who had been counting on a clear wafer fabrication equipment spending forecast; the company explicitly declined to provide a WFE industry outlook, pointing to available cleanroom space, supply-chain constraints and energy infrastructure financing as factors clouding visibility.","src":"Investing.com","u":"https://www.investing.com/news/stock-market-news/why-is-applied-materials-stock-down-7-today-93CH-4947309"},{"time":"10/13","fact":"Caterpillar tumbles as the premium the market paid for its data-center power business comes under pressure, while the rest of the heavy machinery group holds up better (PACCAR -1%, Deere +2%); near-term expenses add pressure, with about $600 million in Q3 tariff costs expected.","src":"24/7 Wall St.","u":"https://247wallst.com/investing/2026/10/13/caterpillar-sinks-5-as-deere-edges-higher-is-the-data-center-power-premium-unwinding/"},{"time":"10/13","fact":"Stocks bounced from session lows as speculation the Fed won't be forced to raise rates aggressively offset lingering worries about elevated oil prices and the outlook for artificial intelligence. Bond yields fell. A rout in chipmakers waned, with a gauge of semiconductor shares recovering most of its decline. Microsoft hit all-time highs.","src":"Bloomberg","u":"https://www.bloomberg.com/news/articles/2026-10-12/stock-market-today-dow-s-p-live-updates"}]},{"t":"② Earnings Day One: the Beats Get Sold","steps":["The referees: JPMorgan posted a rare EPS miss ($5.57 vs $5.90 est; revenue +8% to $50.2B) as Dimon warned the forces 'shift under the surface'; Goldman's profit rose 29%; Wells Fargo and Citi beat","The verdict: the KBW bank index fell 1.4%; Citigroup -5.6% and Wells Fargo -3.1% closed well off their opens despite beats; JPMorgan -0.9%, Goldman -0.2%","What the market punished: Citi's higher credit provisions and lower fee income, and the outlook read; both Citi and Wells Fargo lifted provisions; JPMorgan's dealmaking was 'delayed rather than canceled'","The consumer read: spending and lending still growing (Citi US card spend +11%; charge-offs improving) — the numbers beneath were fine, the tape sold them anyway","Healthcare's day: J&J -5.7% (a device-sales miss outweighed the beat and raised guidance); UnitedHealth erased a 5% opening pop to close at $377.76 (-0.2%) on the Medicare exit impact — Health the worst of 11 sectors (-1.4%)"],"d":"Earnings day one: mostly beats, mostly sold — the market punished the already-priced and the complicated, and healthcare took the worst of it.","news":[{"time":"10/13","fact":"JPMorgan Chase reported profits rose 6% to $15.3 billion, or $5.57 per share — a rare miss against the $5.90 analysts forecast — while net revenue rose 8% to $50.2 billion. CEO Jamie Dimon warned that 'large fiscal deficits, sticky inflation, elevated asset prices, rising interest rates and geopolitical conditions continue to shift under the surface.'","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"JPMorgan executives said on a call with reporters that Wall Street dealmaking remains resilient despite market volatility and higher borrowing costs. 'I would lean more on the side of delayed rather than canceled,' JPMorgan CFO Jeremy Barnum told reporters Tuesday when asked whether dealmaking momentum would pick back up.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"US consumer and business clients remained relatively resilient: JPMorgan's average credit card loans rose 7% from a year earlier, with card charge-offs falling to 2.91% from 3.15%; Citigroup reported US card spending rose 11% while charge-offs improved to 3.6% from 4.0%. Despite relatively healthy credit conditions, both Citi and Wells Fargo increased their total provisions for potential loan losses.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"Citigroup reported third-quarter EPS of $2.85, surpassing the consensus estimate of $2.66, on revenue of $23.85 billion — its best third-quarter revenue in a decade. However, higher credit loss provisions and lower fee income acted as offsetting factors.","src":"Yahoo Finance (Zacks)","u":"https://finance.yahoo.com/markets/stocks/articles/citigroup-q3-earnings-beat-higher-161000419.html"},{"time":"10/13","fact":"Goldman Sachs: Profits surged 29% as its Wall Street trading and dealmaking businesses continued to deliver solid results. UnitedHealth Group: Raised its 2026 profit forecast and reported improved margins in its Optum clinical care unit. Johnson & Johnson: Beat earnings estimates and raised its full-year guidance, but the stock was down on weaker-than-expected sales in its medical device business.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"A 5.1% slide to $377.13 erases roughly $18 billion from the largest US health insurer on the day of its Q3 earnings report, where a beat sat alongside the Medicare exit impact. Moves this size are rare for a Dow component this big.","src":"24/7 Wall St.","u":"https://247wallst.com/cards/the-s-p-500-finished-within-2-6-points-of-where-it-started-gspc-market-bell-01m4vdtnkfjhhmqhg751nwt73d"}]},{"t":"③ The Barrel Splits: Brent Sells Off, Diesel and Refiners Rip","steps":["The round trip: Brent topped $106 overnight — then settled -0.9% at $105.69 as traders weighed more Russian diesel against the weekend's escalation","WTI held the bid: settled +0.4% at $94.14, its highest settlement since Sept. 24, as US-focused supply tightness dominated","The product squeeze: US diesel futures jumped about 5% intraday; gasoline has now tied 2022 for the most days above $4 per gallon in a single year","The friction: Trump downplayed his own diesel deal ('It's not a USA deal') as Republican criticism mounted; a container ship was struck by an unknown projectile in the Strait of Hormuz (UKMTO); Riyadh airport stays shut after the weekend barrage","The equity read: refiners ripped — Valero +4.7%, Marathon Petroleum +4.0%, PBF +7.2%, Par Pacific +8.1% — and Energy led all 11 sectors (+1.8%)"],"d":"The barrel split: crude caught between diplomacy and escalation, but products stayed tight — and the refiners got paid.","news":[{"time":"10/13","fact":"CRUDE WRAP: WTI (X6) settles USD 0.40 higher at 94.14/bbl; Brent (Z6) settles USD 0.96 lower at 105.69/bbl.","src":"Newsquawk","u":"https://www.newsquawk.com/headlines/crude-wrap--wti-x6-settles-usd-040-higher-at-usd-9414bbl-brent-z6-settles-usd-096-lower-at-usd-10569bbl"},{"time":"10/13","fact":"Oil prices fell on Tuesday after Brent crude topped $106 per barrel and gasoline prices tied 2022 for the most days above $4 per gallon in a single year.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"President Trump has begun to downplay his new deal with Russia after a plan to allow imports of Russian diesel into the US came under withering criticism, even from members of his own party. 'It's a deal for the world ... It's not a deal with me,' Trump told reporters on Tuesday morning, repeating that it was 'not a USA deal.'","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"Diesel futures jump, signaling higher prices: on Oct. 13, 2026, US diesel futures were up 5% by midday; Brent traded around $106 per barrel.","src":"NBC News","u":"https://www.nbcnews.com/business/energy/diesel-futures-higher-prices-trump-moves-rcna603218"},{"time":"10/13","fact":"UKMTO says it has received a report of an incident within the Strait of Hormuz on October 13th; a verified source has reported that a container ship was struck by an unknown projectile.","src":"Newsquawk","u":"https://www.newsquawk.com/headlines/ukmto-says-it-has-received-a-report-of-an-incident-within-the-strait-of-hormuz-on-october-13th-a-verified-source-has-reported-that-a-container-ship-was-struck-by-an-unknown-projectile"},{"time":"10/13","fact":"Saudi Arabia said it was facing a new barrage of incoming fire and that Riyadh airport would remain shut for now, days after Saturday's deadly missile strike on a departure terminal that was claimed by Yemen's Iran-allied Houthis.","src":"CNBC","u":"https://www.cnbc.com/2026/10/13/gold-eases-on-firm-dollar-spotlight-on-us-inflation-data.html"}]},{"t":"④ The Offsets: Yields Ease as Energy Cools — and the 5.9% Question","steps":["The rates relief: with cash trading back open after Columbus Day, the 10Y fell to 5.22% (30Y -4bp to 5.56%) as the energy retreat eased the inflation trade","The dollar stepped back: DXY slipped 0.4% to 102.2, off the 18-month high set in the previous session","Gold held the line: Dec futures slipped 0.3% to $4,177.6 — a firm dollar vs CPI-haven demand","Positioning: BofA's survey says fund managers won't rotate from stocks to bonds until the 10Y hits 5.9%; the VIX sat at 15.27","The subtext: no forced hike, no oil shock — the day's calm was policy and positioning, not conviction"],"d":"What kept the day from getting worse: yields eased, the dollar cooled — and positioning data shows the market isn't done debating the 10Y.","news":[{"time":"10/13","fact":"The 10-year Treasury note yield fell on Tuesday after energy prices stabilized, as investors looked ahead to key economic data releases this week. The yield fell more than 2 basis points; the 30-year was down more than 3 basis points; the 2-year was unchanged at 4.791%. U.S. Treasury markets reopened for trade Tuesday after closing Monday for the Columbus Day holiday.","src":"CNBC","u":"https://www.cnbc.com/2026/10/13/us-treasurys-bonds-yields.html"},{"time":"10/13","fact":"Fund managers won't dump stocks for bonds until yields hit 5.9%, BofA survey says. According to the BofA Funds manager survey, investors say that a 10-year Treasury yield of 5.9% is required to flip asset allocation from stocks to bonds.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"Gold prices eased on Tuesday as the US dollar held firm, while markets focused on upcoming US inflation prints for fresh signals on the Federal Reserve's interest-rate trajectory. The US dollar lingered near an 18-month high scaled in the previous session, making dollar-denominated metals more expensive for holders of other currencies. 'US CPI data will be critical for gold in the short-term,' said Kyle Rodda, senior financial market analyst at Capital.com.","src":"CNBC","u":"https://www.cnbc.com/2026/10/13/gold-eases-on-firm-dollar-spotlight-on-us-inflation-data.html"}]},{"t":"⑤ The Gates: CPI Eve — and What Earnings Must Prove","steps":["Tomorrow's print: September CPI is expected at 3.7% y/y (core 2.5%) — up from August's 3.4%, the fastest since May","The hike trade: ~21% for October, ~88% for December (CME FedWatch) — and Cleveland's Hammack says the Fed should move 'relatively quickly' to a more restrictive stance","The season's bar: BofA's Subramanian says beats have become the status quo — the market wants 2027 durability, not another in-line quarter","The risk radar: the IMF cites AI slowdown and spiking yields among looming global market risks","The supply question: if AI builders can't get the chips and equipment they need, the profit math behind the records breaks — Tuesday's rout was a live demo"],"d":"The gates: CPI tomorrow with December odds near 88% — and an earnings season that must prove beats can still move the needle.","news":[{"time":"10/13","fact":"September's annual inflation rate — due out Wednesday — is expected to come in at 3.7%, according to consensus forecasts, up from August's 3.4% print. Consumer prices, which exclude food and energy, are expected to rise to 2.5% from 2.4% in August on an annualized basis.","src":"CNBC","u":"https://www.cnbc.com/2026/10/13/us-treasurys-bonds-yields.html"},{"time":"10/13","fact":"Traders see only a 21% chance of a Fed rate hike this month but are pricing in an 88% chance of a December increase, according to CME's FedWatch tool. Cleveland Fed President Beth Hammack said the US central bank should move 'relatively quickly' to a more restrictive monetary policy stance to control inflation, which she feels has become broader-based.","src":"CNBC","u":"https://www.cnbc.com/2026/10/13/gold-eases-on-firm-dollar-spotlight-on-us-inflation-data.html"},{"time":"10/13","fact":"After two quarters of big, positive surprises — and index gains to show for it — healthy earnings beats have become the status quo, according to Bank of America strategist Savita Subramanian. 'Ultimately, index [earnings per share] remains highly dependent on the durability of the AI capex cycle and successful monetization,' she wrote.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"IMF cites AI slowdown, spiking yields as looming global market risks.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"},{"time":"10/13","fact":"AI bubble worriers should be more concerned about supply risk as companies build out AI infrastructure than with valuations being above historical norms. If tech companies can't get the equipment they need — such as AI and memory chips — there is no way they can meet robust profit predictions.","src":"Yahoo Finance","u":"https://finance.yahoo.com/markets/live/stock-market-today-tuesday-october-13-dow-sp-500-nasdaq-chip-stocks-192419999.html"}]}]},"mtd":{"h":"October, Nine Sessions In: +2.01% — Records, a Ceiling, and a Global AI Repricing","d":"S&P 7,651.5 to 7,805.45 (+2.01% MTD): nine sessions delivered two record closes, a 2002-ceiling re-tested at 24-year highs — and the AI complex's repricing went global over the last two sessions.","badges":["S&P MTD +2.01%","Nasdaq +1.28%","10Y -7bp","Brent +7.8%"],"c1":"Nine sessions into October, the month has its arc: two record closes (the first above 7,800), the 2002 ceiling re-tested three times at 24-year highs — and the AI complex has now repriced for two straight sessions (10/12-13), going global. The S&P is +2.01% MTD at 7,805.45, the Nasdaq +1.28%, the Dow +1.50%. The fuel: October odds at ~21%, a live deal tape, AI compounding. The tax: a 10Y that ends the window at 5.22% (-7bp MTD) after printing fresh 24-year highs; the barrel at $105.69 Brent (+7.8% on the December basis); gold -0.2%; the dollar +0.7%. Beneath: Energy (+9.3%) and Utilities (+6.2%) lead sectors, while Tech (+0.3%) has slid to the bottom of the pack. Gates: CPI (Oct 14), the Oct 28 meeting — and earnings must validate the AI revenue math.","c4":"<ul class='play'><li>October's verdict so far: dovish-ish odds + a live deal tape + AI compounding beat the 10Y — but only while the 10Y stays under its 24-year highs; the ceiling is tested, not removed.</li><li>The dispersion signature keeps compounding: the barrel's beneficiaries and bottlenecks get paid; wireless incumbents and the AI complex's crowded corners get taxed.</li><li>Earnings season is the month's referee — the ~25% Q3 profit expectation is what the records are priced against.</li></ul>","kpi":[["S&P MTD","+2.01%","nine sessions",1],["Nasdaq","+1.28%","records",1],["10Y MTD","-7bp","ceiling held",1],["WTI MTD","+4.1%","re-armed",1]],"tbl":[["S&P","7,651.54","7,805.45","+2.01%"],["Dow","50,906.05","51,670.10","+1.50%"],["Nasdaq","26,861.06","27,204.38","+1.28%"],["10Y","5.29%","5.22%","-7bp"],["WTI","$90.42","$94.14","+4.1%"],["VIX","16.34","15.27","-6.5%"]],"labels":["9/30","10/1","10/2","10/5","10/6","10/7","10/8", <script>
let SNAP = null, PERIOD = "today";
const PERIODS = [["today", "Today"], ["mtd", "MTD"], ["qtd", "QTD"], ["ytd", "YTD"]];

function heatColor(v) {
  const t = String(v).trim();
  let up = t.startsWith("+"), dn = t.startsWith("-");
  if (!up && !dn) {
    if (/rally|surge|jump|soar/i.test(t)) up = true;
    else if (/high|low|plunge|slump|selloff/i.test(t)) dn = true;
    else return "background:#ece3cd;color:#6f6552";
  }
  const m = t.match(/\d+(?:\.\d+)?/);
  let n = /^[+-]?[\d.]+\s*(bp|pp)?$/.test(t) && m ? parseFloat(m[0]) : 2.5;
  if (/bp/.test(t)) n /= 10;
  if (/pp/.test(t)) n /= 2;
  const a = Math.min(Math.max(n / 4, 0.08), 1);
  const rgb = up ? "31,107,69" : "153,15,61";
  const deep = up ? "#14532d" : "#6d0a2c";
  return `background:rgba(${rgb},${(0.12 + 0.88 * a).toFixed(2)});color:${a > 0.5 ? "#fdf9ee" : deep}`;
}

function fmtRet(v) {
  const t = String(v).trim();
  return /^[+-]?\d+(\.\d+)?$/.test(t) ? t + "%" : t;
}

function render(period) {
  PERIOD = period;
  const P = SNAP.P, HEAT = SNAP.HEAT, d = P[period];
  document.getElementById("headline").innerText = d.h;
  const deck = document.getElementById("deck");
  deck.innerText = d.d;
  deck.style.display = d.d ? "" : "none";
  document.getElementById("c1").innerHTML = d.c1;
  document.getElementById("c4").innerHTML = d.c4;
  document.getElementById("kpi").innerHTML = d.kpi.map(x => { const t = String(x[2]); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="k"><div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div><div class="c ${x[3] ? "pos" : "neg"}">${ar}${t}</div></div>`; }).join("");
  document.getElementById("chTitle").innerText = "The Chains";
  document.getElementById("chains").innerHTML = d.chains.map(c => `<div class="chain-card ${c.main ? "main" : ""}"><div class="t">${c.main ? "<i>MAIN</i>" : ""}${c.t}</div><div class="steps">${c.steps.map((s, i) => `${i ? '<span class="arrow">↓</span>' : ""}<span class="node">${s}</span>`).join("")}</div><div class="cdesc">${c.d}</div><ul class="facts">${(c.news || []).map(n => `<li class="fact"><b class="time">${n.time}</b>${n.fact} <a href="${n.u}" target="_blank" rel="noopener">[${n.src} ↗]</a></li>`).join("")}</ul></div>`).join("");
  document.getElementById("heat").innerHTML = (HEAT[period] || HEAT.today).map(g => `<div class="heat-sec"><h3>${g.sec}</h3><div class="heat-grid">${g.items.map(it => { const t = String(it[2]).trim(); const ar = t.startsWith("+") ? "<i>▲</i>" : t.startsWith("-") ? "<i>▼</i>" : ""; return `<div class="hcell" style="${heatColor(it[2])}"><div class="hn">${it[0]}${it[1] && it[1] !== "—" ? `<span class="hl">${it[1]}</span>` : ""}</div><div class="hc">${ar}${fmtRet(it[2])}</div></div>`; }).join("")}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.p === period));
  document.getElementById("foot").innerText = SNAP.foot || "";
}

function formatDate(dateStr, style) {
  try { return new Date(dateStr + "T12:00:00").toLocaleDateString("en-US", style); }
  catch (e) { return dateStr; }
}

async function init() {
  const errBox = document.getElementById("err");
  const params = new URLSearchParams(location.search);
  const want = params.get("date");
  const embedded = JSON.parse(document.getElementById("embedded-snap").textContent);
  let list = null;
  try {
    const r = await fetch("snapshots/index.json", { cache: "no-store" });
    if (r.ok) list = await r.json();
  } catch (e) { /* file:// 下 fetch 不可用，走内嵌兜底 */ }
  if (!Array.isArray(list) || !list.length) list = [embedded.date];
  const date = (want && list.includes(want)) ? want : list[list.length - 1];
  let snap = null, via = "";
  try {
    const r = await fetch(`snapshots/${date}.json`, { cache: "no-store" });
    if (r.ok) { snap = await r.json(); via = "snapshot"; }
  } catch (e) { /* file:// 兜底 */ }
  if (!snap) {
    if (date === embedded.date) { snap = embedded; via = "embedded"; }
    else {
      errBox.style.display = "block";
      errBox.innerText = `Failed to load snapshots/${date}.json (browsers block fetch under file://). Serve over http instead: npx serve . or python -m http.server — or use ?date=${embedded.date} for the embedded snapshot.`;
      return;
    }
  }
  SNAP = snap;
  document.title = `Bay Street Updates · ${snap.date}`;
  document.getElementById("topdate").innerHTML = `${formatDate(snap.date, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}<span>U.S. Close</span>`;
  const i = list.indexOf(date);
  document.getElementById("curDay").innerText = formatDate(date, { month: "short", day: "numeric", year: "numeric" });
  const prev = document.getElementById("prevDay"), next = document.getElementById("nextDay");
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => { location.search = `?date=${list[i - 1]}`; };
  next.onclick = () => { location.search = `?date=${list[i + 1]}`; };
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = PERIODS.map(([k, label]) => `<button class="tab" data-p="${k}">${k === "today" ? formatDate(SNAP.date, { month: "short", day: "numeric" }) : label}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => render(b.dataset.p));
  render("today");
}
init();
</script>
